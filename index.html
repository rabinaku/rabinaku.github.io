// ================= VERSI DATA (dipisah per bagian) =================
/* Dulu seluruh aplikasi memakai satu nomor versi, sehingga satu guru menyimpan satu nilai
   membuat semua hasil hitungan semua orang terbuang. Sekarang tiap bagian punya nomor sendiri:
     w = data WBP & foto   n = penilaian   a = kehadiran
     k = kelompok & libur  s = pengaturan  u = pengguna
   Nomor "susun ulang" (VERU_) hanya dinaikkan bila ada baris yang diubah di tempat atau dihapus,
   sebab penambahan di bawah bisa dibaca sebagian saja. */
const BAGIAN_VERSI = ["w", "n", "a", "k", "s", "u"];
let _VER = null;

function capVersi_() {
  if (_VER) return _VER;
  let p = {};
  try { p = PropertiesService.getScriptProperties().getProperties() || {}; } catch (e) { p = {}; }
  const v = {};
  BAGIAN_VERSI.forEach(b => {
    v[b] = String(p["VER_" + b] || p.DATA_VER || "0");
    v[b + "U"] = String(p["VERU_" + b] || "0");
  });
  v.semua = BAGIAN_VERSI.map(b => v[b] + ":" + v[b + "U"]).join("|");
  _VER = v;
  return v;
}

/* bagian: huruf bagian yang berubah, misalnya "n" atau "nw". Kosong = semua bagian.
   susunUlang: true bila ada baris yang diubah di tempat atau dihapus. */
function naikVersi_(bagian, susunUlang) {
  const daftar = bagian ? String(bagian).split("").filter(x => BAGIAN_VERSI.indexOf(x) !== -1) : BAGIAN_VERSI.slice();
  if (!daftar.length) return;
  // waktu + acak: dua perubahan pada milidetik yang sama tetap menghasilkan nomor berbeda
  const cap = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const baru = {};
  daftar.forEach(b => {
    baru["VER_" + b] = cap;
    if (susunUlang) baru["VERU_" + b] = cap;
  });
  try { PropertiesService.getScriptProperties().setProperties(baru); } catch (e) { /* abaikan */ }
  _VER = null;
  _MODEL = null;
}
function versiData_() { return capVersi_().semua; }

// ================= CACHE (dikompres, bisa > 100KB) =================

function cacheSimpan_(key, obj, detik) {
  try {
    const blob = Utilities.gzip(Utilities.newBlob(JSON.stringify(obj), "application/json"));
    const b64 = Utilities.base64Encode(blob.getBytes());
    const ukuran = 90000;
    const n = Math.ceil(b64.length / ukuran);
    if (n > 20) return;
    const peta = {};
    for (let i = 0; i < n; i++) peta[key + "#" + i] = b64.substr(i * ukuran, ukuran);
    peta[key + "#n"] = String(n);
    CacheService.getScriptCache().putAll(peta, detik || CACHE_DETIK);
  } catch (e) { /* cache hanya pelengkap */ }
}

function cacheAmbil_(key) {
  try {
    const c = CacheService.getScriptCache();
    const n = parseInt(c.get(key + "#n") || "0", 10);
    if (!n) return null;
    const kunci = [];
    for (let i = 0; i < n; i++) kunci.push(key + "#" + i);
    const hasil = c.getAll(kunci);
    let b64 = "";
    for (let i = 0; i < kunci.length; i++) {
      if (!hasil[kunci[i]]) return null;
      b64 += hasil[kunci[i]];
    }
    const blob = Utilities.newBlob(Utilities.base64Decode(b64), "application/x-gzip");
    return JSON.parse(Utilities.ungzip(blob).getDataAsString());
  } catch (e) { return null; }
}

function sidik_(s) {
  const bytes = Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, s, Utilities.Charset.UTF_8);
  return bytes.slice(0, 6).map(b => ("0" + (b & 0xFF).toString(16)).slice(-2)).join("");
}

/* Keadaan tiap WBP pada saat pengarsipan. Sheet ini hanya ada bila admin pernah
   memindahkan data lama, jadi ketiadaannya normal dan tidak perlu membuat sheet baru. */
function bacaDasarArsip_() {
  const ss = ss_();
  const sh = ss.getSheetByName(NAMA.DASAR);
  if (!sh || sh.getLastRow() < 2) return null;
  const t = tabel_("DASAR"), c = t.c;
  const out = {};
  for (let i = 1; i < t.v.length; i++) {
    const r = t.v[i];
    const id = String(r[c.ID_WBP] || "").trim();
    if (!id) continue;
    const o = out[id] = out[id] || { lp: "", lt: "", ht: "" };
    o.lp = fmtTgl_(r[c.Log_Pertama]) || o.lp;
    o.lt = fmtTgl_(r[c.Log_Terakhir]) || o.lt;
    o.ht = fmtTgl_(r[c.Hadir_Terakhir]) || o.ht;
    const p = String(r[c.Kategori] || "").trim();
    if (!LEVEL_MAP[p]) continue;
    o[p] = {
      rk: levelValid_(p, r[c.Rekor]) ? levelIdx_(p, r[c.Rekor]) : -1,
      sk: levelValid_(p, r[c.Sekarang]) ? levelIdx_(p, r[c.Sekarang]) : -1,
      ct: fmtTgl_(r[c.Tanggal_Capai]) || "",
      ca: bool_(r[c.Capai_Asesmen])
    };
  }
  return out;
}

function muatModel_() {
  if (_MODEL) return _MODEL;
  const at = aturan_();
  const hariIni = hariIni_();

  // ----- Libur -----
  const L = tabel_("LIBUR"), lc = L.c;
  const libur = [], liburPerTgl = {};
  for (let i = 1; i < L.v.length; i++) {
    const r = L.v[i];
    const tgl = fmtTgl_(r[lc.Tanggal]);
    if (!tgl) continue;
    // Lingkup: Semua, Putra (WBP laki-laki saja), atau Putri (WBP perempuan saja).
    // Libur lama yang khusus satu kelompok/lokasi tidak berlaku lagi.
    const lingkup = lingkupLibur_(r[lc.Lingkup]);
    if (!lingkup) continue;
    const x = { tgl: tgl, ket: String(r[lc.Keterangan] || ""), lingkup: lingkup, row: i + 1 };
    libur.push(x);
    (liburPerTgl[tgl] = liburPerTgl[tgl] || []).push(x);
  }

  // ----- WBP -----
  const W = tabel_("WBP"), c = W.c;
  const ambil = (r, kol) => (c[kol] === undefined || r[c[kol]] === undefined || r[c[kol]] === null) ? "" : r[c[kol]];
  const wbp = [], byId = {};
  for (let i = 1; i < W.v.length; i++) {
    const r = W.v[i];
    const id = String(ambil(r, "ID_WBP")).trim();
    if (!id) continue;
    const w = {
      row: i + 1, id: id, nama: String(ambil(r, "Nama_WBP")).trim(), jk: normJk_(ambil(r, "Jenis_Kelamin")),
      alamat: String(ambil(r, "Alamat")), blok: String(ambil(r, "Blok")),
      hari: parseHari_(ambil(r, "Hari_Jadwal")),
      tglMasuk: fmtTgl_(ambil(r, "Tanggal_Masuk")), arsip: bool_(ambil(r, "Arsip")),
      tglKeluar: fmtTgl_(ambil(r, "Tanggal_Keluar")), alasanKeluar: String(ambil(r, "Alasan_Keluar") || ""),
      pengajar: /^pengajar$/i.test(String(ambil(r, "Peran")).trim()),
      stSheet: String(ambil(r, "Status")), tlSheet: fmtTgl_(ambil(r, "Tanggal_Lulus")),
      awal: {}, target: {}, ikut: {}, awalVal: {}, targetVal: {}, skSheet: {}
    };
    PROGRAM.forEach(p => {
      const aw = String(ambil(r, "Level_Awal_" + p));
      const tg = String(ambil(r, "Level_Target_" + p));
      w.awalVal[p] = aw;
      w.targetVal[p] = tg;
      w.skSheet[p] = String(ambil(r, "Level_Sekarang_" + p));
      w.ikut[p] = levelNyata_(p, aw);
      w.awal[p] = w.ikut[p] ? levelIdx_(p, aw) : -1;
      w.target[p] = levelNyata_(p, tg) ? levelIdx_(p, tg) : -1;
    });
    wbp.push(w);
    byId[id] = w;
  }

  // ----- Riwayat penilaian -----
  const G = tabel_("LOG"), gc = G.c;
  const logs = {};
  for (let i = 1; i < G.v.length; i++) {
    const r = G.v[i];
    const id = String(r[gc.ID_WBP] || "").trim();
    const p = String(r[gc.Kategori] || "").trim();
    if (!id || !LEVEL_MAP[p]) continue;
    const tgl = fmtTgl_(r[gc.Tanggal_Input]);
    if (!tgl) continue;
    const val = String(r[gc.Level_Tercapai]);
    (logs[id] = logs[id] || []).push({
      id: String(r[gc.ID_Monitoring] || ""), tgl: tgl, p: p, val: val, lv: levelNyata_(p, val) ? levelIdx_(p, val) : -1,
      jenis: normJenis_(r[gc.Jenis]), cat: String(r[gc.Catatan_Pembina] || ""), oleh: String(r[gc.Diinput_Oleh] || ""), row: i + 1
    });
  }
  Object.keys(logs).forEach(id => logs[id].sort((a, b) => (a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : a.row - b.row)));
  const logTgl = {};
  Object.keys(logs).forEach(id => { const o = logTgl[id] = {}; logs[id].forEach(g => { o[g.tgl] = true; }); });

  // ----- Absensi -----
  const A = tabel_("ABS"), ac = A.c;
  const abs = {};
  for (let i = 1; i < A.v.length; i++) {
    const r = A.v[i];
    const id = String(r[ac.ID_WBP] || "").trim();
    const tgl = fmtTgl_(r[ac.Tanggal]);
    const st = normStatus_(r[ac.Status]);
    if (!id || !tgl || !st) continue;
    (abs[id] = abs[id] || {})[tgl] = { st: st, ket: String(r[ac.Keterangan] || ""), oleh: String(r[ac.Dicatat_Oleh] || ""), row: i + 1 };
  }

  // ----- Dasar arsip (keadaan tiap WBP saat data lama dipindahkan) -----
  const dasar = bacaDasarArsip_();

  const ganti = {};
  bacaGanti_().forEach(x => { (ganti[x.tgl] = ganti[x.tgl] || {})[x.jk] = x; });

  _MODEL = { at: at, hariIni: hariIni, libur: libur, liburPerTgl: liburPerTgl, ganti: ganti,
    wbp: wbp, byId: byId, logs: logs, logTgl: logTgl, abs: abs, dasar: dasar };
  return _MODEL;
}

// Jadwal belajar seorang WBP (diisi di Data WBP)
function hariWbp_(M, w) { return w.hari || []; }
// Apakah WBP dijadwalkan belajar pada tanggal ini
// Terjadwal = hari jadwalnya cocok dan tidak sedang libur khusus untuk jenis kelaminnya
// (libur untuk semua tetap dihitung terjadwal seperti sebelumnya; ditandai sebagai hari libur)
// Jadwal pengganti mengubahnya: kelompok "panggil" ikut terjadwal, kelompok hari itu bisa diliburkan.
function wbpTerjadwal_(M, w, tgl) {
  if (w.arsip) return false;
  const hr = w.hari || [], g = M.ganti && M.ganti[tgl] && M.ganti[tgl][w.jk];
  if (g && hr.indexOf(g.panggil) !== -1) return true;
  if (hr.indexOf(namaHari_(tgl)) === -1 || liburKhusus_(M, tgl, w.jk)) return false;
  return !(g && g.libur);
}
// Libur umum pada tanggal ini (null bila bukan hari libur)
function liburTgl_(M, tgl) { const a = M.liburPerTgl[tgl]; return (a && a.find(x => x.lingkup === "Semua")) || null; }
// Libur khusus putra/putri yang mengenai jenis kelamin ini
function liburKhusus_(M, tgl, jk) {
  const a = M.liburPerTgl[tgl], lk = jk === "L" ? "Putra" : jk === "P" ? "Putri" : "";
  return (lk && a && a.find(x => x.lingkup === lk)) || null;
}
// Libur yang berlaku untuk WBP ini (umum atau khusus jenis kelaminnya)
function liburWbp_(M, tgl, jk) { return liburTgl_(M, tgl) || liburKhusus_(M, tgl, jk); }
// Ringkasan libur khusus pada tanggal ini: { L: "ket", P: "ket" }
function liburJk_(M, tgl) {
  const o = {}, a = M.liburPerTgl[tgl] || [];
  a.forEach(x => { if (x.lingkup === "Putra") o.L = x.ket || "Libur"; else if (x.lingkup === "Putri") o.P = x.ket || "Libur"; });
  return o;
}

function adaNilai_(M, id, tgl) { return !!(M.logTgl[id] && M.logTgl[id][tgl]); }

// Level terakhir dan rekor SEBELUM tanggal tertentu (acuan saat mengisi atau memeriksa satu sesi)
function sebelumTgl_(M, w, p, tgl) {
  let lv = w.awal[p], rk = w.awal[p];
  (M.logs[w.id] || []).forEach(g => {
    if (g.p !== p || g.lv < 0 || g.tgl >= tgl) return;
    lv = g.lv;
    if (g.lv > rk) rk = g.lv;
  });
  return { lv: lv, rk: rk };
}

// Kehadiran bulan berjalan per tanggal, ringkas: satu huruf per tanggal sampai hari ini
// ("-" belum ada catatan, H hadir, I izin, S sakit, A alpa) -> untuk kalender runtun di kartu WBP
function kalenderBulan_(M, a) {
  const awal = M.hariIni.slice(0, 8) + "01", n = +M.hariIni.slice(8, 10);
  const isi = new Array(n).fill("-");
  a.presensi.forEach(x => { if (x[0] >= awal && x[0] <= M.hariIni) isi[+x[0].slice(8, 10) - 1] = x[1].charAt(0); });
  return isi.join("");
}

// ----- Peringkat (gaya game) berdasarkan progres rekor menuju target -----
// Warrior 0-14, Elite 15-29, Master 30-44, Grandmaster 45-59, Epic 60-74, Legend 75-89, Mythic 90+,
// lulus semua target = Mythic Glory. Tiap peringkat (kecuali Mythic) punya divisi III, II, I.
const PERINGKAT = [["warrior", "Warrior", 0], ["elite", "Elite", 15], ["master", "Master", 30], ["grandmaster", "Grandmaster", 45],
  ["epic", "Epic", 60], ["legend", "Legend", 75], ["mythic", "Mythic", 90]];
function tier_(persen, lulus) {
  if (lulus) return { kode: "glory", nama: "Mythic Glory", bintang: 0 };
  persen = Math.max(0, Math.min(100, +persen || 0));
  let i = 0;
  while (i < PERINGKAT.length - 1 && persen >= PERINGKAT[i + 1][2]) i++;
  const p = PERINGKAT[i];
  if (p[0] === "mythic") return { kode: p[0], nama: p[1], bintang: 0 };
  return { kode: p[0], nama: p[1], bintang: 3 - Math.min(2, Math.floor((persen - p[2]) / 5)) };   // 3 = divisi III ... 1 = divisi I
}

// ============================================================================
//  ANALISIS PER WBP (rekor, kenaikan sah, status, tanda tidak wajar)
// ============================================================================
function analisis_(M, w) {
  if (w._a) return w._a;
  const at = M.at;
  const semuaLog = M.logs[w.id] || [];
  const L = semuaLog.filter(g => g.tgl <= M.hariIni);
  const ab = M.abs[w.id] || {};
  // Keadaan yang diwarisi dari data yang sudah diarsipkan (bila ada)
  const ds = (M.dasar && M.dasar[w.id]) || null;
  const awalDs = ds && ds.lp && (!L.length || ds.lp < L[0].tgl) ? ds.lp : (L.length ? L[0].tgl : "");
  const a = {
    sekarang: {}, rekor: {}, gains: [], lonjakan: [], turun: [],
    logPertama: awalDs, logTerakhir: L.length ? L[L.length - 1].tgl : ((ds && ds.lt) || ""), hadirTerakhir: ""
  };

  // Presensi gabungan: bila ada penilaian pada suatu tanggal, WBP dianggap hadir
  const pres = {};
  Object.keys(ab).forEach(t => { pres[t] = ab[t].st; });
  L.forEach(g => { pres[g.tgl] = "Hadir"; });
  a.presensi = Object.keys(pres).filter(t => t <= M.hariIni).sort().map(t => [t, pres[t]]);
  a.presensi.forEach(x => { if (x[1] === "Hadir") a.hadirTerakhir = x[0]; });
  if (!a.hadirTerakhir && ds && ds.ht) a.hadirTerakhir = ds.ht;

  const pertama = [a.logPertama, a.presensi.length ? a.presensi[0][0] : ""].filter(Boolean).sort()[0] || "";
  a.mulai = w.tglMasuk || pertama;
  a.orientasiAkhir = (a.mulai && at.orientasi > 0) ? tambahHari_(a.mulai, at.orientasi * 7) : "";

  const capai = {}, naikTerakhir = {};
  PROGRAM.forEach(p => {
    if (!w.ikut[p]) return;
    const d0 = ds ? ds[p] : null;
    let rekor = (d0 && d0.rk > w.awal[p]) ? d0.rk : w.awal[p];
    let sek = (d0 && d0.sk >= 0) ? d0.sk : w.awal[p];
    const tIdx = w.target[p];
    const perMinggu = {};
    capai[p] = (d0 && d0.ct) ? { tgl: d0.ct, asesmen: !!d0.ca }
      : ((tIdx >= 0 && rekor >= tIdx) ? { tgl: "", asesmen: true } : null);
    L.forEach(g => {
      if (g.p !== p || g.lv < 0) return;
      sek = g.lv;
      if (g.lv > rekor) {
        const naik = g.lv - rekor;
        let alasan = "";
        if (g.jenis === "Asesmen") alasan = "asesmen";
        else if (a.orientasiAkhir && g.tgl < a.orientasiAkhir) alasan = "orientasi";
        else if (at.resmi && g.tgl < at.resmi) alasan = "sebelum_resmi";
        let n = 0;
        if (!alasan) {
          n = naik;
          if (at.batasNaik > 0) {
            const mg = mingguKe_(g.tgl);
            const sudah = perMinggu[mg] || 0;
            n = Math.max(0, Math.min(naik, at.batasNaik - sudah));
            perMinggu[mg] = sudah + n;
            if (n < naik) alasan = "batas_mingguan";
          }
          if (naik >= 2) a.lonjakan.push({ tgl: g.tgl, p: p, dari: rekor, ke: g.lv, naik: naik, idLog: g.id });
        }
        a.gains.push({ tgl: g.tgl, p: p, naik: naik, n: n, alasan: alasan, idLog: g.id });
        rekor = g.lv;
        naikTerakhir[p] = g.tgl;
      }
      if (tIdx >= 0 && !capai[p] && g.lv >= tIdx) capai[p] = { tgl: g.tgl, asesmen: g.jenis === "Asesmen" };
    });
    a.sekarang[p] = sek;
    a.rekor[p] = rekor;
    if (sek < rekor) a.turun.push({ p: p, rekor: rekor, sekarang: sek });
  });

  // ----- Status -----
  const ikut = PROGRAM.filter(p => w.ikut[p]);
  const lulus = ikut.length > 0 && ikut.every(p => w.target[p] >= 0 && a.sekarang[p] >= w.target[p]);
  const acuanAktif = [a.logTerakhir, a.hadirTerakhir, w.tglMasuk].filter(Boolean).sort().pop() || "";
  if (w.arsip) a.status = "Arsip";
  else if (lulus) a.status = "Lulus";
  else if (acuanAktif && acuanAktif >= tambahHari_(M.hariIni, -at.stagnanHari)) a.status = "Aktif";
  else a.status = "Tidak Aktif";
  a.lulus = lulus;

  // ----- Tanggal lulus & bonus lulus -----
  a.tglLulus = "";
  a.lulusBonus = false;
  if (lulus) {
    let akhir = null;
    ikut.forEach(p => { const ci = capai[p]; if (ci && ci.tgl && (!akhir || ci.tgl > akhir.tgl)) akhir = ci; });
    if (akhir) {
      a.tglLulus = akhir.tgl;
      a.lulusBonus = !akhir.asesmen && (!a.orientasiAkhir || akhir.tgl >= a.orientasiAkhir) && (!at.resmi || akhir.tgl >= at.resmi);
    } else {
      a.tglLulus = w.tlSheet || "";
    }
  }

  // ----- Progres (%) dan tingkatan -----
  const persen = (peta) => {
    let tot = 0, n = 0;
    ikut.forEach(p => {
      const s0 = w.awal[p], t0 = w.target[p];
      if (t0 < 0 || t0 <= s0) return;
      tot += Math.max(0, Math.min(100, (peta[p] - s0) / (t0 - s0) * 100));
      n++;
    });
    return n ? Math.round(tot / n) : (lulus ? 100 : 0);
  };
  a.capaiTgl = capai;
  a.persen = persen(a.sekarang);
  a.persenRekor = persen(a.rekor);
  a.tier = tier_(a.persenRekor, lulus);

  // ----- Mandek & belum dinilai -----
  a.mingguTanpaNilai = a.logTerakhir ? Math.max(0, selisihMinggu_(a.logTerakhir, M.hariIni)) : null;
  a.mandek = null;
  if (!w.arsip && !lulus && a.logPertama) {
    let acuan = "";
    ikut.forEach(p => {
      if (w.target[p] >= 0 && a.sekarang[p] >= w.target[p]) return;
      const t = naikTerakhir[p] || "";
      if (t > acuan) acuan = t;
    });
    a.mandek = Math.max(0, selisihMinggu_(acuan || a.logPertama, M.hariIni));
  }

  w._a = a;
  return a;
}

// ----- Rentang periode -----
function rentang_(kode, hariIni) {
  const y = +hariIni.slice(0, 4), m = +hariIni.slice(5, 7);
  const tgl = (yy, mm, dd) => yy + "-" + pad2_(mm) + "-" + pad2_(dd);
  const akhirBulan = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  const bulan = (yy, mm) => ({ mulai: tgl(yy, mm, 1), akhir: tgl(yy, mm, akhirBulan(yy, mm)), label: NAMA_BULAN[mm - 1] + " " + yy });
  const cocok = /^bulan:(\d{4})-(\d{2})$/.exec(String(kode || ""));
  let r;
  if (cocok && +cocok[2] >= 1 && +cocok[2] <= 12) {
    r = bulan(+cocok[1], +cocok[2]);
  } else {
    switch (kode) {
      case "minggu_ini": {
        const s = tambahHari_(hariIni, -hariKe_(hariIni));
        r = { mulai: s, akhir: tambahHari_(s, 6), label: "Minggu ini" };
        break;
      }
      case "bulan_lalu": r = m === 1 ? bulan(y - 1, 12) : bulan(y, m - 1); break;
      case "triwulan_ini":
      case "triwulan_lalu": {
        let q = Math.floor((m - 1) / 3), yy = y;
        if (kode === "triwulan_lalu") { q--; if (q < 0) { q = 3; yy--; } }
        r = { mulai: tgl(yy, q * 3 + 1, 1), akhir: tgl(yy, q * 3 + 3, akhirBulan(yy, q * 3 + 3)), label: "Triwulan " + (q + 1) + " " + yy };
        break;
      }
      case "tahun_ini": r = { mulai: tgl(y, 1, 1), akhir: tgl(y, 12, 31), label: "Tahun " + y }; break;
      case "semua": r = { mulai: "2000-01-01", akhir: "2999-12-31", label: "Semua waktu" }; break;
      default: kode = "bulan_ini"; r = bulan(y, m);
    }
  }
  r.kode = kode || "bulan_ini";
  return r;
}

// ----- Metrik dalam satu periode -----
function metrik_(M, w, per, resmi) {
  const a = analisis_(M, w);
  const at = M.at;
  let mulai = per.mulai;
  if (resmi && at.resmi && at.resmi > mulai) mulai = at.resmi;
  const akhir = per.akhir < M.hariIni ? per.akhir : M.hariIni;
  const m = { hadir: 0, izin: 0, sakit: 0, alpa: 0, persen: null, streak: 0, naik: 0, lulus: false, poin: 0 };
  if (mulai > akhir) return m;
  let cur = 0;
  a.presensi.forEach(x => {
    const t = x[0], s = x[1];
    if (t < mulai || t > akhir) return;
    if (s === "Hadir") { m.hadir++; cur++; if (cur > m.streak) m.streak = cur; }
    else if (s === "Izin") m.izin++;
    else if (s === "Sakit") m.sakit++;
    else if (s === "Alpa") { m.alpa++; cur = 0; }
  });
  if (m.hadir + m.alpa > 0) m.persen = Math.round(m.hadir * 100 / (m.hadir + m.alpa));
  a.gains.forEach(g => { if (g.tgl >= mulai && g.tgl <= akhir) m.naik += g.n; });
  m.lulus = !!(a.lulusBonus && a.tglLulus && a.tglLulus >= mulai && a.tglLulus <= akhir);
  m.poin = m.hadir * at.bobotHadir + m.naik * at.bobotNaik + (m.lulus ? at.bobotLulus : 0);
  return m;
}

// ============================================================================
//  KONTEKS PENAMPIL (hak akses menentukan data apa yang dikirim ke browser)
// ============================================================================
function konteks_(token) { return konteksDari_(getSession_(token)); }
function konteksDari_(s) {
  const role = s ? s.role : "umum";
  const perms = getPerms_(role, s ? s.akses : null);
  const akses = aksesJk_(s);
  return {
    s: s, role: role, perms: perms, akses: akses,
    nama: (w) => perms.data_nama_lengkap ? w.nama : samarkan_(w.nama),
    sidik: sidik_(role + "|" + akses + "|" + FITUR.map(f => perms[f.key] ? 1 : 0).join(""))
  };
}

function ringkasWbp_(M, w, ctx, perBulan) {
  const a = analisis_(M, w);
  const mb = metrik_(M, w, perBulan, true);
  const lbl = (p, idx) => idx >= 0 ? LEVEL_MAP[p][idx] : "";
  const sbl = PROGRAM.map(p => w.ikut[p] ? sebelumTgl_(M, w, p, M.hariIni) : null);
  const o = {
    id: w.id, nm: ctx.nama(w), jk: w.jk, st: a.status, ar: w.arsip ? 1 : 0, pj: w.pengajar ? 1 : 0,
    kl: w.arsip && (w.tglKeluar || w.alasanKeluar) ? [w.tglKeluar, w.alasanKeluar] : undefined,
    hr: w.hari, tm: w.tglMasuk, tl: a.tglLulus, mu: a.mulai, or: a.orientasiAkhir,
    aw: PROGRAM.map(p => w.awalVal[p]),
    tg: PROGRAM.map(p => w.targetVal[p]),
    sk: PROGRAM.map(p => w.ikut[p] ? lbl(p, a.sekarang[p]) : w.awalVal[p]),
    rk: PROGRAM.map(p => w.ikut[p] ? lbl(p, a.rekor[p]) : ""),
    // level & rekor SEBELUM hari ini: pop-up nilai hari ini bisa langsung tampil tanpa bertanya ke server
    sb: sbl.map((x, j) => x ? lbl(PROGRAM[j], x.lv) : ""),
    rs: sbl.map((x, j) => x ? lbl(PROGRAM[j], x.rk) : ""),
    pr: a.persen, prr: a.persenRekor, tr: a.tier.kode, tn: a.tier.nama, tb: a.tier.bintang,
    ld: a.logTerakhir, lh: a.hadirTerakhir, md: a.mandek, mt: a.mingguTanpaNilai,
    lj: a.lonjakan.filter(x => x.tgl >= tambahHari_(M.hariIni, -60)).map(x => [x.tgl, x.p, lbl(x.p, x.dari), lbl(x.p, x.ke), x.naik]),
    tu: a.turun.map(x => [x.p, lbl(x.p, x.rekor), lbl(x.p, x.sekarang)]),
    b: { h: mb.hadir, i: mb.izin, s: mb.sakit, a: mb.alpa, pc: mb.persen, sk: mb.streak, n: mb.naik, po: mb.poin, l: mb.lulus ? 1 : 0, kl: kalenderBulan_(M, a) }
  };
  if (ctx.perms.data_alamat_blok) { o.bl = w.blok; o.al = w.alamat; }
  return o;
}

// ============================================================================
//  DASHBOARD
// ============================================================================
function hitungAngka_(M, ctx) {
  const o = { total: 0, L: 0, P: 0, tanpaJk: 0, aktif: 0, tidakAktif: 0, lulus: 0, arsip: 0,
    terjadwal: 0, diabsen: 0, hadir: 0, dinilai: 0, libur: "" };
  const t = M.hariIni;
  const lb = liburTgl_(M, t);
  if (lb) o.libur = lb.ket || "Libur";
  o.lj = liburJk_(M, t);
  M.wbp.forEach(w => {
    if (w.arsip) { o.arsip++; return; }
    const a = analisis_(M, w);
    o.total++;
    if (w.jk === "L") o.L++; else if (w.jk === "P") o.P++; else o.tanpaJk++;
    if (a.status === "Aktif") o.aktif++; else if (a.status === "Lulus") o.lulus++; else o.tidakAktif++;
    if (ctx && !bolehWbp_(ctx.akses, w.jk)) return;
    const ab = M.abs[w.id] && M.abs[w.id][t];
    const dn = adaNilai_(M, w.id, t);
    if (wbpTerjadwal_(M, w, t)) o.terjadwal++;
    if (ab) o.diabsen++;
    if ((ab && ab.st === "Hadir") || dn) o.hadir++;
    if (dn) o.dinilai++;
  });
  return o;
}

function hitungJuara_(M, per, ctx) {
  const at = M.at;
  const out = { periode: per, resmi: at.resmi, bobot: { hadir: at.bobotHadir, naik: at.bobotNaik, lulus: at.bobotLulus } };
  ["L", "P"].forEach(g => {
    const daftar = M.wbp.filter(w => !w.arsip && w.jk === g);
    const rows = daftar.map(w => ({ w: w, m: metrik_(M, w, per, true) }));
    const maks = rows.reduce((x, r) => Math.max(x, r.m.hadir + r.m.alpa), 0);
    const minimal = Math.min(at.minSesi, Math.max(1, maks));
    const byNama = (a, b) => (a.w.nama < b.w.nama ? -1 : 1);
    const item = (r, nilai, ket) => ({ id: r.w.id, nm: ctx.nama(r.w), nilai: nilai, ket: ket, bl: ctx.perms.data_alamat_blok ? r.w.blok : "" });
    out[g] = {
      jumlah: daftar.length,
      umum: rows.filter(r => r.m.poin > 0)
        .sort((a, b) => b.m.poin - a.m.poin || b.m.naik - a.m.naik || b.m.hadir - a.m.hadir || byNama(a, b)).slice(0, 10)
        .map(r => item(r, r.m.poin + " poin", r.m.hadir + " hadir, naik " + r.m.naik + " tingkat" + (r.m.lulus ? ", lulus" : ""))),
      rajin: rows.filter(r => r.m.hadir > 0 && (r.m.hadir + r.m.alpa) >= minimal)
        .sort((a, b) => b.m.persen - a.m.persen || b.m.hadir - a.m.hadir || byNama(a, b)).slice(0, 10)
        .map(r => item(r, r.m.persen + "%", r.m.hadir + " dari " + (r.m.hadir + r.m.alpa) + " sesi")),
      konsisten: rows.filter(r => r.m.streak > 0)
        .sort((a, b) => b.m.streak - a.m.streak || b.m.hadir - a.m.hadir || byNama(a, b)).slice(0, 10)
        .map(r => item(r, r.m.streak + " sesi", "hadir berturut-turut"))
    };
  });
  out.tanpaJk = M.wbp.filter(w => !w.arsip && !w.jk).length;
  return out;
}

function hitungPerhatian_(M, ctx) {
  const at = M.at;
  const hariIni = M.hariIni;
  const boleh = (w) => !w.arsip && bolehWbp_(ctx.akses, w.jk);
  const nm = (w) => ctx.nama(w);
  const out = { absenBeruntun: [], belumDinilai: { jumlah: 0, contoh: [] }, indikasi: [], tanpaJadwal: 0, tanpaJk: 0 };
  M.wbp.forEach(w => {
    if (!boleh(w)) return;
    const a = analisis_(M, w);
    if (!(w.hari && w.hari.length)) out.tanpaJadwal++;
    if (!w.jk) out.tanpaJk++;
    // Tidak hadir berturut-turut (dari sesi yang tercatat)
    if (a.status !== "Lulus") {
      let n = 0;
      for (let i = a.presensi.length - 1; i >= 0; i--) {
        if (a.presensi[i][1] === "Hadir") break;
        n++;
      }
      if (n >= 3) out.absenBeruntun.push({ id: w.id, nm: nm(w), n: n });
    }
    // Belum dinilai lama / belum pernah
    if (a.status !== "Lulus" && PROGRAM.some(p => w.ikut[p]) && (a.mingguTanpaNilai === null || a.mingguTanpaNilai >= at.belumDinilaiMinggu)) {
      out.belumDinilai.jumlah++;
      if (out.belumDinilai.contoh.length < 12) out.belumDinilai.contoh.push({ id: w.id, nm: nm(w), n: a.mingguTanpaNilai });
    }
    // Indikasi tidak wajar (untuk keadilan papan juara)
    a.lonjakan.forEach(x => {
      if (x.tgl >= tambahHari_(hariIni, -60)) {
        out.indikasi.push({ id: w.id, nm: nm(w), jenis: "lonjakan", tgl: x.tgl, p: x.p, dari: LEVEL_MAP[x.p][x.dari], ke: LEVEL_MAP[x.p][x.ke], naik: x.naik });
      }
    });
  });
  out.absenBeruntun.sort((a, b) => b.n - a.n);
  out.absenBeruntun = out.absenBeruntun.slice(0, 20);
  out.indikasi.sort((a, b) => String(b.tgl || "").localeCompare(String(a.tgl || "")));
  out.indikasi = out.indikasi.slice(0, 20);
  return out;
}

// Statistik untuk grafik dashboard: tren harian, status bulan ini, kehadiran per hari jadwal
function hitungStatistik_(M, ctx) {
  const hariIni = M.hariIni;
  const awalBulan = hariIni.slice(0, 8) + "01";
  const nHari = Math.max(30, Math.round((tglMs_(hariIni) - tglMs_(awalBulan)) / 86400000) + 1);
  const hari = [], idx = {};
  for (let i = nHari - 1; i >= 0; i--) {
    const t = tambahHari_(hariIni, -i);
    const lb = liburTgl_(M, t);
    const o = { t: t, j: 0, d: 0, h: 0, i: 0, s: 0, a: 0, n: 0, l: lb ? (lb.ket || "Libur") : "" };
    const lj = liburJk_(M, t);
    if (lj.L || lj.P) o.lj = lj;
    Object.defineProperty(o, "nh", { value: namaHari_(t), enumerable: false });
    idx[t] = o;
    hari.push(o);
  }
  // bulan lalu sampai tanggal yang sama, untuk perbandingan
  const y = +hariIni.slice(0, 4), m = +hariIni.slice(5, 7), dd = +hariIni.slice(8, 10);
  const yl = m === 1 ? y - 1 : y, ml = m === 1 ? 12 : m - 1;
  const akhirLalu = new Date(Date.UTC(yl, ml, 0)).getUTCDate();
  const laluMulai = yl + "-" + pad2_(ml) + "-01", laluAkhir = yl + "-" + pad2_(ml) + "-" + pad2_(Math.min(dd, akhirLalu));
  const bulan = { h: 0, i: 0, s: 0, a: 0 }, lalu = { h: 0, i: 0, s: 0, a: 0 };
  const kunci = { Hadir: "h", Izin: "i", Sakit: "s", Alpa: "a" };
  const perHari = HARI.map(h => ({ h: h, n: 0, tot: 0, hd: 0 }));
  // Tanggal pertama ada isian di aplikasi: hari-hari sebelumnya belum dicatat, jadi tidak dihitung "tidak hadir"
  const awalData = awalData_(M);
  const dariJadwal = [tambahHari_(hariIni, -55), awalData || hariIni].sort().pop();
  let baru = 0;
  M.wbp.forEach(w => {
    if (w.arsip || !bolehWbp_(ctx.akses, w.jk)) return;
    if (w.tglMasuk && w.tglMasuk >= awalBulan) baru++;
    (w.hari || []).forEach(h => { const k = HARI.indexOf(h); if (k >= 0) perHari[k].n++; });
    const a = analisis_(M, w);
    const ab = M.abs[w.id] || {}, lt = M.logTgl[w.id] || {};
    const hadir = {};
    a.presensi.forEach(x => {
      const t = x[0], k = kunci[x[1]];
      if (x[1] === "Hadir") hadir[t] = true;
      if (t >= awalBulan && t <= hariIni) bulan[k]++;
      else if (t >= laluMulai && t <= laluAkhir) lalu[k]++;
    });
    hari.forEach(o => {
      const terj = wbpTerjadwal_(M, w, o.t);
      if (terj) o.j++;
      const x = ab[o.t];
      if (x && terj) o.d++;
      if (lt[o.t] || (x && x.st === "Hadir")) o.h++;
      else if (x) o[kunci[x.st]]++;
      if (lt[o.t]) o.n++;
    });
    (w.hari || []).forEach(h => {
      const k = HARI.indexOf(h);
      if (k < 0) return;
      // tanggal-tanggal hari itu dalam 8 minggu terakhir
      let t = hariIni;
      while (namaHari_(t) !== h) t = tambahHari_(t, -1);
      for (; t >= dariJadwal; t = tambahHari_(t, -7)) {
        if (liburWbp_(M, t, w.jk) || (w.tglMasuk && t < w.tglMasuk)) continue;
        perHari[k].tot++;
        if (hadir[t]) perHari[k].hd++;
      }
    });
  });
  const pc = (o) => (o.h + o.a) ? Math.round(o.h * 100 / (o.h + o.a)) : null;
  bulan.pc = pc(bulan);
  lalu.pc = pc(lalu);
  return {
    hari: awalData ? hari.filter(o => o.t >= awalData) : [], awalData: awalData, bulan: bulan, lalu: lalu, baru: baru,
    perHari: perHari.map(x => ({ h: x.h, n: x.n, pc: x.tot ? Math.round(x.hd * 100 / x.tot) : null }))
  };
}

// Penilaian terbaru (untuk daftar di dashboard)
function hitungTerbaru_(M, ctx) {
  const semua = [];
  M.wbp.forEach(w => {
    if (!bolehWbp_(ctx.akses, w.jk)) return;
    const L = M.logs[w.id];
    if (!L || !L.length) return;
    const a = analisis_(M, w);
    const naik = {};
    a.gains.forEach(g => { naik[g.idLog] = g.naik; });
    L.slice(-6).forEach(g => semua.push({ g: g, w: w, naik: naik[g.id] || 0 }));
  });
  semua.sort((x, y) => (x.g.tgl < y.g.tgl ? 1 : x.g.tgl > y.g.tgl ? -1 : y.g.row - x.g.row));
  return semua.slice(0, 6).map(x => ({
    id: x.w.id, nm: ctx.nama(x.w), jk: x.w.jk, tgl: x.g.tgl, p: x.g.p, v: x.g.val, j: x.g.jenis,
    o: ctx.perms.data_penginput ? x.g.oleh : "", naik: x.naik
  }));
}

function bangunDashboard_(M, per, ctx) {
  const p = ctx.perms;
  const d = { periode: per };
  if (p.dash_counter) { d.angka = hitungAngka_(M, ctx); d.stat = hitungStatistik_(M, ctx); }
  if (p.view_monitoring) d.terbaru = hitungTerbaru_(M, ctx);
  if (p.dash_leaderboard) d.juara = hitungJuara_(M, per, ctx);
  if (p.dash_perhatian) d.perhatian = hitungPerhatian_(M, ctx);
  if (p.dash_counter && ctx.s && ctx.s.role !== "umum") d.pertemuan = hitungPertemuan_(M, per, ctx);
  return d;
}

// Tanggal pertama ada isian (absensi / penilaian) di aplikasi; sebelum itu belum dicatat
function awalData_(M) {
  if (M._awalData !== undefined) return M._awalData;
  let awal = "";
  const cek = (t) => { if (t && t <= M.hariIni && (!awal || t < awal)) awal = t; };
  Object.keys(M.abs).forEach(id => Object.keys(M.abs[id]).forEach(cek));
  Object.keys(M.logTgl).forEach(id => Object.keys(M.logTgl[id]).forEach(cek));
  M._awalData = awal;
  return awal;
}

// Pertemuan yang SUDAH TERLAKSANA per kelompok hari jadwal, terpisah putra (L) dan putri (P).
// Terlaksana = tanggal yang absensi/penilaiannya diisi untuk WBP kelompok itu:
//  - pada hari kelompok itu sendiri (bukan hari yang kelompoknya diliburkan lewat jadwal pengganti), atau
//  - pada tanggal jadwal pengganti yang memanggil kelompok itu, atau
//  - pada hari lain untuk WBP yang jadwalnya hanya hari itu (kelas susulan).
function hitungPertemuan_(M, per, ctx) {
  const awalData = awalData_(M);
  const akhir = per.akhir > M.hariIni ? M.hariIni : per.akhir;
  const mulai = awalData && per.mulai < awalData ? awalData : per.mulai;
  const out = { label: per.label, mulai: mulai, akhir: akhir };
  ["L", "P"].forEach(g => {
    if (!bolehWbp_(ctx.akses, g)) return;
    // kelompok = kombinasi hari jadwal (mis. "Senin", atau "Selasa, Rabu" bila semua dijadwalkan dua hari)
    const anggota = {}, hariKel = {};
    M.wbp.forEach(w => {
      if (w.arsip || w.jk !== g || !(w.hari || []).length) return;
      const hr = HARI.filter(h => w.hari.indexOf(h) !== -1), kunci = hr.join(", ");
      (anggota[kunci] = anggota[kunci] || []).push(w);
      hariKel[kunci] = hr;
    });
    const kel = Object.keys(anggota).sort((a, b) => HARI.indexOf(hariKel[a][0]) - HARI.indexOf(hariKel[b][0]) || a.length - b.length);
    if (!kel.length) return;
    const kartu = { maks: 0, hari: [], ganti: [] };
    const tgl = {};
    kel.forEach(k => { tgl[k] = {}; });
    if (awalData && akhir >= mulai) {
      kel.forEach(k => anggota[k].forEach(w => {
        const ab = M.abs[w.id] || {}, lt = M.logTgl[w.id] || {};
        Object.keys(ab).concat(Object.keys(lt)).forEach(t => {
          if (t < mulai || t > akhir) return;
          const gt = M.ganti[t] && M.ganti[t][g], hr = hariKel[k];
          // diliburkan lewat jadwal pengganti (dan tidak ikut dipanggil) -> tidak dihitung
          if (gt && gt.libur && hr.indexOf(namaHari_(t)) !== -1 && hr.indexOf(gt.panggil) === -1) return;
          tgl[k][t] = true;      // hari jadwalnya, dipanggil lewat jadwal pengganti, atau kelas susulan
        });
      }));
    }
    kel.forEach(k => {
      const t = Object.keys(tgl[k]).length;
      kartu.hari.push({ h: k, d: hariKel[k], n: anggota[k].length, t: t });
      if (t > kartu.maks) kartu.maks = t;
    });
    Object.keys(M.ganti).sort().forEach(t => { const x = M.ganti[t][g]; if (x && t >= tambahHari_(M.hariIni, -30)) kartu.ganti.push([t, x.panggil, x.libur ? 1 : 0, x.ket]); });
    out[g] = kartu;
  });
  return out;
}

// Tulis kembali Status, Level_Sekarang, dan Tanggal_Lulus ke Sheet bila berbeda (agar Sheet tetap mudah dibaca)
function sinkronSheet_(M, terkunci) {
  const t = tabel_("WBP");
  const c = t.c;
  if (t.v.length <= 1) return;
  const kolom = ["Status", "Tanggal_Lulus"].concat(PROGRAM.map(p => "Level_Sekarang_" + p));
  const baru = {};
  kolom.forEach(k => { baru[k] = t.v.slice(1).map(r => [r[c[k]]]); });
  const berubah = {};
  M.wbp.forEach(w => {
    const a = analisis_(M, w);
    const i = w.row - 2;
    const set = (k, v) => {
      const lama = baru[k][i][0];
      const lamaStr = Object.prototype.toString.call(lama) === "[object Date]" ? fmtTgl_(lama) : String(lama);
      if (lamaStr !== String(v)) { baru[k][i][0] = v; berubah[k] = true; }
    };
    set("Status", a.status);
    set("Tanggal_Lulus", a.tglLulus || "");
    PROGRAM.forEach(p => { if (w.ikut[p]) set("Level_Sekarang_" + p, LEVEL_MAP[p][a.sekarang[p]]); });
  });
  const ubah = Object.keys(berubah);
  if (!ubah.length) return;
  const tulis = () => {
    if (t.sh.getLastRow() !== t.v.length) return;     // jumlah baris berubah di tengah jalan, lewati
    ubah.forEach(k => {
      const rg = t.sh.getRange(2, c[k] + 1, t.v.length - 1, 1);
      if (k === "Tanggal_Lulus") rg.setNumberFormat("@");
      rg.setValues(baru[k]);
    });
  };
  if (terkunci) { tulis(); return; }
  const lock = LockService.getScriptLock();
  if (!lock.tryLock(3000)) return;
  try { tulis(); } finally { lock.releaseLock(); }
}

// Daftar pengguna disimpan di cache dan baru dibaca ulang bila ada perubahan akun,
// sehingga memeriksa login di setiap panggilan tidak lagi membuka sheet Pengguna.
function readUsers_() {
  const kunci = "usr6|" + capVersi_().u;
  let out = null;
  try { out = JSON.parse(CacheService.getScriptCache().get(kunci) || "null"); } catch (e) { out = null; }
  if (out) return out;
  const t = tabel_("USER");
  const c = t.c;
  out = [];
  for (let i = 1; i < t.v.length; i++) {
    const r = t.v[i];
    const u = String(r[c.Username] || "").trim();
    if (!u) continue;
    let akses = null;
    try { akses = r[c.Akses] ? JSON.parse(String(r[c.Akses])) : null; } catch (e) { akses = null; }
    out.push({
      row: i + 1, username: u, nama: String(r[c.Nama] || u), role: String(r[c.Role] || "guru").trim().toLowerCase() === "admin" ? "admin" : "guru",
      salt: String(r[c.Salt]), hash: String(r[c.Hash]), aktif: bool_(r[c.Aktif]), wajibGanti: bool_(r[c.Wajib_Ganti]),
      jk: normJk_(r[c.Jenis_Kelamin]), akses: (akses && typeof akses === "object") ? akses : null,
      status: String(r[c.Status] || "").trim().toLowerCase(), adaFoto: !!String(r[c.Foto] || "")
    });
  }
  try { CacheService.getScriptCache().put(kunci, JSON.stringify(out), 21600); } catch (e) { /* abaikan */ }
  return out;
}

// Foto profil disimpan terpisah dari daftar pengguna (supaya simpanan daftar pengguna tetap kecil)
function fotoUser_(username) {
  const kunci = "ft6|" + capVersi_().u + "|" + username;
  const cache = CacheService.getScriptCache();
  const ada = cache.get(kunci);
  if (ada !== null) return ada;
  const t = tabel_("USER"), c = t.c;
  let f = "";
  for (let i = 1; i < t.v.length; i++) if (String(t.v[i][c.Username] || "").trim() === username) { f = String(t.v[i][c.Foto] || ""); break; }
  try { cache.put(kunci, f, 21600); } catch (e) { /* abaikan */ }
  return f;
}

function userBaru_(username, nama, role, password, wajibGanti, jk) {
  const salt = Utilities.getUuid();
  return {
    Username: username, Nama: nama, Role: role, Salt: salt, Hash: hashPw_(salt, password),
    Aktif: true, Wajib_Ganti: !!wajibGanti, Dibuat: new Date(), Jenis_Kelamin: jk || "", Akses: ""
  };
}

// ---------- Token sesi tanpa penyimpanan (ditandatangani) ----------
// Format: t2:<username>:<kedaluwarsa>:<tandatangan>. Tandatangan memuat hash sandi,
// sehingga mengganti sandi atau menonaktifkan akun otomatis mematikan token lama.
function rahasiaSesi_() {
  const props = PropertiesService.getScriptProperties();
  let r = props.getProperty("SESI_RAHASIA");
  if (!r) { r = Utilities.getUuid() + Utilities.getUuid(); props.setProperty("SESI_RAHASIA", r); }
  return r;
}
function tandaTangan_(u, exp) {
  const bytes = Utilities.computeHmacSha256Signature(u.username + "|" + exp + "|" + u.hash, rahasiaSesi_());
  return bytes.map(b => ("0" + (b & 0xFF).toString(16)).slice(-2)).join("");
}
function buatToken_(u) {
  const exp = Date.now() + SESI_HARI * 86400000;
  return "t2:" + encodeURIComponent(u.username) + ":" + exp + ":" + tandaTangan_(u, exp);
}
function sesiBatal_() {
  try { return JSON.parse(PropertiesService.getScriptProperties().getProperty("SESI_BATAL") || "{}"); } catch (e) { return {}; }
}
function periksaToken_(token) {
  const bag = String(token || "").split(":");
  if (bag.length !== 4 || bag[0] !== "t2") return null;
  const exp = parseInt(bag[2], 10);
  if (!exp || exp < Date.now()) return null;
  let nama = "";
  try { nama = decodeURIComponent(bag[1]); } catch (e) { return null; }
  const u = readUsers_().find(x => x.username === nama);
  if (!u || !u.aktif) return null;
  if (tandaTangan_(u, exp) !== bag[3]) return null;

}

function getSession_(token) {
  if (!token) return null;

function ctxWajib_(token) {
  const ctx = konteks_(token);
  if (token && !ctx.s) throw new Error("SESI_HABIS: Sesi login berakhir. Silakan login ulang.");
  if (ctx.s && ctx.s.wajibGanti) throw new Error("Anda harus mengganti sandi bawaan terlebih dahulu.");
  return ctx;
}

// kunci = "admin", satu nama hak akses, atau daftar (cukup salah satu)
function otorisasi_(token, kunci) {
  const ctx = ctxWajib_(token);
  if (kunci === "admin") {
    if (!ctx.s || ctx.s.role !== "admin") throw new Error("Akses ditolak: khusus admin.");

  }
  const daftar = Array.isArray(kunci) ? kunci : [kunci];
  if (!daftar.some(k => ctx.perms[k])) throw new Error("Akses ditolak: akun Anda tidak diizinkan melakukan aksi ini.");
  if (!ctx.s) ctx.s = { username: "(umum)", nama: "Umum", role: "umum", jk: "", akses: null };

}

/* v6 tidak memakai kelompok lagi. Jadwal hari dan jenis kelamin dari kelompok lama
   disalin ke data WBP masing-masing (hanya bila kolom WBP itu masih kosong). */
function migrasiJadwalV6_() {
  const ss = ss_();
  const shK = ss.getSheetByName(NAMA.KEL);
  const shW = ss.getSheetByName(NAMA.WBP);
  if (!shK || !shW || shK.getLastRow() < 2 || shW.getLastRow() < 2) return;
  const vk = shK.getDataRange().getValues();
  const hk = vk[0].map(norm_);
  const iId = hk.indexOf("idkelompok"), iNama = hk.indexOf("nama"), iHari = hk.indexOf("hari"), iJk = hk.indexOf("jeniskelamin");
  if (iId < 0 || iHari < 0) return;
  const kel = {};
  for (let i = 1; i < vk.length; i++) {
    const k = { hari: parseHari_(vk[i][iHari]), jk: iJk >= 0 ? normJk_(vk[i][iJk]) : "" };
    if (vk[i][iId]) kel[norm_(vk[i][iId])] = k;
    if (iNama >= 0 && vk[i][iNama]) kel[norm_(vk[i][iNama])] = kel[norm_(vk[i][iNama])] || k;
  }
  const vw = shW.getDataRange().getValues();
  const hw = vw[0].map(norm_);
  const wKel = hw.indexOf("kelompok"), wHari = hw.indexOf("harijadwal"), wJk = hw.indexOf("jeniskelamin");
  if (wKel < 0 || wHari < 0) return;
  let ubahHari = false, ubahJk = false;
  const kolHari = [], kolJk = [];
  for (let i = 1; i < vw.length; i++) {
    let hari = String(vw[i][wHari] || "");
    let jk = wJk >= 0 ? String(vw[i][wJk] || "") : "";
    const k = kel[norm_(vw[i][wKel])];
    if (k && !parseHari_(hari).length && k.hari.length) { hari = k.hari.join(", "); ubahHari = true; }
    if (k && wJk >= 0 && !normJk_(jk) && k.jk) { jk = k.jk; ubahJk = true; }
    kolHari.push([hari]);
    kolJk.push([jk]);
  }
  if (ubahHari) {
    const rg = shW.getRange(2, wHari + 1, kolHari.length, 1);
    rg.setNumberFormat("@");
    rg.setValues(kolHari);
  }
  if (ubahJk) shW.getRange(2, wJk + 1, kolJk.length, 1).setValues(kolJk);
}

function doPost(e) {

// ============================================================================
//  FIREBASE (v10): data aplikasi pindah ke Firestore. Apps Script hanya:
//  1) memeriksa sandi lama saat pengguna pertama kali masuk di sistem baru (fbMasuk),
//  2) mengatur akun login Firebase atas perintah admin (fbAkun),
//  3) mengirim seluruh isi sheet sekali saat pemindahan (eksporData).
// ============================================================================
const FB_PROYEK = "rabinaku-5933b";
const FB_DOMAIN = "@pengguna.rabinaku.app";
const FB_SETELAH_PINDAH = ["fbMasuk", "fbAkun", "eksporData"];
function sudahPindah_() { try { return !!PropertiesService.getScriptProperties().getProperty("PINDAH_FIREBASE"); } catch (e) { return false; } }
function fbEmail_(u) { return String(u || "").trim().toLowerCase() + FB_DOMAIN; }
function fbSandi_(p) { return "rbk-" + String(p); }
function fbAdmin_(jalur, isi) {
  const r = UrlFetchApp.fetch("https://identitytoolkit.googleapis.com/v1/projects/" + FB_PROYEK + "/" + jalur, {
    method: "post", contentType: "application/json", payload: JSON.stringify(isi), muteHttpExceptions: true,
    headers: { Authorization: "Bearer " + ScriptApp.getOAuthToken(), "x-goog-user-project": FB_PROYEK }
  });
  let j = {};
  try { j = JSON.parse(r.getContentText() || "{}"); } catch (e) { j = {}; }
  if (r.getResponseCode() >= 300) throw new Error("Firebase: " + ((j.error && j.error.message) || ("kode " + r.getResponseCode())));
  return j;
}
function fbCari_(username) {
  const j = fbAdmin_("accounts:lookup", { email: [fbEmail_(username)] });
  return (j.users && j.users[0]) || null;
}
function fbKlaim_(u) { try { return JSON.parse((u && u.customAttributes) || "{}") || {}; } catch (e) { return {}; } }
// o: { password, role, aktif }. Akun dibuat bila belum ada dan ada password.
function fbPasang_(username, o) {
  let u = fbCari_(username);
  if (!u) {
    if (!o.password) return "";
    const j = fbAdmin_("accounts", { email: fbEmail_(username), password: fbSandi_(o.password), disabled: o.aktif === false });
    u = { localId: j.localId };
  }
  const up = { localId: u.localId };
  if (o.password) up.password = fbSandi_(o.password);
  if (o.aktif !== undefined && o.aktif !== null) up.disableUser = !o.aktif;
  if (o.role) up.customAttributes = JSON.stringify({ r: o.role === "admin" ? "admin" : "guru", u: String(username).trim() });
  if (Object.keys(up).length > 1) fbAdmin_("accounts:update", up);
  return u.localId;
}
// Pengguna lama masuk pertama kali di sistem baru: sandi diperiksa ke sheet Pengguna (lama),
// lalu akun Firebase dibuat dengan sandi yang sama.
function fbMasuk(username, password) {
  username = String(username || "").trim();
  const r = login(username, password);
  if (!r || !r.success) return r;
  const u = readUsers_().find(x => x.username.toLowerCase() === username.toLowerCase());
  const ada = fbCari_(u.username);
  if (ada && fbKlaim_(ada).r) return gagal_("Username atau password salah.");   // sudah pindah: sandi lama tidak berlaku lagi
  fbPasang_(u.username, { password: password, role: u.role, aktif: true });
  return { success: true, username: u.username };
}
function fbAdminDari_(idToken) {
  const j = fbAdmin_("accounts:lookup", { idToken: String(idToken || "") });
  const u = j.users && j.users[0];
  if (!u) throw new Error("SESI_HABIS: Sesi login berakhir. Silakan login ulang.");
  const k = fbKlaim_(u);
  if (k.r !== "admin") throw new Error("Akses ditolak: khusus admin.");
  return k;
}
// op: "pasang" { username, password?, role?, aktif? } atau "hapus" { username }
function fbAkun(idToken, op, d) {
  fbAdminDari_(idToken);
  d = d || {};
  const username = String(d.username || "").trim();
  if (!username) return gagal_("Username kosong.");
  if (op === "hapus") {
    const u = fbCari_(username);
    if (u) fbAdmin_("accounts:delete", { localId: u.localId });
    return { success: true };
  }
  if (op === "pasang") {
    fbPasang_(username, { password: d.password ? String(d.password) : "", role: d.role || "", aktif: d.aktif });
    return { success: true };
  }
  return gagal_("Perintah tidak dikenal.");
}
// Seluruh isi sheet untuk dipindahkan ke Firestore (khusus admin). Sandi lama tidak ikut dikirim.
function eksporData(idToken) {
  fbAdminDari_(idToken);
  const ss = ss_();
  const tabel = {};
  Object.keys(NAMA).forEach(k => {
    const sh = ss.getSheetByName(NAMA[k]);
    if (!sh) return;
    let v = sh.getDataRange().getValues();
    if (k === "USER" && v.length) {
      const h = v[0].map(norm_), iS = h.indexOf("salt"), iH = h.indexOf("hash");
      v = v.map((r, i) => i === 0 ? r : r.map((x, j) => (j === iS || j === iH) ? "" : x));
    }
    tabel[NAMA[k]] = kemasNilai_(v);
  });
  const p = PropertiesService.getScriptProperties().getProperties() || {};
  const props = {};
  Object.keys(p).forEach(k => { if (!/^SESI_|^PANAS_|^SINKRON_|^PINDAH_|^BACKUP_MS/.test(k)) props[k] = p[k]; });
  props._TZ = tz_();
  PropertiesService.getScriptProperties().setProperty("PINDAH_FIREBASE", waktuKini_());
  return { success: true, tabel: tabel, props: props, versi: VERSI };
}

function login(username, password) {
  ensureSetup_();
  username = String(username || "").trim();
  password = String(password || "");
  const cache = CacheService.getScriptCache();
  const kunciGagal = "gagal_" + username.toLowerCase();
  const gagalN = parseInt(cache.get(kunciGagal) || "0", 10);
  if (gagalN >= 5) return gagal_("Terlalu banyak percobaan gagal. Coba lagi dalam 5 menit.");

  const u = readUsers_().find(x => x.username.toLowerCase() === username.toLowerCase());
  if (u && !u.aktif && hashPw_(u.salt, password) === u.hash) {
    return gagal_(u.status === "menunggu" ? "Akun Anda sudah terdaftar dan sedang menunggu persetujuan admin." : "Akun ini dinonaktifkan. Hubungi admin.");
  }
  if (!u || !u.aktif || hashPw_(u.salt, password) !== u.hash) {
    cache.put(kunciGagal, String(gagalN + 1), 300);
    catat_({ username: username || "-", role: "-" }, "LOGIN GAGAL", "");
    return gagal_("Username atau password salah.");
  }
  cache.remove(kunciGagal);
  const token = buatToken_(u);
  catat_(u, "LOGIN", "");
  return { success: true, token: token, role: u.role };
}

// Pendaftaran akun dari halaman Masuk. Akun baru belum aktif sampai disetujui admin.
function daftarAkun(d) {
  ensureSetup_();
  d = d || {};
  const username = String(d.username || "").trim(), nama = bersih_(d.nama, 60), password = String(d.password || ""), jk = normJk_(d.jk);
  if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) return gagal_("Username 3 sampai 30 karakter: huruf, angka, titik, strip, atau garis bawah.");
  if (!nama) return gagal_("Isi nama lengkap.");
  if (!jk) return gagal_("Pilih jenis kelamin.");
  if (password.length < 6) return gagal_("Password minimal 6 karakter.");
  const cache = CacheService.getScriptCache();
  const n = parseInt(cache.get("daftar_jam") || "0", 10);
  if (n >= 10) return gagal_("Terlalu banyak pendaftaran. Coba lagi nanti.");
  return denganKunci_(() => {
    const semua = readUsers_();
    if (semua.some(u => u.username.toLowerCase() === username.toLowerCase())) return gagal_("Username sudah dipakai. Pilih username lain.");
    if (semua.filter(u => u.status === "menunggu").length >= 30) return gagal_("Pendaftaran sedang penuh. Hubungi admin.");
    const ub = userBaru_(username, nama, "guru", password, false, jk);
    ub.Aktif = false;
    ub.Status = "menunggu";
    tambahBaris_(tabel_("USER", true), [ub], ["Akses", "Status"]);
    naikVersi_("u");
    cache.put("daftar_jam", String(n + 1), 3600);
    catat_({ username: username, role: "-" }, "DAFTAR AKUN", nama + " (" + jk + ")");
    return { success: true, message: "Pendaftaran terkirim. Akun bisa dipakai setelah disetujui admin." };
  });
}

function logout(token) {
  const s = getSession_(token);
  if (s) {
    // masukkan ke daftar batal (dibersihkan otomatis setelah kedaluwarsa)
    const bag = String(token).split(":");
    const batal = sesiBatal_(), kini = Date.now();
    Object.keys(batal).forEach(k => { if (batal[k] < kini) delete batal[k]; });
    batal[bag[3].slice(0, 24)] = parseInt(bag[2], 10);
    PropertiesService.getScriptProperties().setProperty("SESI_BATAL", JSON.stringify(batal));
    catat_(s, "LOGOUT", "");
  }
  return { success: true };
}

function changeMyPassword(token, lama, baru) {
  const s = getSession_(token);
  if (!s) return gagal_("Sesi berakhir. Silakan login ulang.");
  baru = String(baru || "");
  if (baru.length < 6) return gagal_("Password baru minimal 6 karakter.");
  if (baru === PASSWORD_AWAL_ADMIN) return gagal_("Pilih password lain, jangan memakai password bawaan.");
  return denganKunci_(() => {
    const t = tabel_("USER", true);
    const u = readUsers_().find(x => x.username === s.username);
    if (!u || hashPw_(u.salt, String(lama || "")) !== u.hash) return gagal_("Password lama salah.");
    const salt = Utilities.getUuid();
    tulisBaris_(t, u.row, { Salt: salt, Hash: hashPw_(salt, baru), Aktif: true, Wajib_Ganti: false }, []);
    naikVersi_("u");
    catat_(s, "GANTI SANDI", "");
    const uBaru = Object.assign({}, u, { hash: hashPw_(salt, baru) });
    return { success: true, message: "Password berhasil diganti.", token: buatToken_(uBaru) };
  });
}

  };
}

function bacaLibur_() {
  const kunci = "lbr6|" + capVersi_().k + ":" + capVersi_().kU;
  let simpan = null;
  try { simpan = JSON.parse(CacheService.getScriptCache().get(kunci) || "null"); } catch (e) { simpan = null; }
  if (simpan) return simpan;
  const hasil = bacaLiburSheet_();
  try { CacheService.getScriptCache().put(kunci, JSON.stringify(hasil), 21600); } catch (e) { /* abaikan */ }
  return hasil;
}
// Jadwal pengganti (tukar hari panggilan), disimpan dengan versi "k" seperti hari libur
function bacaGanti_() {
  const kunci = "gnt1|" + capVersi_().k + ":" + capVersi_().kU;
  let simpan = null;
  try { simpan = JSON.parse(CacheService.getScriptCache().get(kunci) || "null"); } catch (e) { simpan = null; }
  if (simpan) return simpan;
  const t = tabel_("GANTI"), c = t.c, hasil = [];
  for (let i = 1; i < t.v.length; i++) {
    const r = t.v[i], tgl = fmtTgl_(r[c.Tanggal]), jk = normJk_(r[c.Jenis_Kelamin]), panggil = parseHari_(String(r[c.Panggil] || ""))[0];
    if (!tgl || !jk || !panggil) continue;
    hasil.push({ tgl: tgl, jk: jk, panggil: panggil, libur: /^(ya|y|true|1)$/i.test(String(r[c.Liburkan]).trim()), ket: String(r[c.Keterangan] || "") });
  }
  hasil.sort((a, b) => a.tgl.localeCompare(b.tgl));
  try { CacheService.getScriptCache().put(kunci, JSON.stringify(hasil), 21600); } catch (e) { /* abaikan */ }
  return hasil;
}

function bacaLiburSheet_() {
  const L = tabel_("LIBUR"), lc = L.c;
  const libur = [];
  for (let i = 1; i < L.v.length; i++) {
    const tgl = fmtTgl_(L.v[i][lc.Tanggal]);
    const lingkup = lingkupLibur_(L.v[i][lc.Lingkup]);
    if (tgl && lingkup) libur.push({ tgl: tgl, ket: String(L.v[i][lc.Keterangan] || ""), lk: lingkup });
  }
  return libur.sort((a, b) => a.tgl.localeCompare(b.tgl));
}

/* Satu panggilan saat aplikasi dibuka: akun, pengaturan, daftar WBP, dan isian hari ini.
   Dashboard sengaja tidak ikut (dimuat terpisah hanya bila dibuka). */
function getAppData(token, segar) {
  paksaSegar_(!!segar);
  ensureSetup_();
  const ctx = konteks_(token);
  const st = readSettings_();
  const at = aturan_();
  const p = ctx.perms;
  const hariIni = hariIni_();
  const hasil = {
    versi: VERSI,
    session: ctx.s ? { username: ctx.s.username, nama: ctx.s.nama, role: ctx.s.role, jk: ctx.s.jk, wajibGanti: ctx.s.wajibGanti, foto: fotoUser_(ctx.s.username) } : null,
    tokenKadaluarsa: !!token && !ctx.s,
    role: ctx.role, perms: p, akses: ctx.akses, hariIni: hariIni,
    settings: pengaturanTampil_(st, at),
    levels: LEVEL_MAP, program: PROGRAM, tidakIkut: TIDAK_IKUT,
    libur: [], ganti: [], wbps: null, hari: null
  };
  // login diperpanjang otomatis: token yang berumur lebih dari sehari diganti token baru (berlaku SESI_HARI lagi)
  if (token && ctx.s) {
    const exp = parseInt(String(token).split(":")[2], 10);
    if (exp && exp - Date.now() < (SESI_HARI - 1) * 86400000) {
      const u = readUsers_().find(x => x.username === ctx.s.username);
      if (u) hasil.tokenBaru = buatToken_(u);
    }
    if (ctx.s.role === "admin") hasil.menunggu = readUsers_().filter(u => u.status === "menunggu").length;
  }
  if (ctx.s && ctx.s.wajibGanti) return bersihkan_(hasil);
  const dari = tambahHari_(hariIni, -60), sampai = tambahHari_(hariIni, 180);
  hasil.libur = bacaLibur_().filter(x => x.tgl >= dari && x.tgl <= sampai);
  hasil.ganti = bacaGanti_().filter(x => x.tgl >= dari && x.tgl <= sampai && bolehWbp_(ctx.akses, x.jk));
  if (!(p.view_database || p.dash_hero || p.act_absensi || p.act_input_monitoring)) return bersihkan_(hasil);

  const v0 = verRingkas_();
  let berat = segar ? null : cacheAmbil_(kunciApp_(ctx, hariIni)), dariSalinan = false;
  if (!berat && !segar) { berat = appDariSalinan_(ctx, hariIni); dariSalinan = !!berat; }
  if (!berat) berat = bangunApp_(muatModel_(), ctx);
  hasil._v = dariSalinan ? null : v0;                     // salinan lama: versinya tidak dijamin terbaru
  hasil.wbps = berat.wbps;
  hasil.hari = berat.hari;
  return bersihkan_(hasil);
}

/* Absensi dan nilai pada satu tanggal, dibaca langsung dari sheet (tanpa menghitung
   statistik apa pun), supaya pindah tanggal di halaman absensi terasa cepat. */
function isiHari_(ctx, tgl, petaJk) {
  const p = ctx.perms;
  let peta = petaJk;
  if (!peta) {
    peta = {};
    const tw = tabel_("WBP"), wc = tw.c;
    for (let i = 1; i < tw.v.length; i++) {
      const id = String(tw.v[i][wc.ID_WBP] || "").trim();
      if (id) peta[id] = normJk_(tw.v[i][wc.Jenis_Kelamin]);
    }
  }
  const boleh = (id) => (id in peta) && bolehWbp_(ctx.akses, peta[id]);
  const abs = {}, nil = {};
  const A = tabel_("ABS"), ac = A.c;
  for (let i = 1; i < A.v.length; i++) {
    const r = A.v[i];
    if (fmtTgl_(r[ac.Tanggal]) !== tgl) continue;
    const id = String(r[ac.ID_WBP] || "").trim();
    const s = normStatus_(r[ac.Status]);
    if (s && boleh(id)) abs[id] = [s, String(r[ac.Keterangan] || ""), p.data_penginput ? String(r[ac.Dicatat_Oleh] || "") : ""];
  }
  const G = tabel_("LOG"), gc = G.c;
  for (let i = 1; i < G.v.length; i++) {
    const r = G.v[i];
    if (fmtTgl_(r[gc.Tanggal_Input]) !== tgl) continue;
    const id = String(r[gc.ID_WBP] || "").trim();
    const q = String(r[gc.Kategori] || "").trim();
    if (!LEVEL_MAP[q] || !boleh(id)) continue;
    (nil[id] = nil[id] || {})[q] = [String(r[gc.Level_Tercapai]), normJenis_(r[gc.Jenis]), p.data_catatan ? String(r[gc.Catatan_Pembina] || "") : "", String(r[gc.ID_Monitoring] || "")];
  }
  const daftarLb = bacaLibur_().filter(x => x.tgl === tgl);
  const lb = daftarLb.find(x => x.lk === "Semua"), lj = {};
  daftarLb.forEach(x => { if (x.lk === "Putra") lj.L = x.ket || "Libur"; else if (x.lk === "Putri") lj.P = x.ket || "Libur"; });
  return { tgl: tgl, hari: namaHari_(tgl), libur: lb ? (lb.ket || "Libur") : "", lj: lj, abs: abs, nil: nil };
}

// Sama dengan isiHari_, tetapi memakai model yang sudah dimuat (dipakai saat muat awal)
function isiHariModel_(M, ctx, tgl) {
  const p = ctx.perms;
  const abs = {}, nil = {};
  M.wbp.forEach(w => {
    if (!bolehWbp_(ctx.akses, w.jk)) return;
    const x = M.abs[w.id] && M.abs[w.id][tgl];
    if (x) abs[w.id] = [x.st, x.ket, p.data_penginput ? x.oleh : ""];
    if (M.logTgl[w.id] && M.logTgl[w.id][tgl]) {
      (M.logs[w.id] || []).forEach(g => {
        if (g.tgl === tgl) (nil[w.id] = nil[w.id] || {})[g.p] = [g.val, g.jenis, p.data_catatan ? g.cat : "", g.id];
      });
    }
  });
  const lb = liburTgl_(M, tgl);
  return { tgl: tgl, hari: namaHari_(tgl), libur: lb ? (lb.ket || "Libur") : "", lj: liburJk_(M, tgl), abs: abs, nil: nil };
}

// Data satu WBP untuk pengisian nilai pada tanggal lampau (isian susulan)
function getNilaiWbp(token, id, tanggal) {
  const ctx = ctxWajib_(token);
  if (!ctx.perms.act_input_monitoring) throw new Error("Akses ditolak: akun Anda tidak diizinkan mengisi penilaian.");
  if (!tglValid_(tanggal)) throw new Error("Tanggal tidak valid.");
  const M = muatModel_();

  if (!w || w.arsip || !bolehWbp_(ctx.akses, w.jk)) throw new Error("Data WBP tidak ditemukan atau tidak boleh diakses.");
  const nilai = {};
  (M.logs[w.id] || []).forEach(g => {

  });

    id: w.id,
    sb: sb.map((x, j) => x ? LEVEL_MAP[PROGRAM[j]][x.lv] : ""),
    rs: sb.map((x, j) => x ? LEVEL_MAP[PROGRAM[j]][x.rk] : ""),
    nilai: nilai
  });
}

// Riwayat penilaian / absensi dengan saringan dan halaman (dihitung di server)
function getRiwayat(token, f) {
  const ctx = ctxWajib_(token);
  const p = ctx.perms;
  f = f || {};
  const jenis = f.jenis === "absen" ? "absen" : "nilai";
  if (jenis === "nilai" && !p.view_monitoring) throw new Error("Akses ditolak: riwayat penilaian.");
  if (jenis === "absen" && !p.view_absensi) throw new Error("Akses ditolak: riwayat absensi.");
  const v0 = verRingkas_();
  const M = muatModel_();
  const q = String(f.q || "").trim().toLowerCase();
  const dari = tglValid_(f.dari) ? f.dari : "";
  const sampai = tglValid_(f.sampai) ? f.sampai : "";
  const cocok = (w) => {
    if (!w || !bolehWbp_(ctx.akses, w.jk)) return false;
    if (f.id && w.id !== f.id) return false;
    if (f.jk && w.jk !== f.jk) return false;
    if (q) {
      const nama = ctx.nama(w).toLowerCase();
      const blok = p.data_alamat_blok ? String(w.blok).toLowerCase() : "";
      if (nama.indexOf(q) === -1 && blok.indexOf(q) === -1 && w.id.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  };
  const rows = [];
  if (jenis === "nilai") {
    Object.keys(M.logs).forEach(id => {
      const w = M.byId[id];
      if (!cocok(w)) return;
      const a = analisis_(M, w);
      const gain = {};
      a.gains.forEach(g => { gain[g.idLog] = g; });
      const rekor = {};
      PROGRAM.forEach(x => { rekor[x] = w.awal[x]; });
      M.logs[id].forEach(g => {
        let d = 0, n = 0, al = "";
        if (g.lv >= 0 && w.ikut[g.p]) {
          if (g.lv > rekor[g.p]) { const gg = gain[g.id]; d = g.lv - rekor[g.p]; n = gg ? gg.n : 0; al = gg ? gg.alasan : ""; rekor[g.p] = g.lv; }
          else if (g.lv < rekor[g.p]) d = g.lv - rekor[g.p];
        }
        if ((dari && g.tgl < dari) || (sampai && g.tgl > sampai) || (f.p && g.p !== f.p)) return;
        rows.push({
          id: g.id, tgl: g.tgl, w: w.id, nm: ctx.nama(w), bl: p.data_alamat_blok ? w.blok : "", p: g.p, v: g.val, j: g.jenis,
          c: p.data_catatan ? g.cat : "", o: p.data_penginput ? g.oleh : "", d: d, n: n, al: al, r: g.row
        });
      });
    });
  } else {
    Object.keys(M.abs).forEach(id => {
      const w = M.byId[id];
      if (!cocok(w)) return;
      Object.keys(M.abs[id]).forEach(t => {
        const x = M.abs[id][t];
        if ((dari && t < dari) || (sampai && t > sampai) || (f.st && x.st !== f.st)) return;
        rows.push({ tgl: t, w: w.id, nm: ctx.nama(w), bl: p.data_alamat_blok ? w.blok : "", s: x.st, k: x.ket, o: p.data_penginput ? x.oleh : "", r: x.row });
      });
    });
  }
  rows.sort((a, b) => (a.tgl < b.tgl ? 1 : a.tgl > b.tgl ? -1 : b.r - a.r));
  const offset = int_(f.offset, 0, 0, 1000000);
  const limit = int_(f.limit, 100, 1, 5000);
  return bersihkan_({ jenis: jenis, total: rows.length, rows: rows.slice(offset, offset + limit).map(r => { delete r.r; return r; }), _v: v0 });
}

// Rekap kehadiran satu bulan: per tanggal (kelengkapan) dan per WBP
function getRekap(token, bulan) {
  const ctx = ctxWajib_(token);
  if (!ctx.perms.view_absensi) throw new Error("Akses ditolak: rekap absensi.");
  const M = muatModel_();
  if (!/^\d{4}-\d{2}$/.test(String(bulan || ""))) bulan = M.hariIni.slice(0, 7);
  const y = +bulan.slice(0, 4), m = +bulan.slice(5, 7);
  const nHari = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const daftar = M.wbp.filter(w => !w.arsip && bolehWbp_(ctx.akses, w.jk));
  const sesi = [];
  for (let d = 1; d <= nHari; d++) {
    const t = bulan + "-" + pad2_(d);
    const ang = daftar.filter(w => wbpTerjadwal_(M, w, t));
    if (!ang.length) continue;
    let absen = 0, nilai = 0, hadir = 0;
    ang.forEach(w => {
      const x = M.abs[w.id] && M.abs[w.id][t];
      const dinilai = adaNilai_(M, w.id, t);
      if (x) absen++;
      if (dinilai) nilai++;
      if (dinilai || (x && x.st === "Hadir")) hadir++;
    });
    const lb = liburTgl_(M, t);
    sesi.push({ t: t, l: lb ? (lb.ket || "Libur") : "", a: absen, n: nilai, h: hadir, tot: ang.length, m: t > M.hariIni ? 1 : 0 });
  }
  const per = { mulai: bulan + "-01", akhir: bulan + "-" + pad2_(nHari), label: NAMA_BULAN[m - 1] + " " + y };
  const perWbp = daftar.map(w => {
    const mt = metrik_(M, w, per, false);
    let dinilai = 0;
    Object.keys(M.logTgl[w.id] || {}).forEach(t => { if (t >= per.mulai && t <= per.akhir) dinilai++; });
    return { id: w.id, nm: ctx.nama(w), jk: w.jk, hr: w.hari, h: mt.hadir, i: mt.izin, s: mt.sakit, a: mt.alpa, pc: mt.persen, dn: dinilai };
  }).sort((a, b) => a.nm.localeCompare(b.nm));
  return bersihkan_({ bulan: bulan, label: per.label, hariIni: M.hariIni, sesi: sesi, perWbp: perWbp });
}

// ============================================================================
//  PERKEMBANGAN WBP per bulan & per tahun (untuk grafik di kartu WBP)
//  Tiap periode: progres tiap materi (% menuju target, dari level di akhir periode),
//  rata-rata, kehadiran (hadir / hadir+alpa), dan jumlah kenaikan level sah.
// ============================================================================
function getPerkembanganWbp(token, id) {
  const ctx = ctxWajib_(token);
  const p = ctx.perms;
  if (!p.view_dashboard && !p.view_database && !p.view_monitoring && !p.act_input_monitoring && !p.act_absensi) throw new Error("Akses ditolak.");
  const M = muatModel_();
  const w = M.wbp.find(x => x.id === String(id));
  if (!w || !bolehWbp_(ctx.akses, w.jk)) throw new Error("Data WBP tidak ditemukan atau tidak boleh diakses.");
  const a = analisis_(M, w);
  const ikut = PROGRAM.filter(q => w.ikut[q] && w.target[q] >= 0 && w.target[q] > w.awal[q]);
  const hariIni = M.hariIni;
  // awal data: penilaian / absensi pertama (atau tanggal masuk), paling jauh 5 tahun ke belakang
  const kandidat = [a.logPertama, a.presensi.length ? a.presensi[0][0] : "", w.tglMasuk || ""].filter(t => t && t <= hariIni).sort();
  if (!kandidat.length) return { materi: ikut, bulan: [], tahun: [] };
  let mulai = kandidat[0];
  const batas = (+hariIni.slice(0, 4) - 4) + "-01-01";
  if (mulai < batas) mulai = batas;
  const pres = a.presensi, naik = a.gains || [];
  const ringkas = (dari, sampai, label, kunci) => {
    const akhir = sampai > hariIni ? hariIni : sampai;
    const m = {};
    let tot = 0, n = 0;
    ikut.forEach(q => {
      const lv = sebelumTgl_(M, w, q, tambahHari_(akhir, 1)).lv;
      const v = Math.max(0, Math.min(100, Math.round((lv - w.awal[q]) / (w.target[q] - w.awal[q]) * 100)));
      m[q] = v; tot += v; n++;
    });
    let h = 0, al = 0;
    pres.forEach(x => { if (x[0] < dari || x[0] > akhir) return; if (x[1] === "Hadir") h++; else if (x[1] === "Alpa") al++; });
    const nk = naik.reduce((t, g) => t + (g.tgl >= dari && g.tgl <= akhir ? (g.n || 0) : 0), 0);
    return { k: kunci, l: label, m: m, r: n ? Math.round(tot / n) : null, h: h, a: al, pc: (h + al) ? Math.round(h * 100 / (h + al)) : null, n: nk };
  };
  const PDK = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  const bulan = [];
  let y = +mulai.slice(0, 4), mo = +mulai.slice(5, 7);
  const yAkhir = +hariIni.slice(0, 4), mAkhir = +hariIni.slice(5, 7);
  while (y < yAkhir || (y === yAkhir && mo <= mAkhir)) {
    const dari = y + "-" + pad2_(mo) + "-01";
    const sampai = y + "-" + pad2_(mo) + "-" + pad2_(new Date(Date.UTC(y, mo, 0)).getUTCDate());
    bulan.push(ringkas(dari, sampai, PDK[mo - 1] + " " + String(y).slice(2), y + "-" + pad2_(mo)));
    mo++; if (mo > 12) { mo = 1; y++; }
  }
  const tahun = [];
  for (let t = +mulai.slice(0, 4); t <= yAkhir; t++) tahun.push(ringkas(t + "-01-01", t + "-12-31", String(t), String(t)));
  return { materi: ikut, bulan: bulan.slice(-24), tahun: tahun };
}


// ============================================================================
//  CEK DATA BARU (sangat ringan): versi tiap bagian data + tanggal hari ini.
//  Aplikasi menampilkan data yang sudah ada, lalu hanya memuat ulang bila versinya berubah.
// ============================================================================
function verRingkas_() {
  const c = capVersi_(), o = { hari: hariIni_() };
  BAGIAN_VERSI.forEach(b => { o[b] = c[b] + ":" + c[b + "U"]; });
  return o;
}
function getVersiData(token) {
  if (token && !getSession_(token)) return { habis: 1 };
  return verRingkas_();
}
// ============================================================================
//  MENYIMPAN DATA
//  Absensi dan nilai disimpan tanpa menghitung ulang statistik seluruh WBP.
//  Yang dibaca hanya sheet Database_WBP (untuk memeriksa izin) dan baris
//  sheet tujuan yang sudah tersimpan di cache, jadi satu simpanan cukup cepat.
// ============================================================================
function unikPerId_(items) {
  const peta = {}, urut = [];
  (items || []).forEach(it => {
    const id = String(it && it.id || "");
    if (!id) return;
    if (!(id in peta)) urut.push(id);
    peta[id] = it;
  });
  return urut.map(id => peta[id]);
}

// Peta ringan id -> data WBP yang dibutuhkan untuk memeriksa simpanan
function petaWbp_() {
  const t = tabel_("WBP"), c = t.c;
  const out = {};
  for (let i = 1; i < t.v.length; i++) {
    const r = t.v[i];
    const id = String(r[c.ID_WBP] || "").trim();
    if (!id) continue;
    const ikut = {};
    PROGRAM.forEach(p => { ikut[p] = levelNyata_(p, String(r[c["Level_Awal_" + p]])); });
    out[id] = { row: i + 1, id: id, nama: String(r[c.Nama_WBP] || ""), jk: normJk_(r[c.Jenis_Kelamin]), arsip: bool_(r[c.Arsip]), ikut: ikut };
  }
  return out;
}

// ============================================================================
//  ABSENSI
// ============================================================================
// data: { tanggal, items: [{ id, s: "Hadir"|"Izin"|"Sakit"|"Alpa"|"" (kosong = hapus), k: keterangan }] }
function simpanAbsensi(token, data) {
  const ctx = otorisasi_(token, "act_absensi");
  const tgl = String((data && data.tanggal) || "");
  if (!tglValid_(tgl)) return gagal_("Tanggal tidak valid.");
  if (tgl > hariIni_()) return gagal_("Tanggal tidak boleh di masa depan.");
  const items = unikPerId_(data.items).slice(0, 800);
  if (!items.length) return gagal_("Belum ada WBP yang ditandai.");
  return denganKunci_(() => {
    const W = petaWbp_();
    const t = tabel_("ABS"), c = t.c;
    const ada = {};
    for (let i = 1; i < t.v.length; i++) {
      if (fmtTgl_(t.v[i][c.Tanggal]) === tgl) ada[String(t.v[i][c.ID_WBP] || "").trim()] = { row: i + 1, st: normStatus_(t.v[i][c.Status]), ket: String(t.v[i][c.Keterangan] || "") };
    }
    const baru = [], hapus = [];
    let ubah = 0, tolak = 0;
    items.forEach(it => {
      const w = W[String(it.id)];
      if (!w || w.arsip) return;
      if (!bolehWbp_(ctx.akses, w.jk)) { tolak++; return; }
      const mentah = String(it.s || "");
      const st = mentah ? normStatus_(mentah) : "";
      if (mentah && !st) return;
      const x = ada[w.id];
      if (!st) { if (x) hapus.push(x.row); return; }
      const ket = bersih_(it.k, 150);
      if (x) {
        if (x.st !== st || x.ket !== ket) {
          tulisBaris_(t, x.row, { Status: st, Keterangan: ket, Dicatat_Oleh: ctx.s.username, Waktu: new Date() }, []);
          ubah++;
        }
      } else {
        baru.push({ Tanggal: tgl, ID_WBP: w.id, Status: st, Keterangan: ket, Dicatat_Oleh: ctx.s.username, Waktu: new Date() });
      }
    });
    tambahBaris_(t, baru, ["Tanggal", "Keterangan"]);
    hapusBaris_(t, hapus);
    if (baru.length || ubah || hapus.length) naikVersi_("a", ubah || hapus.length);
    let msg = "Absensi tersimpan.";
    if (tolak) msg += " " + tolak + " WBP dilewati karena di luar wewenang Anda.";
    return { success: true, message: msg, n: baru.length + ubah + hapus.length };
  });
}

// Ubah / hapus satu catatan absensi dari halaman riwayat
function ubahAbsen(token, idWbp, tgl, status, ket) {
  const ctx = otorisasi_(token, "act_edit_riwayat");
  if (!tglValid_(tgl)) return gagal_("Tanggal tidak valid.");
  const st = status ? normStatus_(status) : "";
  if (status && !st) return gagal_("Status tidak valid.");
  return denganKunci_(() => {
    const w = petaWbp_()[String(idWbp)];
    if (!w) return gagal_("Data WBP tidak ditemukan.");
    if (!bolehWbp_(ctx.akses, w.jk)) return gagal_("Anda tidak berwenang mengubah data WBP ini.");
    const t = tabel_("ABS"), c = t.c;
    let row = 0;
    for (let i = 1; i < t.v.length; i++) {
      if (String(t.v[i][c.ID_WBP]).trim() === w.id && fmtTgl_(t.v[i][c.Tanggal]) === tgl) { row = i + 1; break; }
    }
    if (!row) return gagal_("Catatan absensi tidak ditemukan.");
    if (!st) hapusBaris_(t, [row]);
    else tulisBaris_(t, row, { Status: st, Keterangan: bersih_(ket, 150), Dicatat_Oleh: ctx.s.username, Waktu: new Date() }, ["Keterangan"]);
    naikVersi_("a", true);
    catat_(ctx.s, st ? "UBAH ABSENSI" : "HAPUS ABSENSI", w.id + " " + tgl + (st ? " -> " + st : ""));
    return { success: true, message: st ? "Absensi diperbarui." : "Catatan absensi dihapus." };
  });
}

/* Menyamakan kolom Level_Sekarang_* satu WBP dengan nilai terakhirnya,
   supaya isi Google Sheet tetap mudah dibaca. Hanya menulis bila berbeda. */
function sinkronLevelWbp_(id, W) {
  const w = W[id];
  if (!w) return;
  const G = tabel_("LOG"), gc = G.c;
  const akhir = {};
  for (let i = 1; i < G.v.length; i++) {
    const r = G.v[i];
    if (String(r[gc.ID_WBP]).trim() !== id) continue;
    const p = String(r[gc.Kategori] || "").trim();
    const v = String(r[gc.Level_Tercapai]);
    if (!LEVEL_MAP[p] || !levelNyata_(p, v)) continue;
    const t = fmtTgl_(r[gc.Tanggal_Input]);
    if (!akhir[p] || t >= akhir[p].t) akhir[p] = { t: t, v: v };
  }
  const tw = tabel_("WBP"), c = tw.c;
  const baris = tw.v[w.row - 1] || [];
  const nilai = {};
  PROGRAM.forEach(p => {
    if (!w.ikut[p]) return;
    const v = akhir[p] ? akhir[p].v : String(baris[c["Level_Awal_" + p]]);
    if (String(baris[c["Level_Sekarang_" + p]]) !== v) nilai["Level_Sekarang_" + p] = v;
  });
  if (Object.keys(nilai).length) tulisBaris_(tw, w.row, nilai, []);
}

// data: { tanggal, jenis, items: [{ id, n: { BTQ: level | "#hapus", ... }, c: catatan }] }
function simpanMonitoring(token, data) {
  const ctx = otorisasi_(token, "act_input_monitoring");
  const tgl = String((data && data.tanggal) || "");
  if (!tglValid_(tgl)) return gagal_("Tanggal tidak valid.");
  if (tgl > hariIni_()) return gagal_("Tanggal tidak boleh di masa depan.");
  const jenis = "Rutin";            // jenis asesmen sudah dihapus (v6.7): semua penilaian dihitung sama
  const items = unikPerId_(data.items).slice(0, 800);
  if (!items.length) return gagal_("Belum ada nilai yang diisi.");
  return denganKunci_(() => {
    const W = petaWbp_();
    const t = tabel_("LOG"), c = t.c;
    const ingin = {};
    items.forEach(it => { ingin[String(it.id)] = true; });
    const ada = {};
    for (let i = 1; i < t.v.length; i++) {
      const r = t.v[i];
      const id = String(r[c.ID_WBP] || "").trim();
      if (!ingin[id] || fmtTgl_(r[c.Tanggal_Input]) !== tgl) continue;
      const k = id + "|" + String(r[c.Kategori] || "").trim();
      (ada[k] = ada[k] || []).push(i + 1);
    }
    const baru = [], hapus = [], disentuh = {};
    let ubah = 0, tolak = 0, lewat = 0;
    const tglDate = Utilities.parseDate(tgl, tz_(), "yyyy-MM-dd");
    items.forEach(it => {
      const w = W[String(it.id)];
      if (!w || w.arsip) { lewat++; return; }
      if (!bolehWbp_(ctx.akses, w.jk)) { tolak++; return; }
      const cat = (it.c === undefined || it.c === null) ? null : bersih_(it.c, 500);
      PROGRAM.forEach(p => {
        const v = it.n ? it.n[p] : undefined;
        if (v === undefined || v === null || v === "") return;
        const baris = ada[w.id + "|" + p] || [];
        if (v === "#hapus") { baris.forEach(r => hapus.push(r)); if (baris.length) disentuh[w.id] = true; return; }
        if (!w.ikut[p] || !levelNyata_(p, v)) { lewat++; return; }
        const nilai = { Level_Tercapai: String(v), Diinput_Oleh: ctx.s.username, Jenis: jenis, Waktu_Input: new Date() };
        if (cat !== null && ctx.perms.data_catatan) nilai.Catatan_Pembina = cat;
        if (baris.length) {
          tulisBaris_(t, baris[0], nilai, ["Catatan_Pembina"]);
          baris.slice(1).forEach(r => hapus.push(r));
          ubah++;
        } else {
          baru.push(Object.assign({ ID_Monitoring: idBaru_("MON"), Tanggal_Input: tglDate, ID_WBP: w.id, Kategori: p, Catatan_Pembina: "" }, nilai));
        }
        disentuh[w.id] = true;
      });
    });
    tambahBaris_(t, baru, ["Catatan_Pembina"]);
    hapusBaris_(t, hapus);
    const berubah = baru.length || ubah || hapus.length;
    if (berubah) {
      if (ubah || hapus.length) _TAB.LOG = null;           // baris bergeser/berubah: baca ulang untuk sinkron
      else baru.forEach(o => {
        const baris = new Array(t.lebar).fill("");
        Object.keys(o).forEach(k => { if (t.c[k] !== undefined) baris[t.c[k]] = o[k]; });
        t.v.push(baris);
      });
      Object.keys(disentuh).forEach(id => { try { sinkronLevelWbp_(id, W); } catch (e) { /* kolom bantu saja */ } });
      naikVersi_("n", ubah || hapus.length);
    }
    let msg = "Penilaian tersimpan.";
    if (tolak) msg += " " + tolak + " WBP dilewati karena di luar wewenang Anda.";
    if (lewat) msg += " " + lewat + " nilai dilewati (materi tidak diikuti, level tidak dikenal, atau WBP diarsipkan).";
    return { success: true, message: msg, n: baru.length + ubah + hapus.length };
  });
}

// Cari satu baris riwayat penilaian berdasarkan ID_Monitoring
function cariLog_(idLog) {
  const t = tabel_("LOG"), c = t.c;
  for (let i = 1; i < t.v.length; i++) {
    if (String(t.v[i][c.ID_Monitoring]) === String(idLog)) {
      return { row: i + 1, id: String(t.v[i][c.ID_WBP]).trim(), p: String(t.v[i][c.Kategori]).trim() };
    }
  }
  return null;
}

function editLog(token, idLog, level, catatan) {

  return denganKunci_(() => {
    const g = cariLog_(idLog);

}
