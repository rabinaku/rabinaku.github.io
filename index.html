function levelAtauTidakIkut_(p, v) { return String(v) === TIDAK_IKUT || levelValid_(p, v); }

// d: { id?, nama, jk, hari: ["Senin", ...], bl, al, tm, aw: {BTQ..}, tg: {BTQ..} }
function saveWBP(token, d) {
  const ctx = otorisasi_(token, "act_edit_wbp");
  d = d || {};
  const p = ctx.perms;
  for (let i = 0; i < PROGRAM.length; i++) {
    const q = PROGRAM[i];
    const aw = String((d.aw || {})[q] || ""), tg = String((d.tg || {})[q] || "");
    if (!levelAtauTidakIkut_(q, aw)) return gagal_("Level awal " + q + " tidak valid.");
    if (!levelAtauTidakIkut_(q, tg)) return gagal_("Target " + q + " tidak valid.");
  }
  const tm = d.tm ? fmtTgl_(d.tm) : "";
  if (d.tm && !tm) return gagal_("Tanggal masuk tidak valid.");
  const jk = normJk_(d.jk);
  if (!jk) return gagal_("Pilih jenis kelamin.");
  const hari = parseHari_([].concat(d.hari || []).join(","));
  if (!hari.length) return gagal_("Pilih minimal satu hari jadwal belajar.");
  if (!bolehWbp_(ctx.akses, jk)) return gagal_("Hanya guru perempuan atau admin yang boleh mengelola data WBP perempuan.");
  return denganKunci_(() => {
    const t = tabel_("WBP");
    const nilai = { Jenis_Kelamin: jk, Hari_Jadwal: hari.join(", ") };
    if (d.pj !== undefined && d.pj !== null) nilai.Peran = d.pj ? "Pengajar" : "";
    PROGRAM.forEach(q => { nilai["Level_Awal_" + q] = String(d.aw[q]); nilai["Level_Target_" + q] = String(d.tg[q]); });

    if (d.id) {
      const W = petaWbp_();
      const w = W[String(d.id)];
      if (!w) return gagal_("Data WBP tidak ditemukan.");
      if (!bolehWbp_(ctx.akses, w.jk)) return gagal_("Anda tidak berwenang mengubah data WBP ini.");
      if (p.data_nama_lengkap) {
        const nama = bersih_(d.nama, 120);
        if (!nama) return gagal_("Nama tidak boleh kosong.");
        nilai.Nama_WBP = nama;
      }
      if (p.data_alamat_blok) { nilai.Alamat = bersih_(d.al, 200); nilai.Blok = bersih_(d.bl, 40); }
      if (tm) nilai.Tanggal_Masuk = tm;
      tulisBaris_(t, w.row, nilai, ["Tanggal_Masuk", "Blok", "Hari_Jadwal"]);
      lupakan_();
      sinkronSheet_(muatModel_(), true);
      naikVersi_("w");
      catat_(ctx.s, "UBAH WBP", w.id + " - " + (nilai.Nama_WBP || w.nama));
      return { success: true, message: "Data WBP diperbarui.", id: w.id };
    }

    const nama = bersih_(d.nama, 120);
    if (!nama) return gagal_("Nama tidak boleh kosong.");
    const id = idBaru_("WBP");
    Object.assign(nilai, {
      ID_WBP: id, Nama_WBP: nama, Alamat: bersih_(d.al, 200), Blok: bersih_(d.bl, 40),
      Status: "Aktif", Arsip: false, Tanggal_Masuk: tm || hariIni_(), Tanggal_Lulus: ""
    });
    PROGRAM.forEach(q => { nilai["Level_Sekarang_" + q] = String(d.aw[q]); });
    tambahBaris_(t, [nilai], ["Tanggal_Masuk", "Blok", "Tanggal_Lulus", "Hari_Jadwal"]);
    naikVersi_("w");
    catat_(ctx.s, "TAMBAH WBP", id + " - " + nama);
    return { success: true, message: "WBP ditambahkan.", id: id };
  });
}

function deleteWBP(token, id) {
  const ctx = otorisasi_(token, "act_delete_wbp");
  return denganKunci_(() => {
    lupakan_();
    const M = muatModel_();
    const w = M.byId[String(id)];
    if (!w) return gagal_("Data WBP tidak ditemukan.");
    if (!bolehWbp_(ctx.akses, w.jk)) return gagal_("Anda tidak berwenang menghapus data WBP ini.");
    hapusBaris_(tabel_("LOG"), (M.logs[w.id] || []).map(g => g.row));
    const ab = M.abs[w.id] || {};
    hapusBaris_(tabel_("ABS"), Object.keys(ab).map(t => ab[t].row));
    tabel_("WBP").sh.deleteRow(w.row);
    naikVersi_("wna", true);
    catat_(ctx.s, "HAPUS WBP", w.id + " - " + w.nama);
    return { success: true, message: "Data WBP dan seluruh riwayatnya dihapus." };
  });
}

// aksi: "arsip" (nilai true/false), "jk" (nilai L/P), "hari" (nilai daftar hari)
// Tambah banyak WBP sekaligus (dari daftar yang ditempel). umum: jk, hari, aw, tg, tm untuk semua.
function tambahBanyakWBP(token, daftar, umum) {
  otorisasi_(token, "act_edit_wbp");
  daftar = Array.isArray(daftar) ? daftar : [];
  if (!daftar.length) return gagal_("Daftar nama masih kosong.");
  if (daftar.length > 300) return gagal_("Maksimal 300 nama sekali simpan.");
  umum = umum || {};
  let n = 0;
  const gagal = [];
  daftar.forEach(x => {
    const d = Object.assign({}, umum, { id: "", nama: x && x.nama, bl: (x && x.bl) || "", al: (x && x.al) || "" });
    const r = saveWBP(token, d);
    if (r && r.success) n++; else gagal.push(String((x && x.nama) || "?") + " (" + ((r && r.message) || "gagal") + ")");
  });
  if (!n) return gagal_("Tidak ada yang tersimpan. " + gagal.slice(0, 3).join("; "));
  return { success: true, n: n, message: n + " WBP ditambahkan." + (gagal.length ? " " + gagal.length + " gagal: " + gagal.slice(0, 3).join("; ") + (gagal.length > 3 ? "…" : "") : "") };
}

function bulkUpdateWBP(token, ids, aksi, nilai) {
  const ctx = otorisasi_(token, "act_edit_wbp");
  if (["arsip", "jk", "hari"].indexOf(aksi) === -1) return gagal_("Aksi tidak dikenal.");
  if (!Array.isArray(ids) || !ids.length) return gagal_("Pilih minimal satu WBP.");
  if (aksi === "jk" && ["L", "P"].indexOf(String(nilai)) === -1) return gagal_("Jenis kelamin tidak valid.");
  if (aksi === "jk" && nilai === "P" && ctx.akses !== "semua") return gagal_("Hanya guru perempuan atau admin yang boleh menetapkan WBP perempuan.");
  const hari = aksi === "hari" ? parseHari_([].concat(nilai || []).join(",")) : [];
  if (aksi === "hari" && !hari.length) return gagal_("Pilih minimal satu hari.");
  return denganKunci_(() => {
    const t = tabel_("WBP"), c = t.c;
    if (t.v.length < 2) return gagal_("Belum ada data WBP.");
    const W = petaWbp_();
    const kolom = { arsip: "Arsip", jk: "Jenis_Kelamin", hari: "Hari_Jadwal" }[aksi];
    const isi = t.v.slice(1).map(r => [r[c[kolom]]]);
    let ok = 0, tolak = 0;
    (ids || []).slice(0, 3000).forEach(id => {
      const w = W[String(id)];
      if (!w) return;
      if (!bolehWbp_(ctx.akses, w.jk)) { tolak++; return; }
      isi[w.row - 2][0] = aksi === "arsip" ? !!nilai : aksi === "jk" ? nilai : hari.join(", ");
      ok++;
    });
    if (ok) {
      const rg = t.sh.getRange(2, c[kolom] + 1, isi.length, 1);
      if (aksi === "hari") rg.setNumberFormat("@");
      rg.setValues(isi);
      if (aksi === "arsip" && !nilai && c.Tanggal_Keluar !== undefined) {
        ["Tanggal_Keluar", "Alasan_Keluar"].forEach(k => {
          const kol = t.v.slice(1).map(r => [r[c[k]]]);
          (ids || []).forEach(id => { const w = W[String(id)]; if (w && bolehWbp_(ctx.akses, w.jk)) kol[w.row - 2][0] = ""; });
          t.sh.getRange(2, c[k] + 1, kol.length, 1).setValues(kol);
        });
      }
      naikVersi_("w");
      catat_(ctx.s, "UBAH MASSAL " + aksi.toUpperCase(), ok + " WBP" + (nilai !== undefined ? " -> " + nilai : ""));
    }
    let msg = ok + " WBP diperbarui.";
    if (tolak) msg += " " + tolak + " di luar wewenang Anda.";
    return { success: ok > 0, message: msg };
  });
}

// ============================================================================
//  WBP KELUAR (bebas / pindah) langsung dari halaman absensi
//  Data WBP diarsipkan (riwayatnya tetap ada), tanggal & alasan keluar dicatat,
//  dan absensi pada/ sesudah tanggal keluar dihapus supaya rekap tetap benar.
// ============================================================================
const ALASAN_KELUAR = ["Bebas", "Pindah rutan/lapas", "Lainnya"];
function tandaiKeluar(token, id, tgl, alasan, ket) {
  const ctx = otorisasi_(token, "act_bebas");
  tgl = String(tgl || "");
  if (!tglValid_(tgl)) return gagal_("Tanggal keluar tidak valid.");
  if (tgl > hariIni_()) return gagal_("Tanggal keluar tidak boleh di masa depan.");
  if (ALASAN_KELUAR.indexOf(String(alasan)) === -1) return gagal_("Pilih alasan keluar.");
  const teks = String(alasan) + (ket ? " - " + bersih_(ket, 100) : "");
  return denganKunci_(() => {
    const W = petaWbp_();
    const w = W[String(id)];
    if (!w) return gagal_("Data WBP tidak ditemukan.");
    if (!bolehWbp_(ctx.akses, w.jk)) return gagal_("Anda tidak berwenang mengubah data WBP ini.");
    if (w.arsip) return gagal_("WBP ini sudah tercatat keluar.");
    tulisBaris_(tabel_("WBP"), w.row, { Arsip: true, Tanggal_Keluar: tgl, Alasan_Keluar: teks }, ["Tanggal_Keluar", "Alasan_Keluar"]);
    // absensi pada / sesudah tanggal keluar tidak berlaku lagi
    const A = tabel_("ABS"), ac = A.c, hapus = [];
    for (let i = 1; i < A.v.length; i++) {
      if (String(A.v[i][ac.ID_WBP] || "").trim() === w.id && fmtTgl_(A.v[i][ac.Tanggal]) >= tgl) hapus.push(i + 1);
    }
    hapusBaris_(A, hapus);
    naikVersi_(hapus.length ? "wa" : "w", true);
    catat_(ctx.s, "WBP KELUAR", w.id + " - " + w.nama + " (" + teks + ", " + tgl + ")");
    return { success: true, message: w.nama + " dicatat keluar (" + String(alasan).toLowerCase() + ") dan dipindahkan ke arsip." };
  });
}

// Catatan & level terakhir seorang WBP dari semua pengajar, untuk dilihat saat menilai
function getCatatanWbp(token, id) {
  const ctx = ctxWajib_(token);
  const p = ctx.perms;
  if (!p.act_input_monitoring && !p.view_monitoring) throw new Error("Akses ditolak.");
  const W = petaWbp_();
  const w = W[String(id)];
  if (!w || !bolehWbp_(ctx.akses, w.jk)) throw new Error("Data WBP tidak ditemukan atau tidak boleh diakses.");
  const t = tabel_("LOG"), c = t.c;
  const per = {};
  for (let i = t.v.length - 1; i >= 1; i--) {
    const r = t.v[i];
    if (String(r[c.ID_WBP] || "").trim() !== w.id) continue;
    const q = String(r[c.Kategori] || "").trim();
    if (!LEVEL_MAP[q]) continue;
    (per[q] = per[q] || []).push({
      t: fmtTgl_(r[c.Tanggal_Input]), v: String(r[c.Level_Tercapai]),
      c: p.data_catatan ? String(r[c.Catatan_Pembina] || "") : "", o: p.data_penginput ? String(r[c.Diinput_Oleh] || "") : ""
    });
  }
  const hasil = {};
  Object.keys(per).forEach(q => {
    // terbaru dulu: 3 terakhir, ditambah catatan terakhir yang berisi bila belum ikut
    const L = per[q].sort((a, b) => (a.t < b.t ? 1 : a.t > b.t ? -1 : 0));
    const ambil = L.slice(0, 3);
    const adaCat = L.find(x => x.c);
    if (adaCat && ambil.indexOf(adaCat) === -1) ambil.push(adaCat);
    hasil[q] = ambil;
  });
  return bersihkan_({ id: w.id, materi: hasil });
}


// ============================================================================
//  JADWAL PENGGANTI: pada tanggal tertentu, panggil kelompok hari lain (putra / putri),
//  dan (opsional) liburkan kelompok hari tanggal itu.
//  d: { tgl, jk: "L"|"P", panggil: "Senin", libur: true|false, ket }
// ============================================================================
function addGanti(token, d) {
  const ctx = ctxWajib_(token);
  if (!ctx.perms.act_jadwal) return gagal_("Akses ditolak: tidak boleh mengatur jadwal pengganti.");
  d = d || {};
  const tgl = String(d.tgl || ""), jk = normJk_(d.jk), panggil = parseHari_(String(d.panggil || ""))[0];
  if (!tglValid_(tgl)) return gagal_("Tanggal tidak valid.");
  if (!jk) return gagal_("Pilih putra atau putri.");
  if (!bolehWbp_(ctx.akses, jk)) return gagal_("Anda tidak menangani WBP " + (jk === "P" ? "putri" : "putra") + ".");
  if (!panggil) return gagal_("Pilih kelompok hari yang dipanggil.");
  if (panggil === namaHari_(tgl)) return gagal_("Kelompok " + panggil + " memang jadwalnya hari itu; pilih tanggal di hari lain.");
  return denganKunci_(() => {
    lupakan_();
    if (bacaGanti_().some(x => x.tgl === tgl && x.jk === jk)) return gagal_("Tanggal itu sudah punya jadwal pengganti untuk WBP " + (jk === "P" ? "putri" : "putra") + ". Hapus dulu bila ingin mengubah.");
    tambahBaris_(tabel_("GANTI", true), [{ Tanggal: tgl, Jenis_Kelamin: jk, Panggil: panggil, Liburkan: d.libur ? "Ya" : "Tidak", Keterangan: bersih_(d.ket, 100), Dibuat_Oleh: ctx.s.username }],
      ["Tanggal", "Jenis_Kelamin", "Panggil", "Liburkan", "Keterangan", "Dibuat_Oleh"]);
    naikVersi_("k");
    catat_(ctx.s, "JADWAL PENGGANTI", tgl + " " + (jk === "P" ? "putri" : "putra") + ": panggil " + panggil + (d.libur ? ", " + namaHari_(tgl) + " libur" : ""));
    return { success: true, message: "Jadwal pengganti tersimpan: " + namaHari_(tgl) + " " + tgl.split("-").reverse().join("/") + " memanggil kelompok " + panggil + "." };
  });
}

function deleteGanti(token, tgl, jk) {
  const ctx = ctxWajib_(token);
  if (!ctx.perms.act_jadwal) return gagal_("Akses ditolak.");
  jk = normJk_(jk);
  if (!bolehWbp_(ctx.akses, jk)) return gagal_("Akses ditolak.");
  return denganKunci_(() => {
    const t = tabel_("GANTI", true), c = t.c, rows = [];
    for (let i = 1; i < t.v.length; i++) if (fmtTgl_(t.v[i][c.Tanggal]) === tgl && normJk_(t.v[i][c.Jenis_Kelamin]) === jk) rows.push(i + 1);
    if (!rows.length) return gagal_("Jadwal pengganti tidak ditemukan.");
    hapusBaris_(t, rows);
    naikVersi_("k");
    catat_(ctx.s, "HAPUS JADWAL PENGGANTI", tgl + " " + (jk === "P" ? "putri" : "putra"));
    return { success: true, message: "Jadwal pengganti dihapus." };
  });
}

/* Kolom bantu di Google Sheet (Status, Level_Sekarang, Tanggal_Lulus) disegarkan paling
   sering sekali 6 jam, supaya membuka Pengaturan tetap cepat. Cadangan harian juga menyegarkannya. */
function sinkronBerkala_() {
  const props = PropertiesService.getScriptProperties();
  const akhir = parseInt(props.getProperty("SINKRON_MS") || "0", 10);
  if (Date.now() - akhir < 6 * 3600000) return;
  try { lupakan_(); sinkronSheet_(muatModel_(), false); props.setProperty("SINKRON_MS", String(Date.now())); } catch (e) { /* abaikan */ }
}

function saveSettings(token, o) {
  const ctx = otorisasi_(token, "admin");
  o = o || {};
  const nama = bersih_(o.app_name, 60);
  if (!nama) return gagal_("Nama aplikasi tidak boleh kosong.");
  const logo = String(o.logo_url || "").trim();
  const logoData = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(logo);
  if (logo && !logoData && !/^https:\/\//i.test(logo)) return gagal_("Alamat logo harus diawali https://");
  if (logoData && logo.length > 48000) return gagal_("Gambar logo terlalu besar. Pilih gambar lain atau yang lebih sederhana.");
  const stg = parseInt(o.stagnan_hari, 10), mdk = parseInt(o.mandek_minggu, 10), bdn = parseInt(o.belum_dinilai_minggu, 10);
  if (!(stg >= 1 && stg <= 365)) return gagal_("Batas tidak aktif harus 1 sampai 365 hari.");
  if (!(mdk >= 2 && mdk <= 52)) return gagal_("Batas level mandek harus 2 sampai 52 minggu.");
  if (!(bdn >= 1 && bdn <= 52)) return gagal_("Batas belum dinilai harus 1 sampai 52 minggu.");
  const hd = parseInt(o.hero_detik, 10);
  if (!(hd >= 0 && hd <= 120)) return gagal_("Detik pergantian kartu harus 0 sampai 120 (0 = tidak berganti otomatis).");
  denganKunci_(() => {
    writeSetting_("app_name", nama);
    writeSetting_("app_subtitle", bersih_(o.app_subtitle, 80));
    writeSetting_("institusi", bersih_(o.institusi, 80));
    writeSetting_("logo_url", logo);
    writeSetting_("stagnan_hari", stg);
    writeSetting_("mandek_minggu", mdk);
    writeSetting_("belum_dinilai_minggu", bdn);
    writeSetting_("hero_detik", hd);
    // (sejak v6.9 diatur lewat tabel Hak akses; hanya ditulis bila dikirim)
    if (o.dashboard_publik !== undefined) writeSetting_("dashboard_publik", o.dashboard_publik === false || o.dashboard_publik === "0" ? "0" : "1");
  });
  naikVersi_("s");
  catat_(ctx.s, "UBAH PENGATURAN UMUM", nama);
  return { success: true, message: "Pengaturan tersimpan." };
}

function savePenilaian(token, o) {
  const ctx = otorisasi_(token, "admin");
  o = o || {};
  const resmi = String(o.tgl_mulai_resmi || "").trim();
  if (resmi && !tglValid_(resmi)) return gagal_("Tanggal mulai resmi tidak valid.");
  const cekAngka = (v, min, max, label) => {
    const n = parseInt(v, 10);
    if (isNaN(n) || n < min || n > max) throw new Error(label + " harus " + min + " sampai " + max + ".");
    return n;
  };
  let nilai;
  try {
    nilai = {
      orientasi_minggu: cekAngka(o.orientasi_minggu, 0, 26, "Masa orientasi"),
      batas_naik_minggu: cekAngka(o.batas_naik_minggu, 0, 20, "Batas kenaikan per minggu"),
      bobot_hadir: cekAngka(o.bobot_hadir, 0, 1000, "Poin hadir"),
      bobot_naik: cekAngka(o.bobot_naik, 0, 1000, "Poin naik level"),
      bobot_lulus: cekAngka(o.bobot_lulus, 0, 10000, "Poin lulus"),
      min_sesi_juara: cekAngka(o.min_sesi_juara, 1, 50, "Minimal sesi")
    };
  } catch (e) { return gagal_(e.message); }
  denganKunci_(() => {
    writeSetting_("tgl_mulai_resmi", resmi);
    Object.keys(nilai).forEach(k => writeSetting_(k, nilai[k]));
  });
  naikVersi_("s");
  catat_(ctx.s, "UBAH ATURAN HADIAH", JSON.stringify(nilai) + (resmi ? " resmi " + resmi : ""));
  return { success: true, message: "Aturan penilaian dan hadiah disimpan." };
}

// ----- Pengguna -----
function jumlahAdminAktif_() { return readUsers_().filter(u => u.role === "admin" && u.aktif).length; }

function addUser(token, d) {
  const ctx = otorisasi_(token, "admin");
  d = d || {};
  const username = String(d.username || "").trim();
  const nama = bersih_(d.nama, 60);
  const role = d.role === "admin" ? "admin" : "guru";
  const password = String(d.password || "");
  const jk = normJk_(d.jk);
  if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) return gagal_("Username 3 sampai 30 karakter: huruf, angka, titik, strip, atau garis bawah.");
  if (!nama) return gagal_("Nama tidak boleh kosong.");
  if (!jk) return gagal_("Pilih jenis kelamin pengguna (menentukan WBP yang boleh ditangani).");
  if (password.length < 6) return gagal_("Password minimal 6 karakter.");
  return denganKunci_(() => {
    const t = tabel_("USER", true);
    if (readUsers_().some(u => u.username.toLowerCase() === username.toLowerCase())) return gagal_("Username sudah dipakai.");
    const ub = userBaru_(username, nama, role, password, false, jk);
    const aksesBaru = role === "admin" ? {} : bersihAkses_(d.akses || (d.bebas ? { act_bebas: true } : {}));
    if (Object.keys(aksesBaru).length) ub.Akses = JSON.stringify(aksesBaru);
    tambahBaris_(t, [ub], ["Akses"]);
    naikVersi_("u");
    catat_(ctx.s, "TAMBAH PENGGUNA", username + " (" + role + ", " + jk + ")");
    return { success: true, message: "Pengguna " + username + " ditambahkan." };
  });
}

function updateUser(token, d) {
  const ctx = otorisasi_(token, "admin");
  d = d || {};
  return denganKunci_(() => {
    const t = tabel_("USER", true);
    const u = readUsers_().find(x => x.username === d.username);
    if (!u) return gagal_("Pengguna tidak ditemukan.");
    const nama = bersih_(d.nama, 60) || u.nama;
    const role = d.role === "admin" ? "admin" : "guru";
    const jk = normJk_(d.jk);
    if (!jk) return gagal_("Pilih jenis kelamin pengguna.");
    if (u.username === ctx.s.username && role !== "admin") return gagal_("Anda tidak bisa menurunkan peran akun sendiri.");
    if (u.role === "admin" && role !== "admin" && u.aktif && jumlahAdminAktif_() <= 1) return gagal_("Minimal harus ada 1 admin aktif.");
    const nilai = { Nama: nama, Role: role, Jenis_Kelamin: jk };
    if (d.akses !== undefined || d.bebas !== undefined) {
      let akses = d.akses !== undefined ? bersihAkses_(d.akses) : bersihAkses_(u.akses);
      if (d.akses === undefined) { if (d.bebas) akses.act_bebas = true; else delete akses.act_bebas; }
      if (role === "admin") akses = {};
      nilai.Akses = Object.keys(akses).length ? JSON.stringify(akses) : "";
    }
    tulisBaris_(t, u.row, nilai, ["Akses"]);
    naikVersi_("u");
    catat_(ctx.s, "UBAH PENGGUNA", u.username + " (" + role + ", " + jk + ")");
    return { success: true, message: "Data pengguna " + u.username + " diperbarui." };
  });
}

}

// ----- Libur khusus -----
// d.lingkup: "Semua" (default), "Putra", atau "Putri"
function addLibur(token, d) {
  const ctx = otorisasi_(token, "admin");
  d = d || {};
  const mulai = String(d.mulai || ""), akhir = String(d.akhir || d.mulai || "");
  const lk = lingkupLibur_(d.lingkup) || "Semua";
  if (!tglValid_(mulai) || !tglValid_(akhir)) return gagal_("Tanggal tidak valid.");
  if (akhir < mulai) return gagal_("Tanggal akhir tidak boleh sebelum tanggal mulai.");
  const nHari = (tglMs_(akhir) - tglMs_(mulai)) / 86400000 + 1;
  if (nHari > 62) return gagal_("Maksimal 62 hari sekali input.");
  return denganKunci_(() => {
    lupakan_();
    const ada = {};
    bacaLibur_().forEach(x => { (ada[x.tgl] = ada[x.tgl] || {})[x.lk] = true; });
    const ket = bersih_(d.ket, 100);
    const baru = [], tglBaru = {};
    for (let i = 0; i < nHari; i++) {
      const t = tambahHari_(mulai, i), a = ada[t] || {};
      if (a.Semua || a[lk]) continue;                 // sudah libur untuk semua / lingkup yang sama
      baru.push({ Tanggal: t, Keterangan: ket, Lingkup: lk });
      tglBaru[t] = true;
    }
    if (!baru.length) return gagal_("Semua tanggal itu sudah ada di daftar libur.");
    let tab = tabel_("LIBUR", true);
    // libur untuk semua menggantikan libur putra/putri pada tanggal yang sama
    if (lk === "Semua") {
      const c = tab.c, rows = [];
      for (let i = 1; i < tab.v.length; i++) if (tglBaru[fmtTgl_(tab.v[i][c.Tanggal])]) rows.push(i + 1);
      if (rows.length) { hapusBaris_(tab, rows); tab = tabel_("LIBUR", true); }
    }
    tambahBaris_(tab, baru, ["Tanggal", "Keterangan", "Lingkup"]);
    naikVersi_("k");
    catat_(ctx.s, "TAMBAH LIBUR", mulai + (akhir !== mulai ? " s/d " + akhir : "") + (lk !== "Semua" ? " (" + lk + ")" : ""));
    return { success: true, message: baru.length + " tanggal libur" + (lk !== "Semua" ? " " + lk.toLowerCase() : "") + " ditambahkan." };
  });
}

// lingkup kosong = hapus semua libur pada tanggal itu
function deleteLibur(token, tanggal, lingkup) {
  const ctx = otorisasi_(token, "admin");
  const lk = lingkup ? lingkupLibur_(lingkup) : "";
  return denganKunci_(() => {
    const t = tabel_("LIBUR", true), c = t.c;
    const rows = [];
    for (let i = 1; i < t.v.length; i++) {
      if (fmtTgl_(t.v[i][c.Tanggal]) !== tanggal) continue;
      if (lk && lingkupLibur_(t.v[i][c.Lingkup]) !== lk) continue;
      rows.push(i + 1);
    }
    if (!rows.length) return gagal_("Tanggal libur tidak ditemukan.");
    hapusBaris_(t, rows);
    naikVersi_("k");
    catat_(ctx.s, "HAPUS LIBUR", tanggal + (lk && lk !== "Semua" ? " (" + lk + ")" : ""));
    return { success: true, message: "Tanggal libur dihapus." };
  });
}

function backupAktif_() {
  try { return ScriptApp.getProjectTriggers().some(t => t.getHandlerFunction() === "backupHarian"); }
  catch (e) { return false; }
}

function backupSekarang_() {
  const file = DriveApp.getFileById(ss_().getId());
  const it = DriveApp.getFoldersByName("Backup Cyber-Monitor");
  const folder = it.hasNext() ? it.next() : DriveApp.createFolder("Backup Cyber-Monitor");
  const waktu = waktuKini_();
  const nama = ss_().getName() + " - Cadangan " + waktu;
  file.makeCopy(nama, folder);
  const daftar = [];
  const fi = folder.getFiles();
  while (fi.hasNext()) { const f = fi.next(); daftar.push({ f: f, t: f.getDateCreated().getTime() }); }
  daftar.sort((a, b) => b.t - a.t);
  daftar.slice(14).forEach(x => x.f.setTrashed(true));
  PropertiesService.getScriptProperties().setProperty("BACKUP_TERAKHIR", waktu);
  return nama;
}

// Dipanggil otomatis oleh pemicu harian. Panggilan dari browser diabaikan.
function backupHarian(e) {
  if (!e || !e.triggerUid) return;
  try { lupakan_(); sinkronSheet_(muatModel_(), false); } catch (err) { /* lanjut ke cadangan */ }
  backupSekarang_();
}

function backupSekarang(token) {
  const ctx = otorisasi_(token, "admin");
  const prop = PropertiesService.getScriptProperties();
  const terakhir = parseInt(prop.getProperty("BACKUP_MS") || "0", 10);
  if (Date.now() - terakhir < 300000) return gagal_("Cadangan baru saja dibuat. Tunggu 5 menit.");
  let nama;
  try { nama = backupSekarang_(); }
  catch (e) { return gagal_("Cadangan gagal. Pemilik aplikasi perlu menjalankan fungsi setujuiIzin dari editor Apps Script. (" + e.message + ")"); }
  prop.setProperty("BACKUP_MS", String(Date.now()));
  catat_(ctx.s, "BACKUP MANUAL", nama);
  return { success: true, message: "Cadangan dibuat di Google Drive: " + nama };
}

function aturBackupOtomatis(token, aktif) {
  const ctx = otorisasi_(token, "admin");
  try {
    ScriptApp.getProjectTriggers().forEach(t => { if (t.getHandlerFunction() === "backupHarian") ScriptApp.deleteTrigger(t); });
    if (aktif) ScriptApp.newTrigger("backupHarian").timeBased().everyDays(1).atHour(1).create();
  } catch (e) {
    return gagal_("Pemicu otomatis gagal diatur. Jalankan fungsi setujuiIzin dari editor Apps Script. (" + e.message + ")");
  }
  catat_(ctx.s, aktif ? "AKTIFKAN BACKUP HARIAN" : "NONAKTIFKAN BACKUP HARIAN", "");
  return { success: true, message: aktif ? "Backup harian aktif (sekitar pukul 01.00)." : "Backup harian dinonaktifkan." };
}

// ============================================================================
//  ARSIP DATA LAMA
//  Sheet Monitoring dan Kehadiran bertambah terus. Supaya aplikasi tetap ringan,
//  baris yang sudah lama dipindahkan ke sheet arsip. Rekor, level sekarang, dan
//  tanggal capai target tiap WBP disimpan dulu di sheet Ringkasan_Arsip, jadi
//  angka di aplikasi tetap benar walau riwayat lamanya tidak lagi dibaca.
// ============================================================================
function ringkasArsip_() {
  const ss = ss_();
  const info = { batas: "", monitoring: 0, kehadiran: 0 };
  const sh = ss.getSheetByName(NAMA.DASAR);
  if (sh && sh.getLastRow() > 1) {
    const t = tabel_("DASAR");
    for (let i = 1; i < t.v.length; i++) {
      const b = fmtTgl_(t.v[i][t.c.Batas_Arsip]);
      if (b && b > info.batas) info.batas = b;
    }
  }
  const a1 = ss.getSheetByName(NAMA.LOGARS), a2 = ss.getSheetByName(NAMA.ABSARS);
  info.monitoring = a1 ? Math.max(0, a1.getLastRow() - 1) : 0;
  info.kehadiran = a2 ? Math.max(0, a2.getLastRow() - 1) : 0;
  return info;
}

function arsipkanLama(token, batas) {
  const ctx = otorisasi_(token, "admin");
  const tgl = String(batas || "");
  if (!tglValid_(tgl)) return gagal_("Tanggal batas tidak valid.");
  const palingBaru = tambahHari_(hariIni_(), -365);
  if (tgl > palingBaru) return gagal_("Demi keamanan data, batas arsip paling dekat adalah " + tglIndo_(palingBaru) + " (satu tahun ke belakang).");
  return denganKunci_(() => {
    lupakan_();
    paksaSegar_(true);
    const M = muatModel_();
    const sebelum = tambahHari_(tgl, -1);

    // 1) Keadaan tiap WBP sampai sehari sebelum batas
    const Mb = {};
    Object.keys(M).forEach(k => { Mb[k] = M[k]; });
    Mb.hariIni = sebelum;
    const barisDasar = [];
    M.wbp.forEach(w => {
      delete w._a;
      const ab = analisis_(Mb, w);
      PROGRAM.forEach(p => {
        if (!w.ikut[p]) return;
        const ct = ab.capaiTgl ? ab.capaiTgl[p] : null;
        barisDasar.push({
          ID_WBP: w.id, Kategori: p,
          Rekor: LEVEL_MAP[p][ab.rekor[p]] || "", Sekarang: LEVEL_MAP[p][ab.sekarang[p]] || "",
          Tanggal_Capai: (ct && ct.tgl) || "", Capai_Asesmen: !!(ct && ct.asesmen),
          Log_Pertama: ab.logPertama || "", Log_Terakhir: ab.logTerakhir || "", Hadir_Terakhir: ab.hadirTerakhir || "",
          Batas_Arsip: tgl
        });
      });
      delete w._a;
    });

    // 2) Pindahkan baris lama ke sheet arsip
    const pindah = (kunci, kunciArsip, kolomTgl) => {
      const t = tabel_(kunci, true);
      const c = t.c, lebar = t.v[0].length;
      const simpan = [], buang = [];
      for (let i = 1; i < t.v.length; i++) {
        const r = t.v[i];
        const d = fmtTgl_(r[c[kolomTgl]]);
        if (d && d < tgl) buang.push(r.slice(0, lebar)); else simpan.push(r.slice(0, lebar));
      }
      if (!buang.length) return 0;
      let sa = ss_().getSheetByName(NAMA[kunciArsip]);
      if (!sa) {
        sa = ss_().insertSheet(NAMA[kunciArsip]);
        if (sa.getMaxColumns() < lebar) sa.insertColumnsAfter(sa.getMaxColumns(), lebar - sa.getMaxColumns());
        sa.getRange(1, 1, 1, lebar).setValues([t.v[0].slice(0, lebar)]);
        warnaiJudul_(sa.getRange(1, 1, 1, lebar));
        sa.setFrozenRows(1);
      }
      const mulai = Math.max(1, sa.getLastRow()) + 1;
      if (sa.getMaxRows() < mulai + buang.length) sa.insertRowsAfter(sa.getMaxRows(), mulai + buang.length - sa.getMaxRows());
      sa.getRange(mulai, 1, buang.length, lebar).setValues(buang);
      if (simpan.length) t.sh.getRange(2, 1, simpan.length, lebar).setValues(simpan);
      const sisa = t.sh.getLastRow() - 1 - simpan.length;
      if (sisa > 0) t.sh.deleteRows(2 + simpan.length, sisa);
      return buang.length;
    };
    const nLog = pindah("LOG", "LOGARS", "Tanggal_Input");
    const nAbs = pindah("ABS", "ABSARS", "Tanggal");

    // 3) Tulis dasar arsip (menggantikan isi lama)
    const td = tabel_("DASAR", true);
    const lebarD = SKEMA.DASAR.length;
    const isi = barisDasar.map(o => SKEMA.DASAR.map(k => (o[k] === undefined ? "" : o[k])));
    if (td.sh.getMaxRows() < isi.length + 1) td.sh.insertRowsAfter(td.sh.getMaxRows(), isi.length + 1 - td.sh.getMaxRows());
    if (isi.length) {
      const rg = td.sh.getRange(2, 1, isi.length, lebarD);
      rg.setNumberFormat("@");
      rg.setValues(isi);
    }
    const sisaD = td.sh.getLastRow() - 1 - isi.length;
    if (sisaD > 0) td.sh.deleteRows(2 + isi.length, sisaD);

    lupakan_();
    naikVersi_("nwa", true);
    catat_(ctx.s, "ARSIP DATA LAMA", "sebelum " + tgl + ": " + nLog + " penilaian, " + nAbs + " kehadiran");
    return {
      success: true, monitoring: nLog, kehadiran: nAbs,
      message: (nLog + nAbs) === 0
        ? "Tidak ada data sebelum " + tglIndo_(tgl) + " yang perlu dipindahkan."
        : nLog + " baris penilaian dan " + nAbs + " baris kehadiran dipindahkan ke sheet arsip."
    };
  });
}

// ============================================================================
//  CACHE CEPAT
//  1) Hasil hitungan disimpan per "jenis penampil" (admin, guru putra, guru putri, umum).
//  2) Bila hanya absensi/nilai yang berubah, daftar WBP boleh memakai salinan yang umurnya
//     paling lama 15 menit, sedangkan isian hari ini selalu dibaca segar. Jadi membuka
//     aplikasi tetap cepat walau guru lain baru saja menyimpan.
//  3) Pemicu tiap 10 menit menghitung ulang di belakang hanya bila ada data yang berubah,
//     sehingga pengguna hampir tidak pernah menunggu hitungan penuh.
// ============================================================================
const SALINAN_APP_MS = 15 * 60000;
const SALINAN_DASH_MS = 5 * 60000;

function kunciApp_(ctx, hariIni) { return "app6|" + versiData_() + "|" + ctx.sidik + "|" + hariIni; }
function kunciDash_(ctx, kode, hariIni) { return "dash6|" + versiData_() + "|" + ctx.sidik + "|" + kode + "|" + hariIni; }
// Bagian yang membuat salinan tidak boleh dipakai sama sekali: data WBP, pengaturan, pengguna
function capInti_() { const c = capVersi_(); return [c.w, c.wU, c.s, c.u, c.k, c.kU].join("|"); }   // k = hari libur

function bangunApp_(M, ctx) {
  const perBulan = rentang_("bulan_ini", M.hariIni);
  const berat = bersihkan_({
    wbps: M.wbp.filter(w => bolehWbp_(ctx.akses, w.jk)).map(w => ringkasWbp_(M, w, ctx, perBulan)),
    hari: isiHariModel_(M, ctx, M.hariIni)
  });
  cacheSimpan_(kunciApp_(ctx, M.hariIni), berat);
  cacheSimpan_("app6L|" + ctx.sidik, { t: Date.now(), tgl: M.hariIni, inti: capInti_(), wbps: berat.wbps });
  return berat;
}

function appDariSalinan_(ctx, hariIni) {
  const lama = cacheAmbil_("app6L|" + ctx.sidik);
  if (!lama || lama.tgl !== hariIni || lama.inti !== capInti_() || Date.now() - lama.t > SALINAN_APP_MS) return null;
  const peta = {};
  (lama.wbps || []).forEach(w => { peta[w.id] = w.jk || ""; });
  return { wbps: lama.wbps, hari: bersihkan_(isiHari_(ctx, hariIni, peta)) };
}

function simpanDash_(M, per, ctx) {
  const d = bersihkan_(bangunDashboard_(M, per, ctx));
  cacheSimpan_(kunciDash_(ctx, per.kode, M.hariIni), d);
  cacheSimpan_("dash6L|" + ctx.sidik + "|" + per.kode, { t: Date.now(), tgl: M.hariIni, inti: capInti_(), d: d });
  return d;
}
function dashDariSalinan_(ctx, kode, hariIni) {
  const lama = cacheAmbil_("dash6L|" + ctx.sidik + "|" + kode);
  if (!lama || lama.tgl !== hariIni || lama.inti !== capInti_() || Date.now() - lama.t > SALINAN_DASH_MS) return null;
  return lama.d;
}

// Dijalankan pemicu tiap 10 menit. Panggilan dari browser diabaikan.
function panaskanCache(e) {
  if (!e || !e.triggerUid) return;
  panaskan_();
}
function panaskan_() {
  const props = PropertiesService.getScriptProperties();
  lupakan_();
  const tanda = versiData_() + "|" + hariIni_();
  if (props.getProperty("PANAS_TANDA") === tanda) return false;      // tidak ada yang berubah
  const M = muatModel_();
  const sesi = [null].concat(readUsers_().filter(u => u.aktif && !u.wajibGanti)
    .map(u => ({ username: u.username, nama: u.nama, role: u.role, jk: u.jk, akses: u.akses, wajibGanti: false })));
  const sudah = {};
  const per = rentang_("bulan_ini", M.hariIni);
  sesi.forEach(s => {
    const ctx = konteksDari_(s);
    if (sudah[ctx.sidik]) return;
    sudah[ctx.sidik] = true;
    const p = ctx.perms;
    if (p.view_database || p.dash_hero || p.act_absensi || p.act_input_monitoring) bangunApp_(M, ctx);
    if (p.view_dashboard) simpanDash_(M, per, ctx);
  });
  props.setProperties({ PANAS_TANDA: tanda, PANAS_WAKTU: waktuKini_() });
  return true;
}

function pemanasAktif_() {
  try { return ScriptApp.getProjectTriggers().some(t => t.getHandlerFunction() === "panaskanCache"); }
  catch (e) { return false; }
}
function pasangPemanas_() {
  try {
    ScriptApp.getProjectTriggers().forEach(t => { if (t.getHandlerFunction() === "panaskanCache") ScriptApp.deleteTrigger(t); });
    ScriptApp.newTrigger("panaskanCache").timeBased().everyMinutes(10).create();
    return true;
  } catch (e) { return false; }
}

// ----- Hak akses per peran (guru & umum) -----
function savePermissions(token, perms) {
  const ctx = otorisasi_(token, "admin");
  perms = perms || {};
  const simpan = {};
  ["guru", "umum"].forEach(r => {
    const x = perms[r] || {};
    simpan[r] = {};
    FITUR.forEach(f => {
      let v = !!x[f.key];
      if (r === "umum" && (f.key.indexOf("act_") === 0 || f.key === "data_nama_lengkap")) v = false;
      simpan[r][f.key] = v;
    });
  });
  denganKunci_(() => {
    writeSetting_("hak_akses", JSON.stringify(simpan));
    writeSetting_("dashboard_publik", "1");      // tabel hak akses ini yang menentukan apa yang terlihat tanpa login
  });
  naikVersi_("s");
  catat_(ctx.s, "UBAH HAK AKSES", Object.keys(simpan.guru).filter(k => simpan.guru[k]).length + " fitur guru, " + Object.keys(simpan.umum).filter(k => simpan.umum[k]).length + " fitur umum");
  return { success: true, message: "Hak akses disimpan. Berlaku saat pengguna membuka ulang aplikasi." };
}


// ===================== PENGGANTI KHUSUS VERSI FIREBASE =====================
// (fungsi dengan nama sama di atas otomatis tertimpa oleh yang di bawah ini)
function getSession_(token) {
  const a = SHIM.akun();
  if (!token || !a) return null;
  const u = readUsers_().find(x => x.username.toLowerCase() === String(a.u).toLowerCase());
  if (!u || !u.aktif) return null;
  return { username: u.username, nama: u.nama, role: u.role, jk: u.jk, akses: u.akses, wajibGanti: u.wajibGanti };
}
function buatToken_(u) { return "fb:" + encodeURIComponent(u.username) + ":0:x"; }
function pemanasAktif_() { return false; }
function pasangPemanas_() { return false; }
function backupAktif_() { return PropertiesService.getScriptProperties().getProperty("CADANGAN_AUTO") === "1"; }
function backupSekarang(token) {
  const ctx = otorisasi_(token, "admin");
  SHIM.unduhCadangan();
  const waktu = waktuKini_();
  PropertiesService.getScriptProperties().setProperty("BACKUP_TERAKHIR", waktu);
  catat_(ctx.s, "BACKUP MANUAL", "unduh ke perangkat");
  return { success: true, message: "Cadangan diunduh ke perangkat ini (file .json). Simpan di tempat aman." };
}
function aturBackupOtomatis(token, aktif) {
  const ctx = otorisasi_(token, "admin");
  PropertiesService.getScriptProperties().setProperty("CADANGAN_AUTO", aktif ? "1" : "0");
  catat_(ctx.s, aktif ? "AKTIFKAN BACKUP HARIAN" : "NONAKTIFKAN BACKUP HARIAN", "");
  return { success: true, message: aktif ? "Cadangan harian aktif (dibuat otomatis saat admin membuka aplikasi tiap hari, disimpan 7 hari)." : "Cadangan harian dinonaktifkan." };
}
function catatKeluar_() {
  const a = SHIM.akun();
  if (a) catat_({ username: a.u, role: a.r }, "LOGOUT", "");
  return { success: true };
}
function sandiDiganti_(token) {
  const s = getSession_(token);
  if (!s) return gagal_("Sesi berakhir. Silakan login ulang.");
  return denganKunci_(() => {
    const t = tabel_("USER", true);
    const u = readUsers_().find(x => x.username === s.username);
    if (u) tulisBaris_(t, u.row, { Aktif: true, Wajib_Ganti: false }, []);
    naikVersi_("u");
    catat_(s, "GANTI SANDI", "");
    return { success: true, message: "Password berhasil diganti." };
  });
}
function terimaPendaftar_(daftar) {
  return denganKunci_(() => {
    const t = tabel_("USER", true);
    const ada = readUsers_();
    const baru = [];
    (daftar || []).forEach(d => {
      const un = String(d.username || "").trim();
      if (!/^[a-zA-Z0-9._-]{3,30}$/.test(un)) return;
      const sama = (x) => String(x).toLowerCase() === un.toLowerCase();
      if (ada.some(u => sama(u.username)) || baru.some(b => sama(b.Username))) return;
      const ub = userBaru_(un, bersih_(d.nama, 60) || un, "guru", Utilities.getUuid(), false, normJk_(d.jk));
      ub.Aktif = false;
      ub.Status = "menunggu";
      baru.push(ub);
      catat_({ username: un, role: "-" }, "DAFTAR AKUN", (d.nama || "") + " (" + (d.jk || "") + ")");
    });
    if (baru.length) { tambahBaris_(t, baru, ["Akses", "Status"]); naikVersi_("u"); }
    return { success: true, n: baru.length };
  });
}
function cadanganDicatat_() {
  PropertiesService.getScriptProperties().setProperty("BACKUP_TERAKHIR", waktuKini_());
  return { success: true };
}
return {
  API: API_FUNGSI,
  dalam: { catatKeluar_: catatKeluar_, sandiDiganti_: sandiDiganti_, terimaPendaftar_: terimaPendaftar_, cadanganDicatat_: cadanganDicatat_ }
};

}
