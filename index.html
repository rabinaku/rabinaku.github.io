  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <style>
    @layer theme, base, components, utilities;
    :root {
      color-scheme: dark;
      --bg: #0a0f1e; --bg-2: #0c1224; --sisi-bg: #0c1224;
      --surface: #111a2e; --surface-2: #17213a; --surface-3: #1f2b47;
      --line: #1f2a44; --line-2: #2c3a5c;
      --text: #eaf0fa; --text-2: #b8c3d9; --muted: #8d9ab3;
      --accent: #6ea8ff; --accent-hover: #93bfff; --accent-fill: #2563eb; --accent-fill-hover: #1d4ed8; --on-accent: #ffffff; --accent-edge: #3b82f6;
      --atas: 64px; --bawah: 64px; --sisi: 248px;
      --gold: #f1c75b; --gold-fill: #e3b341; --on-gold: #241800;
      --ok: #4ade80; --ok-bg: rgba(74, 222, 128, .13); --ok-fill: #22c55e; --on-ok: #03240f;
      --warn: #fbbf24; --warn-bg: rgba(251, 191, 36, .13); --warn-fill: #f5b21b; --on-warn: #2a1900;
      --info: #7dd3fc; --info-bg: rgba(125, 211, 252, .13); --info-fill: #ec835a; --on-info: #2a0f02;
      --bad: #fca5a5; --bad-bg: rgba(248, 113, 113, .15); --bad-fill: #ef4444; --on-bad: #ffffff;
      --violet: #c4b5fd; --violet-bg: rgba(167, 139, 250, .15);
      --focus: #fbbf24;
      --shadow: 0 16px 40px rgba(1, 4, 14, .55);
      --radius: 14px;
      /* warna grafik (urutan kategori tetap, sudah diuji buta warna pada permukaan kartu) */
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
      /* warna status (selalu disertai label) */
      --s-baik: #22c55e; --s-waspada: #fab219; --s-serius: #ec835a; --s-kritis: #e5484d;
      --grid: rgba(141, 154, 179, .14); --sumbu: #2c3a5c;
    }

    @layer base {
      html { background: var(--bg); }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      a { color: var(--accent); }
      ::selection { background: var(--accent-fill); color: var(--on-accent); }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 2px solid var(--bg); }
    }
    /* HP: tanpa bilah gulir (halaman tetap bisa digulir) */
    @media (max-width: 1023px), (pointer: coarse) {
      html, body, * { scrollbar-width: none; }
      ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    @layer components {
    /* ---- Ikon: SVG ditanam sebagai mask, warnanya ikut warna teks ---- */
    .fa-solid, .fa-regular {
      display: inline-block; width: calc(1em * var(--iw, 1)); height: 1em; vertical-align: -.125em;
      background-color: currentColor; flex: none;
      -webkit-mask: var(--ikon) no-repeat center / 100% 100%; mask: var(--ikon) no-repeat center / 100% 100%;
    }
    .fa-spin { animation: ikon-putar 1.6s linear infinite; }
    @keyframes ikon-putar { to { transform: rotate(360deg); } }
    .num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .muted { color: var(--muted); }
    .t2 { color: var(--text-2); }
    .t-accent { color: var(--accent); }
    .t-gold { color: var(--gold); }
    .t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-bad { color: var(--bad); } .t-info { color: var(--info); } .t-violet { color: var(--violet); }
    .garis { border-color: var(--line); }
    .h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
    .h2 { font-size: 17px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
    .h3 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
    .kecil { font-size: 13px; }
    .mini { font-size: 12px; }

    /* ===================== Komponen ===================== */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .card-pad { padding: 18px; }
    .panel-2 { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      min-height: 38px; padding: .45rem .9rem; border-radius: 10px; cursor: pointer;
      font: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.2; white-space: nowrap;
      background: var(--surface-2); color: var(--text); border: 1px solid var(--line-2);
      transition: background .15s, border-color .15s, color .15s;
    }
    .btn:hover { border-color: var(--accent-edge); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: var(--on-accent); border-color: transparent; box-shadow: 0 6px 16px rgba(37, 99, 235, .28); }
    .btn-primary:hover { background: linear-gradient(135deg, #2f74ea, #1d4ed8); border-color: transparent; }
    .btn-gold { background: var(--gold-fill); color: var(--on-gold); border-color: transparent; }
    .btn-danger { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
    .btn-danger:hover { border-color: var(--bad); }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
    .btn-ghost:hover { background: var(--surface-2); border-color: var(--line); }
    .btn-sm { min-height: 32px; padding: .28rem .65rem; font-size: 12.5px; border-radius: 8px; }
    .btn-ikon { min-height: 36px; width: 36px; padding: 0; }
    .btn-sm.btn-ikon { min-height: 32px; width: 32px; }
    .btn-besar { min-height: 46px; font-size: 15px; }

    .inp {
      width: 100%; min-height: 40px; padding: .45rem .75rem; border-radius: 10px;
      background: var(--surface-2); color: var(--text); border: 1px solid var(--line-2);
      font: inherit; font-size: 14px;
    }
    .inp:focus { outline: none; border-color: var(--accent-edge); box-shadow: 0 0 0 3px rgba(59, 130, 246, .22); }
    .inp::placeholder { color: var(--muted); opacity: .9; }
    select.inp option { background: var(--surface); color: var(--text); }
    input[type="date"].inp, input[type="month"].inp { color-scheme: dark; }
    .inp-sm { min-height: 32px; padding: .25rem .55rem; font-size: 12.5px; border-radius: 8px; }
    .inp.berubah { border-color: var(--accent-edge); background: color-mix(in srgb, var(--accent-fill) 10%, var(--surface-2)); }
    .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: .35rem; }
    .bantu { font-size: 12.5px; color: var(--muted); margin-top: .3rem; }
    input[type="checkbox"], input[type="radio"] { accent-color: var(--accent-edge); width: 18px; height: 18px; cursor: pointer; vertical-align: middle; }

    .badge {
      display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .55rem; border-radius: 7px;
      font-size: 11.5px; font-weight: 600; line-height: 1.6; white-space: nowrap; border: 1px solid transparent;
    }
    .b-ok { background: var(--ok-bg); color: var(--ok); }
    .b-warn { background: var(--warn-bg); color: var(--warn); }
    .b-bad { background: var(--bad-bg); color: var(--bad); }
    .b-info { background: var(--info-bg); color: var(--info); }
    .b-violet { background: var(--violet-bg); color: var(--violet); }
    .b-serius { background: rgba(236, 131, 90, .15); color: #f6a985; }
    .b-muted { background: var(--surface-3); color: var(--text-2); }
    .b-gold { background: rgba(241, 199, 91, .15); color: var(--gold); }
    .b-garis { background: transparent; border-color: var(--line-2); color: var(--text-2); }

    .seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
    .seg button { font: inherit; font-size: 12.5px; font-weight: 600; padding: .32rem .75rem; border-radius: 7px; color: var(--text-2); background: transparent; border: 0; cursor: pointer; min-height: 30px; }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: var(--accent-fill); color: var(--on-accent); }

    .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .tbl th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: .6rem .7rem; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
    .tbl td { padding: .6rem .7rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
    .tbl .kanan { text-align: right; }

    .av.av-foto { padding: 0; overflow: hidden; background: var(--surface-3); }
    .av.av-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .daftar-ajak { margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; font-size: 13.5px; color: var(--text-2); }
    .av {
      --s: 40px; width: var(--s); height: var(--s); border-radius: 50%; flex-shrink: 0; overflow: hidden;
      display: inline-grid; place-items: center; background: var(--surface-3); color: #dbe5f7;
      font-weight: 600; font-size: calc(var(--s) * .36); letter-spacing: .02em; border: 1px solid var(--line-2);
    }
    .av.p { background: linear-gradient(135deg, #8a2f5a, #5b2b7a); }
    .av.l { background: linear-gradient(135deg, #1f4fa8, #2b3f86); }

    .kosong-isi { padding: 28px; text-align: center; color: var(--muted); }
    #barMuat { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, #3b82f6, #8b5cf6); z-index: 100; transition: width .3s; }
    #barMuat.jalan { width: 70%; transition: width 8s cubic-bezier(.1, .7, .2, 1); }
    #barMuat.selesai { width: 100%; opacity: 0; transition: width .2s, opacity .4s .2s; }

    /* Toast & dialog */
    .toast { background: var(--surface-2); color: var(--text); border: 1px solid var(--line-2); border-left: 4px solid var(--accent-edge); border-radius: 10px; padding: .7rem .9rem; box-shadow: var(--shadow); font-size: 13.5px; display: flex; gap: .6rem; align-items: flex-start; }
    .toast.ok { border-left-color: var(--ok-fill); } .toast.bad { border-left-color: var(--bad-fill); } .toast.warn { border-left-color: var(--warn-fill); }
    #toastRuang { position: fixed; z-index: 120; right: 14px; top: calc(var(--atas) + 10px); display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 28px)); }
    .lapis { position: fixed; inset: 0; z-index: 110; background: rgba(2, 5, 15, .72); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px 12px; overflow-y: auto; }
    .dialog { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow); }
    .dialog-h { padding: 16px 18px 6px; font-size: 17px; font-weight: 700; }
    .dialog-b { padding: 8px 18px 6px; }
    .dialog-f { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 16px 16px; border-top: 1px solid var(--line); margin-top: 8px; }
    .galat-inline { color: var(--bad); font-size: 13.5px; margin-top: 8px; min-height: 1em; }

    /* Daftar hasil pencarian */
    .cari-daftar { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 60; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); max-height: 360px; overflow-y: auto; padding: 4px; }
    .cari-item .badge { flex-shrink: 0; }
    #dcHasil, .cari-daftar { grid-template-columns: minmax(0, 1fr); }
    .cari-item { min-width: 0; display: flex; gap: .6rem; align-items: center; padding: .5rem .6rem; cursor: pointer; border-radius: 8px; width: 100%; text-align: left; background: transparent; border: 0; color: inherit; font: inherit; }
    .cari-item:hover, .cari-item.aktif { background: var(--surface-2); }
    .cari-besar .inp { min-height: 50px; font-size: 16px; padding-left: 2.8rem; border-radius: 12px; }
    .cari-besar > i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; pointer-events: none; z-index: 1; }

    /* Pilihan berbentuk chip (materi, hari) */
    .logo-prat { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line-2); overflow: hidden; font-size: 20px; flex-shrink: 0; }
    .logo-prat img { width: 100%; height: 100%; object-fit: contain; }
    .akses-tbl td, .akses-tbl th { padding: .55rem .9rem; }
    .akses-tbl .akses-grup td { background: var(--surface-2); font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .saring-bar { display: flex; gap: 8px; align-items: center; }
    .saring-lebar { flex-wrap: wrap; }
    .pil-wadah { position: relative; }
    .pil { display: inline-flex; align-items: center; gap: .45rem; height: 40px; padding: 0 .8rem; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .pil:hover { border-color: var(--accent-edge); color: var(--text); }
    .pil.on { background: rgba(37, 99, 235, .16); border-color: var(--accent-edge); color: var(--text); }
    .pil > i:first-child { color: var(--muted); font-size: 13px; }
    .pil.on > i:first-child { color: var(--accent); }
    .pil-panah { font-size: 9px; color: var(--muted); }
    .pil-menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); }
    .pil-opsi { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: .5rem .65rem; border-radius: 8px; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13.5px; cursor: pointer; text-align: left; }
    .pil-opsi:hover { background: var(--surface-2); color: var(--text); }
    .pil-opsi.on { color: var(--text); font-weight: 600; }
    .pil-opsi i { color: var(--accent); font-size: 12px; }
    .pil-pisah { height: 1px; background: var(--line); margin: 6px 0; }
    .saring-ikon { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .saring-on { border-color: var(--accent-edge); background: rgba(37, 99, 235, .14); }
    .saring-chip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .saring-chip:empty { display: none; }
    .chip-saring { display: inline-flex; align-items: center; gap: 6px; padding: .22rem .65rem; border-radius: 999px; background: rgba(37, 99, 235, .15); color: var(--text); border: 1px solid rgba(59, 130, 246, .4); font: inherit; font-size: 12.5px; cursor: pointer; }
    .chip-saring i { font-size: 10px; color: var(--text-2); }
    .chip-saring:hover { border-color: var(--accent-edge); }
    .chip-saring.hapus-semua { background: transparent; border-color: var(--line-2); color: var(--text-2); }
    .chip-pilih { display: inline-flex; align-items: center; gap: .45rem; min-height: 36px; padding: .3rem .8rem; border-radius: 9px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line-2); user-select: none; }
    .chip-pilih:hover { border-color: var(--text-2); }
    .chip-pilih.on { background: rgba(37, 99, 235, .18); color: var(--text); border-color: var(--accent-edge); }
    .chip-pilih.on i { color: var(--accent); }
    .chip-pilih:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
    .chip-pilih .cek { display: none; }
    .chip-pilih.on .cek { display: inline-block; }

    /* Isian penilaian */
    .nil-tanda { font-size: 12px; font-weight: 600; margin-top: .3rem; line-height: 1.45; }
    .nilai-materi { border: 1px solid var(--line-2); border-radius: 12px; padding: .8rem; background: var(--surface-2); }
    .nilai-materi + .nilai-materi { margin-top: .6rem; }
    .catatan-lalu { border-top: 1px dashed var(--line-2); padding-top: .6rem; display: grid; gap: .45rem; }
    .catatan-item { padding-left: .6rem; border-left: 2px solid var(--line-2); }
    .kilat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; margin-top: .6rem; }
    .kilat .btn { white-space: normal; line-height: 1.2; text-align: center; padding-block: .5rem; }

    /* Rekap: kalender kelengkapan */
    .kal { border-collapse: separate; border-spacing: 3px; }
    .kal th { font-size: 11px; color: var(--muted); font-weight: 500; padding: 2px; text-align: center; min-width: 26px; }
    .kal td { padding: 0; }
    .sel { width: 26px; height: 30px; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
    .sel span { flex: 1; }
    .sel .lengkap { background: var(--s-baik); } .sel .sebagian { background: var(--s-waspada); } .sel .kosong { background: var(--s-kritis); }
    .sel.libur { background: repeating-linear-gradient(135deg, var(--surface-3), var(--surface-3) 4px, var(--surface-2) 4px, var(--surface-2) 8px); }
    .sel.nanti { background: transparent; border-style: dashed; }
    .lg-kotak { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -1px; }

    /* ===================== Kerangka: sidebar + bar atas tetap ===================== */
    .sisi {
      position: fixed; top: 0; bottom: 0; left: 0; width: var(--sisi); z-index: 55; display: none; flex-direction: column;
      background: var(--sisi-bg); border-right: 1px solid var(--line); transition: width .18s ease;
    }
    @media (min-width: 1024px) { .sisi { display: flex; } }
    .sisi-kepala { height: var(--atas); display: flex; align-items: center; gap: 10px; padding: 0 14px 0 18px; flex-shrink: 0; }
    .sisi-logo { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; background: linear-gradient(135deg, #3b82f6, #7c3aed); color: #fff; font-size: 16px; overflow: hidden; }
    .sisi-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .sisi-merek { min-width: 0; flex: 1; }
    /* nama instansi boleh dua baris supaya tidak terpotong */
    .sisi-merek b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 13px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .nama-hp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
    .sub-hp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 11px; line-height: 1.2; margin-top: 1px; overflow-wrap: anywhere; }
    .sisi-merek span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 11px; line-height: 1.25; margin-top: 2px; color: var(--muted); overflow-wrap: anywhere; }
    .sisi-ciut { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; flex-shrink: 0; display: grid; place-items: center; }
    .sisi-ciut:hover { background: var(--surface-2); color: var(--text); }
    .sisi-menu { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
    .sm-grup { position: relative; }
    .sm-btn {
      width: 100%; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 0;
      background: transparent; color: var(--text-2); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-align: left; position: relative;
    }
    .sm-btn > i:first-child { font-size: 17px; width: 20px; color: var(--muted); }
    .sm-btn:hover { background: var(--surface-2); color: var(--text); }
    .sm-btn:hover > i:first-child { color: var(--text); }
    .sm-btn.on { background: linear-gradient(90deg, #2563eb, #1d4ed8); color: #fff; box-shadow: 0 8px 20px rgba(37, 99, 235, .3); }
    .sm-btn.on > i:first-child { color: #fff; }
    .sm-btn.induk-on { color: var(--text); }
    .sm-btn.induk-on > i:first-child { color: var(--accent); }
    .sm-teks { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sm-badge { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 6px; font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; background: rgba(124, 58, 237, .28); color: #ddd6fe; }
    .sm-btn.on .sm-badge { background: rgba(255, 255, 255, .22); color: #fff; }
    .sm-panah { font-size: 10px; color: var(--muted); transition: transform .15s; }
    .sm-grup.buka .sm-panah { transform: rotate(180deg); }
    .sm-sub { display: none; padding: 3px 0 4px 32px; }
    .sm-grup.buka .sm-sub { display: block; }
    .sm-subbtn {
      width: 100%; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 0;
      background: transparent; color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left; position: relative;
    }
    .sm-subbtn::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex-shrink: 0; }
    .sm-subbtn:hover { color: var(--text); background: var(--surface-2); }
    .sm-subbtn.on { color: var(--text); background: rgba(37, 99, 235, .14); }
    .sm-subbtn.on::before { background: var(--accent-edge); box-shadow: 0 0 0 3px rgba(59, 130, 246, .25); }
    .sm-sub-judul { display: none; }
    .sisi-bawah { padding: 12px; display: grid; gap: 10px; }
    .sisi-status { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--text-2); }
    .sisi-status i { color: var(--ok); }

    /* Sidebar diciutkan: ikon saja, nama muncul sebagai gelembung, submenu melayang */
    body.ciut { --sisi: 78px; }
    body.ciut .sisi-merek, body.ciut .sm-teks, body.ciut .sm-panah, body.ciut .sisi-status span { display: none; }
    body.ciut .sisi-kepala { padding: 0 10px; justify-content: center; flex-direction: column; gap: 4px; height: auto; min-height: var(--atas); padding-top: 10px; }
    body.ciut .sisi-ciut i { transform: rotate(180deg); }
    body.ciut .sisi-menu { overflow: visible; }
    body.ciut .sm-btn { justify-content: center; padding: 0; }
    body.ciut .sm-badge { position: absolute; top: 3px; right: 4px; min-width: 18px; height: 16px; font-size: 10px; padding: 0 4px; }
    body.ciut .sm-sub { display: none; position: absolute; left: calc(100% + 10px); top: 0; min-width: 220px; z-index: 70; padding: 6px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow); }
    body.ciut .sm-sub::before { content: ""; position: absolute; left: -12px; top: 0; bottom: 0; width: 12px; }
    body.ciut .sm-grup.melayang .sm-sub { display: block; }
    @media (hover: hover) { body.ciut .sm-grup:hover .sm-sub { display: block; } }
    body.ciut .sm-sub-judul { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: .35rem .7rem .3rem; }
    body.ciut .sisi-status { justify-content: center; }

    /* Bar atas */
    .atas {
      position: fixed; top: 0; right: 0; left: 0; z-index: 50; height: var(--atas);
      background: color-mix(in srgb, var(--bg) 96%, transparent);
      border-bottom: 1px solid var(--line); transition: left .18s ease;
    }
    @media (min-width: 1024px) { .atas { left: var(--sisi); } }
    .atas-isi { height: 100%; padding: 0 12px; display: flex; align-items: center; gap: 10px; }
    @media (min-width: 768px) { .atas-isi { padding: 0 24px; } }
    .atas-merek { display: flex; align-items: center; gap: 10px; min-width: 0; }
    @media (min-width: 1024px) { .atas-merek { display: none; } }
    .cari-global { position: relative; width: 100%; max-width: 360px; display: none; }
    @media (min-width: 768px) { .cari-global { display: block; } }
    .cari-global .inp { padding-left: 2.4rem; padding-right: 3.6rem; min-height: 40px; background: var(--surface); border-color: var(--line-2); }
    .cari-global > i { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .cari-global kbd { position: absolute; right: .55rem; top: 50%; transform: translateY(-50%); font: 600 11px Inter, system-ui, sans-serif; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 6px; pointer-events: none; }
    .chip-tgl { display: inline-flex; align-items: center; gap: .55rem; height: 40px; padding: 0 .9rem; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-2); font-size: 13px; color: var(--text-2); white-space: nowrap; }
    .ikon-atas { position: relative; width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--text-2); cursor: pointer; font-size: 18px; display: grid; place-items: center; flex-shrink: 0; }
    .ikon-atas:hover { background: var(--surface-2); color: var(--text); }
    .angka-titik { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; color: #fff; background: #dc2626; border: 2px solid var(--bg); }
    .angka-titik.ungu { background: #7c3aed; }
    .akun-atas { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 4px 6px 4px 4px; border-radius: 12px; text-align: left; }
    .akun-atas:hover { background: var(--surface-2); }
    .akun-atas b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
    .akun-atas small { display: block; font-size: 11.5px; color: var(--muted); }
    .akun-titik { position: relative; }
    .akun-titik::after { content: ""; position: absolute; right: 0; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--s-baik); border: 2px solid var(--bg); }
    .lonceng-panel { position: absolute; right: 0; top: calc(100% + 8px); width: 360px; z-index: 70; background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; }
    @media (max-width: 767px) { .lonceng-panel { position: fixed; left: 10px; right: 10px; top: calc(var(--atas) + 6px); width: auto; } }

    .wadah { padding: calc(var(--atas) + 20px) 14px 48px; transition: margin-left .18s ease; }
    @media (min-width: 768px) { .wadah { padding: calc(var(--atas) + 26px) 26px 56px; } }
    @media (min-width: 1024px) { .wadah { margin-left: var(--sisi); } }
    @media (max-width: 1023px) { .wadah { padding-bottom: calc(var(--bawah) + 40px + env(safe-area-inset-bottom)); } }
    .wadah > section, .wadah > #kaki, .wadah > #memuatAwal { max-width: 1480px; margin-left: auto; margin-right: auto; }

    /* Gelembung nama menu */
    .tip {
      position: fixed; z-index: 130; pointer-events: none; padding: .32rem .6rem; border-radius: 8px;
      background: #f1f5fb; color: #0a0f1e; font-size: 12.5px; font-weight: 600; white-space: nowrap;
      box-shadow: var(--shadow); opacity: 0; transform: translateY(2px); transition: opacity .12s, transform .12s;
    }
    .tip.tampil { opacity: 1; transform: none; }
    .sub-judul { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: .35rem .6rem .25rem; }
    .sub-btn {
      width: 100%; display: flex; align-items: center; gap: .65rem; padding: .6rem .7rem; border-radius: 10px; border: 0;
      background: transparent; color: var(--text-2); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-align: left;
    }
    .sub-btn i { width: 18px; color: var(--muted); }
    .sub-btn:hover { background: var(--surface-2); color: var(--text); }
    .sub-btn.on { background: rgba(37, 99, 235, .16); color: var(--text); }
    .sub-btn.on i { color: var(--accent); }

    /* Menu bawah (HP): ikon + nama, yang aktif menyala */
    .menu-item { position: relative; flex: 1 1 0; display: flex; min-width: 0; }
    .menu-btn { width: 100%; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; border: 0; cursor: pointer;
      background: transparent; color: var(--text-2); position: relative; transition: color .2s, transform .12s; -webkit-user-select: none; user-select: none; }
    .menu-ikon { width: 46px; height: 28px; border-radius: 999px; display: grid; place-items: center; font-size: 18px; transition: background .25s, box-shadow .25s, color .2s, transform .25s; }
    .menu-label { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1; }
    .menu-btn:active { transform: scale(.92); }
    .menu-btn:active .menu-ikon { background: rgba(59, 130, 246, .18); }
    .menu-btn.on { color: #fff; }
    .menu-btn.on .menu-ikon { color: #fff; background: linear-gradient(135deg, #3b82f6, #6d28d9);
      box-shadow: 0 0 0 1px rgba(147, 191, 255, .35) inset, 0 4px 14px rgba(59, 130, 246, .55), 0 0 22px rgba(99, 102, 241, .45); animation: menuNyala .35s cubic-bezier(.3, 1.6, .5, 1); }
    .menu-btn.on .menu-ikon i { filter: drop-shadow(0 0 6px rgba(255, 255, 255, .7)); }
    .menu-btn.on .menu-label { color: #c7dbff; text-shadow: 0 0 10px rgba(110, 168, 255, .8); }
    .menu-btn.on::before { content: ""; position: absolute; top: -7px; left: 50%; width: 28px; height: 3px; margin-left: -14px; border-radius: 0 0 4px 4px;
      background: #93bfff; box-shadow: 0 0 10px 2px rgba(110, 168, 255, .85), 0 0 24px 6px rgba(59, 130, 246, .4); }
    @keyframes menuNyala { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
    .menu-btn .sm-badge { position: absolute; top: 0; right: calc(50% - 26px); min-width: 18px; height: 16px; font-size: 10px; padding: 0 4px; box-shadow: 0 0 10px rgba(239, 68, 68, .6); }
    .bawah {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; gap: 2px;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #111a30, #080d1c);
      border-top: 1px solid rgba(110, 168, 255, .18); box-shadow: 0 -10px 30px -12px rgba(37, 99, 235, .45);
    }
    .bawah::before { content: ""; position: absolute; left: 8%; right: 8%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(147, 191, 255, .7), transparent); }
    .lembar {
      position: fixed; left: 10px; right: 10px; bottom: calc(var(--bawah) + 10px + env(safe-area-inset-bottom)); z-index: 70;
      background: var(--surface); border: 1px solid var(--line-2); border-radius: 18px; box-shadow: var(--shadow); padding: 8px;
      animation: lembarMasuk .14s ease-out;
    }
    @keyframes lembarMasuk { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .lembar .sub-btn { padding: .85rem .8rem; font-size: 15px; }
    .lembar-tirai { position: fixed; inset: 0; z-index: 65; background: rgba(2, 5, 15, .4); }

    /* Status kirim data */
    .status-kirim { display: inline-flex; align-items: center; gap: .4rem; font-size: 12px; font-weight: 600; padding: .3rem .6rem; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
    .status-kirim.aman { color: var(--ok); background: var(--ok-bg); }
    /* HP sempit: status simpan cukup ikon, supaya nama instansi tetap terlihat */
    @media (max-width: 480px) { .status-kirim { font-size: 0; gap: 0; padding: .45rem; } .status-kirim i { font-size: 14px; } }
    .status-kirim.kirim { color: var(--info); background: var(--info-bg); }
    .status-kirim.tunda { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 45%, transparent); cursor: pointer; }

    /* Judul halaman */
    .kepala-hal { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .remah { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }

    /* Pemilih tanggal kerja */
    .tgl-nav { display: inline-flex; align-items: stretch; gap: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; }
    .tgl-nav button { width: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; font-size: 14px; }
    .tgl-nav button:hover:not(:disabled) { background: var(--surface-3); color: var(--text); }
    .tgl-nav button:disabled { opacity: .35; cursor: default; }
    .tgl-nav label { position: relative; display: flex; align-items: center; gap: .5rem; padding: 0 .6rem; font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
    .tgl-nav input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

    /* Baris WBP (absensi & penilaian) */
    .daftar { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
    .baris > .min-w-0 { min-width: 0; }
    .baris { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .baris.selesai { border-color: color-mix(in srgb, var(--ok-fill) 38%, var(--line)); }
    .baris.klik { cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
    .baris.klik:hover { border-color: var(--line-2); background: var(--surface-2); }
    .baris .nm { font-weight: 600; font-size: 14.5px; line-height: 1.25; }
    .ab-grup { display: flex; gap: 4px; flex-shrink: 0; }
    .ab { width: 42px; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text-2); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }

    /* Kartu kompetensi WBP */
    .hero {

      --t1: #c98a54; --t2: #f0b37e;
      position: relative; overflow: hidden; color: var(--h-text); border-radius: 18px;
      background:
        radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--t1) 28%, transparent) 0%, transparent 55%),
        radial-gradient(90% 80% at 100% 100%, rgba(59, 130, 246, .16) 0%, transparent 60%),

      width: 70px; height: 80px; display: grid; place-items: center; text-align: center;

    }

    .h-bar i.isi { background: linear-gradient(180deg, var(--t2), var(--t1)); }

    .h-bar i.target::after { content: ""; position: absolute; right: -2px; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: #fff; }
    /* ===== Kartu WBP gaya "status window" ===== */

const STATUS_ABSEN = ["Hadir", "Izin", "Sakit", "Alpa"];
const KELAS_ABSEN = { Hadir: "b-ok", Izin: "b-warn", Sakit: "b-serius", Alpa: "b-bad" };

function simpanLokal(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* penyimpanan diblokir */ } }
function ambilLokal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
// Token login disimpan di perangkat (tahan ditutup / HP dimatikan). Bila diblokir, jatuh ke sessionStorage.
function simpanSesi(k, v) {
  try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); return; } catch (e) { /* coba cadangan */ }
  try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch (e2) { /* abaikan */ }
}
function ambilSesi(k) {
  try { const v = localStorage.getItem(k); if (v) return v; } catch (e) { /* coba cadangan */ }
  try { return sessionStorage.getItem(k) || ""; } catch (e2) { return ""; }
}

const S = {
  token: ambilSesi("cm_token"), sesi: null, role: "umum", perms: {}, akses: "semua", set: {}, levels: {},
  tidakIkut: "- (Tidak Ikut)", hariIni: "", dataTgl: "", libur: [], meta: {},
  wbps: [], wbpMap: {}, dash: null, periode: ambilLokal("cm_periode") || "bulan_ini",
  view: "", sub: "", dimuat: null,
  tgl: "",                 // tanggal kerja (absensi & penilaian)
  hariData: {}             // tgl -> { abs: {id: [status, ket, oleh]}, nil: {id: {materi: [level, jenis, catatan, idLog]}}, libur }
};

// ---------- Pembantu umum ----------
function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function bisa(k) { return !!S.perms[k]; }
function angka(n) { return (n === null || n === undefined) ? "—" : Number(n).toLocaleString("id-ID"); }
function debounce(fn, ms) { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; }
function normCari(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

// ---------- Tanggal (teks yyyy-MM-dd) ----------
function tglMs(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
function msTgl(ms) { return new Date(ms).toISOString().slice(0, 10); }
function tambahHari(s, n) { return msTgl(tglMs(s) + n * 86400000); }
function hariKe(s) { return (new Date(tglMs(s)).getUTCDay() + 6) % 7; }
function namaHari(s) { return HARI[hariKe(s)]; }
function tglPanjang(s) { return s ? namaHari(s) + ", " + (+s.slice(8, 10)) + " " + BULAN[+s.slice(5, 7) - 1] + " " + s.slice(0, 4) : "—"; }
function tglPendek(s) {
  if (!s) return "—";
  const thn = S.hariIni && s.slice(0, 4) === S.hariIni.slice(0, 4) ? "" : " " + s.slice(0, 4);
  return (+s.slice(8, 10)) + " " + BULAN_PDK[+s.slice(5, 7) - 1] + thn;
}
function relatif(s) {
  if (!s || !S.hariIni) return "belum pernah";
  const d = Math.round((tglMs(S.hariIni) - tglMs(s)) / 86400000);
  if (d <= 0) return "hari ini";
  if (d === 1) return "kemarin";
  if (d < 7) return d + " hari lalu";
  if (d < 60) return Math.floor(d / 7) + " minggu lalu";
  return tglPendek(s);
}
function labelBulan(b) { return BULAN[+b.slice(5, 7) - 1] + " " + b.slice(0, 4); }

// ---------- Level & jadwal ----------
function levelNyata(p) { return (S.levels[p] || []).filter(v => v !== S.tidakIkut); }
function idxLevel(p, v) { return (S.levels[p] || []).indexOf(v); }
function ikutMateri(w, p) { const i = PROGRAM.indexOf(p); return !!(w && w.aw && w.aw[i] && w.aw[i] !== S.tidakIkut); }
// Terjadwal = hari jadwalnya cocok, tidak sedang libur khusus jenis kelaminnya, dan tidak diliburkan lewat
// jadwal pengganti; kelompok yang dipanggil lewat jadwal pengganti ikut terjadwal
function terjadwal(w, tgl) {
  if (!w || w.ar) return false;
  const hr = w.hr || [], g = gantiPada(tgl, w.jk);
  if (g && hr.indexOf(g.panggil) !== -1) return true;
  if (hr.indexOf(namaHari(tgl)) === -1 || liburKhusus(tgl, w.jk)) return false;
  return !(g && g.libur);
}
// Jadwalnya hari itu tetapi sedang libur (libur khusus putra/putri atau diliburkan lewat jadwal pengganti)
function liburJadwal(w, tgl) { return !!(w && !w.ar && (w.hr || []).indexOf(namaHari(tgl)) !== -1 && !terjadwal(w, tgl)); }
function gantiPada(tgl, jk) { return (S.ganti || []).find(x => x.tgl === tgl && x.jk === jk) || null; }
// Alasan WBP terjadwal itu tidak belajar hari ini (untuk judul kelompok di daftar)
function alasanLibur(w, tgl) {
  const k = liburKhusus(tgl, w.jk), g = gantiPada(tgl, w.jk), jk = w.jk === "P" ? "Putri" : "Putra";
  if (k) return jk + " libur" + (k !== "Libur" ? ": " + k : "");
  if (g) return "Kelompok " + namaHari(tgl) + " " + jk.toLowerCase() + " diliburkan, diganti kelompok " + g.panggil;
  return jk + " libur";
}
// Libur untuk semua WBP
function liburPada(tgl) { const d = S.hariData[tgl]; if (d && d.libur) return d.libur; const x = (S.libur || []).find(l => l.tgl === tgl && (!l.lk || l.lk === "Semua")); return x ? (x.ket || "Libur") : ""; }
// Libur khusus pada tanggal ini: { L: "ket", P: "ket" }
function liburJkPada(tgl) {
  const d = S.hariData[tgl];
  if (d && d.lj) return d.lj;
  const o = {};
  (S.libur || []).forEach(l => { if (l.tgl !== tgl) return; if (l.lk === "Putra") o.L = l.ket || "Libur"; else if (l.lk === "Putri") o.P = l.ket || "Libur"; });
  return o;
}
function liburKhusus(tgl, jk) { return (jk === "L" || jk === "P") ? (liburJkPada(tgl)[jk] || "") : ""; }
// "Putra libur (Kegiatan blok atas)" — teks pendek untuk keterangan
function teksLiburJk(lj) {
  lj = lj || {};
  return [lj.L ? "Putra libur" + (lj.L !== "Libur" ? " (" + lj.L + ")" : "") : "", lj.P ? "Putri libur" + (lj.P !== "Libur" ? " (" + lj.P + ")" : "") : ""].filter(Boolean).join(" · ");
}
// Kotak pemberitahuan libur (umum atau khusus) untuk halaman absensi/penilaian
function htmlInfoLibur(tgl, teksUmum) {
  const libur = liburPada(tgl), lj = teksLiburJk(liburJkPada(tgl));
  if (libur) return '<div class="p-3 rounded-xl kecil mb-3" style="background:var(--warn-bg)"><i class="fa-solid fa-umbrella-beach t-warn mr-1"></i>Hari libur: <b>' + esc(libur) + "</b>." + (teksUmum ? " " + teksUmum : "") + "</div>";
  const gt = ["L", "P"].map(jk => { const g = gantiPada(tgl, jk); return g ? "Jadwal pengganti " + (jk === "P" ? "putri" : "putra") + ": kelompok <b>" + esc(g.panggil) + "</b> dipanggil" + (g.libur ? ", kelompok " + esc(namaHari(tgl)) + " libur" : "") : ""; })
    .filter((x, i) => x && (S.akses === "semua" || i === 0));
  const isi = (lj ? "<b>" + esc(lj) + "</b>. WBP tersebut tidak dihitung terjadwal hari ini; yang lain tetap seperti biasa." : "") + (gt.length ? (lj ? "<br>" : "") + gt.join("<br>") + "." : "");
  if (isi) return '<div class="p-3 rounded-xl kecil mb-3" style="background:var(--info-bg)"><i class="fa-solid fa-right-left t-accent mr-1"></i>' + isi + "</div>";
  return "";
}

// ---------- Server ----------
// Alamat Web App (Deploy -> Manage deployments). Dipakai bila halaman dibuka dari GitHub Pages.
const ALAMAT_API = "https://script.google.com/macros/s/AKfycbwkRupA-Z8DvPcs6z7DkR2MaJotye9F-SSN22XGtGeRm7YQNfXrMsTqOmtnP3CPswE/exec";
// Panggilan lewat internet biasa (fetch): dicoba ulang sekali bila jaringan putus sesaat
async function apiFetch(fn, args) {
  let galat = null;
  for (let coba = 0; coba < 2; coba++) {
    try {
      const res = await fetch(ALAMAT_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args }), redirect: "follow", cache: "no-store" });
      if (!res.ok) throw new Error("Server tidak menjawab (" + res.status + ").");
      const j = await res.json();
      if (!j.ok) { const e = new Error(j.e || "Terjadi kesalahan di server."); e.dariServer = true; throw e; }
      return j.r;
    } catch (e) {
      if (e.dariServer) throw e;
      galat = e;
      if (coba === 0) await new Promise(r => setTimeout(r, 800));
    }
  }
  throw new Error(navigator.onLine === false ? "Tidak ada koneksi internet." : "Gagal menghubungi server. " + pesanGalat(galat));
}
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  // v10: data di Firebase. Hanya bila dibuka dari editor Apps Script lama, server lama yang dipakai.
  if (!(window.google && google.script && google.script.run)) return fbApi(fn, args);
  return new Promise((resolve, reject) => {
    const r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    if (typeof r[fn] !== "function") {
      reject(new Error("Fungsi server \"" + fn + "\" tidak ditemukan di Code.gs yang sedang berjalan. Biasanya karena Code.gs belum diganti seluruhnya, masih ada file .gs lama, atau belum Deploy versi baru."));
      return;
    }
    r[fn].apply(r, args);
  });
}
function pesanGalat(e) { return String((e && e.message) ? e.message : (e || "Terjadi kesalahan.")).replace(/^(Error|ScriptError|Exception):\s*/, ""); }

async function tanganiGalat(e) {
  selesaiMuat(true);
  kunciLayar(false);
  const m = pesanGalat(e);
  if (m.indexOf("SESI_HABIS") !== -1) {
    S.token = "";
    simpanSesi("cm_token", "");
    hapusCache();
    toast("Sesi login berakhir. Silakan masuk lagi.", "warn");
    dialogMasuk();
    return;
  }
  if (/mengganti sandi/.test(m)) { dialogGantiSandi(true); return; }
  let isi = esc(m);
  if (/Authorization|izin|permission/i.test(m) && /drive|Drive|ScriptApp|authoriz/i.test(m)) {
    isi += '<p class="mt-3 kecil muted">Pemilik aplikasi perlu membuka editor Apps Script, memilih fungsi <b>setujuiIzin</b>, lalu klik Run dan menyetujui izin.</p>';
  }
  await infoDialog("Terjadi kesalahan", isi, "bad");
}

// ---------- Indikator memuat ----------
let _muatN = 0;
function mulaiMuat() {
  _muatN++;
  const b = el("barMuat");
  b.className = "";
  void b.offsetWidth;
  b.className = "jalan";
}
function selesaiMuat(paksa) {
  _muatN = paksa ? 0 : Math.max(0, _muatN - 1);
  if (_muatN === 0) {
    const b = el("barMuat");
    b.className = "selesai";
    setTimeout(() => { if (_muatN === 0) b.className = ""; }, 700);
  }
}
let _kunciEl = null;
function kunciLayar(on, teks) {
  if (on) {
    if (!_kunciEl) {
      _kunciEl = document.createElement("div");
      _kunciEl.className = "lapis";
      _kunciEl.style.alignItems = "center";
      _kunciEl.style.background = "rgba(3,9,24,.35)";
      el("dialogRuang").appendChild(_kunciEl);
    }
    _kunciEl.innerHTML = '<div class="card card-pad flex items-center gap-3"><i class="fa-solid fa-circle-notch fa-spin t-accent"></i><span class="font-semibold">' + esc(teks || "Menyimpan…") + "</span></div>";
  } else if (_kunciEl) { _kunciEl.remove(); _kunciEl = null; }
}

// Aksi admin yang perlu ditunggu hasilnya (pengaturan, data WBP)
async function aksi(fn, args, opsi) {
  opsi = opsi || {};
  kunciLayar(true, opsi.teks || "Menyimpan…");
  mulaiMuat();
  try {
    const r = await api.apply(null, [fn].concat(args || []));
    kunciLayar(false);
    selesaiMuat();
    if (r && r.success === false) {
      await infoDialog("Belum berhasil", esc(r.message || "Aksi gagal."), "warn");
      return r;
    }
    S.tulisTerakhir = Date.now();
    if (!opsi.diam) toast((r && r.message) || "Berhasil disimpan.", "ok");
    if (opsi.sesudah) await opsi.sesudah(r);
    return r;
  } catch (e) {
    kunciLayar(false);
    selesaiMuat();
    await tanganiGalat(e);
    return null;
  }
}
// Simpan dari dalam dialog: galat ditampilkan di dialog, dialog tetap terbuka
async function simpanDariDialog(root, fn, args) {
  const tombol = root.querySelectorAll(".dialog-f button");
  tombol.forEach(b => { b.disabled = true; });
  mulaiMuat();
  try {
    const r = await api.apply(null, [fn].concat(args));
    if (r && r.success === false) throw new Error(r.message || "Gagal menyimpan.");
    return r || { success: true };
  } catch (e) {
    const m = pesanGalat(e);
    if (m.indexOf("SESI_HABIS") !== -1) throw new Error("Sesi login berakhir. Tutup jendela ini, masuk lagi, lalu ulangi.");
    throw e;
  } finally {
    selesaiMuat();
    tombol.forEach(b => { b.disabled = false; });
  }
}

// =====================================================================
//  SIMPAN OTOMATIS (absensi & nilai)
//  Begitu guru menekan, layar langsung berubah. Pengiriman ke server berjalan
//  di belakang; beberapa ketukan berturut-turut digabung jadi satu kiriman.
//  Bila sinyal putus, antrean disimpan di HP dan dikirim saat sinyal kembali.
//  Aman diulang: server menimpa baris WBP + tanggal (+ materi) yang sama.
// =====================================================================
const KIRIM = { antre: [], sedang: false, timer: 0, gagal: 0, okSampai: 0, okTerakhir: 0 };
const NAMA_KIRIM = { simpanAbsensi: "absensi", simpanMonitoring: "penilaian" };

function kirimMuat() {
  try { const a = JSON.parse(ambilLokal("cm_kirim") || "[]"); KIRIM.antre = Array.isArray(a) ? a : []; } catch (e) { KIRIM.antre = []; }
  KIRIM.antre.forEach(x => { x.jalan = false; });
}
function kirimSimpan() { simpanLokal("cm_kirim", KIRIM.antre.length ? JSON.stringify(KIRIM.antre) : null); }
function penggunaKini() { return (S.sesi && S.sesi.username) || ""; }
function antreku() { const u = penggunaKini(); return KIRIM.antre.filter(x => x.user === u); }

// data absensi: { s, k }   data nilai: { n: {materi: level|"#hapus"}, c }
function kirimTambah(fn, tgl, id, data, jenis) {
  const u = penggunaKini();
  let it = KIRIM.antre.find(x => !x.jalan && x.fn === fn && x.tgl === tgl && (x.jenis || "") === (jenis || "") && x.user === u);
  if (!it) { it = { k: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), fn: fn, tgl: tgl, jenis: jenis || "", user: u, items: {} }; KIRIM.antre.push(it); }
  if (fn === "simpanMonitoring") {
    const lama = it.items[id] || { n: {} };
    it.items[id] = { n: Object.assign({}, lama.n, data.n || {}), c: data.c !== undefined ? data.c : lama.c };
  } else it.items[id] = data;
  kirimSimpan();
  tampilStatusKirim();
  renderMenu();
  clearTimeout(KIRIM.timer);
  KIRIM.timer = setTimeout(kirimJalan, 700);
}
// Apakah ada kiriman yang masih menunggu untuk WBP ini pada tanggal ini
function menunggu(fn, tgl, id) { return KIRIM.antre.some(x => x.fn === fn && x.tgl === tgl && x.items[id]); }

async function kirimJalan() {
  clearTimeout(KIRIM.timer);
  if (KIRIM.sedang || !S.token) return;
  const it = antreku().find(x => !x.jalan);
  if (!it) { tampilStatusKirim(); return; }
  KIRIM.sedang = true;
  it.jalan = true;
  tampilStatusKirim();
  const items = Object.keys(it.items).map(id => Object.assign({ id: id }, it.items[id]));
  const data = it.fn === "simpanMonitoring" ? { tanggal: it.tgl, jenis: it.jenis || "Rutin", items: items } : { tanggal: it.tgl, items: items };
  let lanjut = true;
  try {
    const r = await api(it.fn, S.token, data);
    KIRIM.antre = KIRIM.antre.filter(x => x !== it);
    KIRIM.gagal = 0;
    KIRIM.okSampai = Date.now() + 2500;
    KIRIM.okTerakhir = Date.now();
    if (it.fn === "simpanMonitoring" && S.view === "monitoring" && el("riw-nilaiTabel")) setTimeout(() => muatRiwayat("nilai", true), 300);
    if (it.fn === "simpanAbsensi" && S.view === "absensi" && el("riw-absenTabel")) setTimeout(() => muatRiwayat("absen", true), 300);
    if (r && r.success === false) { toast("Sebagian " + NAMA_KIRIM[it.fn] + " ditolak server: " + (r.message || ""), "warn"); muatHari(it.tgl, true); }
    else if (r && /dilewati/.test(r.message || "")) toast(r.message, "warn");
  } catch (e) {
    it.jalan = false;
    const m = pesanGalat(e);
    if (m.indexOf("SESI_HABIS") !== -1) {
      lanjut = false;
      S.token = ""; simpanSesi("cm_token", "");
      toast("Sesi login berakhir. Masuk lagi; isian yang belum terkirim tetap aman di HP ini.", "warn");
      dialogMasuk({ tetap: true });
    } else if (/Akses ditolak|tidak valid|masa depan/.test(m)) {
      KIRIM.antre = KIRIM.antre.filter(x => x !== it);              // ditolak permanen: jangan diulang terus
      toast("Tidak tersimpan: " + m, "bad");
      muatHari(it.tgl, true);
    } else {
      KIRIM.gagal++;
      lanjut = false;
      const jeda = [4, 10, 20, 40, 60][Math.min(4, KIRIM.gagal - 1)] * 1000;
      KIRIM.timer = setTimeout(kirimJalan, jeda);
    }
  } finally {
    KIRIM.sedang = false;
    kirimSimpan();
    tampilStatusKirim();
    segarkanBarisTampil();
  }
  if (lanjut && antreku().length) kirimJalan();
}

function tampilStatusKirim() {
  const b = el("statusKirim");
  if (!b) return;
  const a = antreku();
  const n = a.reduce((t, x) => t + Object.keys(x.items).length, 0);
  let kelas = "", isi = "";
  if (n && KIRIM.gagal) { kelas = "tunda"; isi = '<i class="fa-solid fa-cloud-arrow-up"></i>' + n + " menunggu sinyal"; }
  else if (n) { kelas = "kirim"; isi = '<i class="fa-solid fa-circle-notch fa-spin"></i>Menyimpan'; }
  else if (Date.now() < KIRIM.okSampai) { kelas = "aman"; isi = '<i class="fa-solid fa-check"></i>Tersimpan'; setTimeout(tampilStatusKirim, KIRIM.okSampai - Date.now() + 50); }
  b.className = "status-kirim " + (kelas || "hidden");
  b.innerHTML = isi;
  const ss = el("sisiStatus");
  if (ss) ss.innerHTML = n && KIRIM.gagal ? '<i class="fa-solid fa-cloud-arrow-up" style="color:var(--warn)"></i><span>' + n + " isian menunggu sinyal</span>"
    : n ? '<i class="fa-solid fa-circle-notch fa-spin" style="color:var(--accent)"></i><span>Menyimpan ' + n + " isian…</span>"
    : '<i class="fa-solid fa-circle-check"></i><span>Semua data tersimpan</span>';
  if (S.sesi) perbaruiLonceng();
  b.onclick = kelas === "tunda" ? () => infoDialog("Belum terkirim",
    "<b>" + n + "</b> isian absensi/nilai tersimpan di HP ini dan akan dikirim otomatis begitu sinyal kembali. Jangan keluar dari akun atau menghapus data browser sebelum tulisan ini hilang." +
    '<p class="mt-3"><button class="btn btn-primary" onclick="KIRIM.gagal=0;kirimJalan()"><i class="fa-solid fa-paper-plane"></i>Coba kirim sekarang</button></p>', "warn") : null;
}
// Setelah data dari server tiba, isian yang belum terkirim ditimpakan lagi supaya layar tidak "mundur"
function terapkanAntre(tgl) {
  const d = S.hariData[tgl];
  if (!d) return;
  KIRIM.antre.forEach(x => {
    if (x.tgl !== tgl || x.user !== penggunaKini()) return;
    Object.keys(x.items).forEach(id => {
      const v = x.items[id];
      if (x.fn === "simpanAbsensi") {
        if (v.s) d.abs[id] = [v.s, v.k || "", penggunaKini()]; else delete d.abs[id];
      } else {
        const o = d.nil[id] = d.nil[id] || {};
        Object.keys(v.n || {}).forEach(p => { if (v.n[p] === "#hapus") delete o[p]; else o[p] = [v.n[p], x.jenis || "Rutin", v.c || (o[p] ? o[p][2] : ""), o[p] ? o[p][3] : ""]; });
        if (!Object.keys(o).length) delete d.nil[id];
      }
    });
  });
}
let segarkanBarisTampil = function () { /* diganti halaman yang sedang tampil */ };
window.addEventListener("online", () => { KIRIM.gagal = 0; kirimJalan(); });
window.addEventListener("beforeunload", ev => { if (antreku().length) { ev.preventDefault(); ev.returnValue = ""; } });

// ---------- Data per tanggal ----------
async function muatHari(tgl, paksa) {
  if (!paksa && S.hariData[tgl]) return S.hariData[tgl];
  const mulai = Date.now();
  const d = await api("getHari", S.token, tgl);
  // ada kiriman yang selesai saat permintaan ini berjalan: data ini mungkin sudah usang
  if (S.hariData[tgl] && KIRIM.okTerakhir > mulai) return S.hariData[tgl];
  S.hariData[tgl] = d;
  terapkanAntre(tgl);
  if (tgl === S.hariIni) renderMenu();
  return d;
}

// ---------- Toast & dialog ----------
function toast(pesan, jenis) {
  jenis = jenis || "ok";
  const t = document.createElement("div");
  t.className = "toast " + jenis;
  const ikon = { ok: "fa-circle-check t-ok", bad: "fa-circle-xmark t-bad", warn: "fa-triangle-exclamation t-warn", info: "fa-circle-info t-accent" }[jenis];
  t.innerHTML = '<i class="fa-solid ' + ikon + ' mt-1"></i><div>' + esc(pesan) + "</div>";
  el("toastRuang").appendChild(t);
  setTimeout(() => {
    t.style.transition = "opacity .3s";
    t.style.opacity = "0";
    setTimeout(() => t.remove(), 320);
  }, jenis === "ok" || jenis === "info" ? 3000 : 6500);
}

// o: { judul, isi, tombol:[{teks, nilai, kelas, utama, ringkas}] (ringkas = nama tombol; di HP tampil ikon saja), lebar, kunci, saatBuka(root), ambil(root, nilaiTombol), tanpaFokus }
function dialog(o) {
  return new Promise(resolve => {
    const tombol = o.tombol || [{ teks: "Tutup", nilai: null, kelas: "btn-primary" }];
    const lapis = document.createElement("div");
    lapis.className = "lapis";
    lapis.innerHTML =
      '<div class="dialog' + (o.kelas ? " " + o.kelas : "") + '" role="dialog" aria-modal="true" style="max-width:' + (o.lebar || 520) + 'px">' +
      (o.judul ? '<div class="dialog-h">' + o.judul + "</div>" : "") +
      '<div class="dialog-b">' + (o.isi || "") + '<div class="galat-inline" data-galat></div></div>' +
      (tombol.length ? '<div class="dialog-f">' + tombol.map((b, i) => '<button type="button" class="btn ' + (b.kelas || "") + (b.ringkas ? " btn-ringkas" : "") + '" data-i="' + i + '"' +
        (b.ringkas ? ' title="' + esc(b.ringkas) + '" aria-label="' + esc(b.ringkas) + '"' : "") + ">" + b.teks + "</button>").join("") + "</div>" : "") + "</div>";
    let selesai = false;
    const penutup = () => { if (o.kunci) return false; tutup(null); return true; };
    const tutup = (v) => {
      if (selesai) return;
      selesai = true;
      document.removeEventListener("keydown", onKey, true);
      lapis.remove();
      navLepas(penutup);
      resolve(v);
    };
    const klik = async (i) => {
      const b = tombol[i];
      if (b.nilai === null || b.nilai === undefined) { tutup(null); return; }
      if (!o.ambil) { tutup(b.nilai); return; }
      const g = lapis.querySelector("[data-galat]");
      g.textContent = "";
      try {
        const v = await o.ambil(lapis, b.nilai);
        if (v === undefined || v === false) return;
        tutup(v);
      } catch (e) { g.textContent = pesanGalat(e); }
    };
    const onKey = (ev) => {
      if (!document.body.contains(lapis) || el("dialogRuang").lastElementChild !== lapis) return;
      if (ev.key === "Escape" && !o.kunci) { ev.preventDefault(); tutup(null); }
      if (ev.key === "Enter" && ev.target && ev.target.tagName !== "TEXTAREA" && ev.target.tagName !== "BUTTON") {
        const u = tombol.findIndex(b => b.utama);
        if (u >= 0) { ev.preventDefault(); klik(u); }
      }
    };
    lapis.querySelectorAll(".dialog-f button").forEach(btn => { btn.onclick = () => klik(+btn.dataset.i); });
    lapis.addEventListener("mousedown", ev => { if (ev.target === lapis && !o.kunci) tutup(null); });
    lapis._tutup = tutup;
    document.addEventListener("keydown", onKey, true);
    el("dialogRuang").appendChild(lapis);
    navDorong("dlg", penutup);
    if (o.saatBuka) o.saatBuka(lapis);
    const f = lapis.querySelector(".dialog-b input:not([type=hidden]):not([type=checkbox]):not([type=date]), .dialog-b select, .dialog-b textarea") || lapis.querySelector(".dialog-f .btn-primary");
    if (f && !o.tanpaFokus) setTimeout(() => { if (!lapis.contains(document.activeElement) || document.activeElement === lapis) f.focus(); }, 30);
  });
}

// Gelembung nama menu
const TIP = { t: 0, tekan: 0, lama: false };
function tampilTip(btn, posisi) {
  const t = el("tip");
  t.textContent = btn.dataset.label || "";
  t.classList.add("tampil");
  const r = btn.getBoundingClientRect();
  const w = t.offsetWidth, h = t.offsetHeight;
  if (posisi === "kanan") { t.style.left = (r.right + 10) + "px"; t.style.top = (r.top + r.height / 2 - h / 2) + "px"; return; }
  const x = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
  t.style.left = x + "px";
  t.style.top = (posisi === "atas" ? r.top - h - 8 : r.bottom + 8) + "px";
}
function sembunyiTip() { clearTimeout(TIP.t); el("tip").classList.remove("tampil"); }
function tutupSubmenu() { document.querySelectorAll(".sm-grup.melayang").forEach(x => x.classList.remove("melayang")); }

let _lembarTutup = null;
function bukaLembar(m) {
  if (_lembarTutup) _lembarTutup();
  const tirai = document.createElement("div");
  tirai.className = "lembar-tirai";
  const lembar = document.createElement("div");
  lembar.className = "lembar";
  lembar.setAttribute("role", "menu");
  lembar.innerHTML = '<div class="sub-judul">' + esc(m.label) + "</div>" + m.sub.map(s =>
    '<button type="button" role="menuitem" class="sub-btn' + (S.view === m.id && S.sub === s.id ? " on" : "") + '" data-ke="' + m.id + "/" + s.id + '"><i class="fa-solid ' + s.ikon + '"></i>' + esc(s.label) + "</button>").join("");
  const tutup = () => { tirai.remove(); lembar.remove(); _lembarTutup = null; navLepas(penutup); };
  const penutup = () => { tirai.remove(); lembar.remove(); _lembarTutup = null; return true; };
  _lembarTutup = tutup;
  tirai.onclick = tutup;
  lembar.onclick = (ev) => { const b = ev.target.closest("[data-ke]"); if (!b) return; tutup(); const k = b.dataset.ke.split("/"); buka(k[0], k[1]); };
  document.body.appendChild(tirai);
  document.body.appendChild(lembar);
  navDorong("dlg", penutup);
}

function aturCiut(ciut) {
  document.body.classList.toggle("ciut", ciut);
  simpanLokal("cm_ciut", ciut ? "1" : "0");
  el("btnCiut").setAttribute("aria-label", ciut ? "Lebarkan menu" : "Ciutkan menu");
  el("btnCiut").dataset.label = ciut ? "Lebarkan menu" : "Ciutkan menu";

}

function pasangMenu() {
  aturCiut(ambilLokal("cm_ciut") === "1");
  el("btnCiut").onclick = () => aturCiut(!document.body.classList.contains("ciut"));
  // ---------- Sidebar ----------
  const sisi = el("sisi");
  sisi.addEventListener("click", (ev) => {
    const ke = ev.target.closest("[data-ke]");
    if (ke) { tutupSubmenu(); sembunyiTip(); const k = ke.dataset.ke.split("/"); buka(k[0], k[1]); return; }
    const btn = ev.target.closest("[data-buka]");
    if (!btn) return;
    const m = menuBoleh().find(x => x.id === btn.dataset.buka);
    if (!m) return;
    if (m.sub && m.sub.length > 1) {
      const grup = btn.parentElement;
      if (document.body.classList.contains("ciut")) {           // ikon saja: submenu melayang
        const sudah = grup.classList.contains("melayang");
        tutupSubmenu();
        if (!sudah) grup.classList.add("melayang");
        return;
      }
      SISI.buka[m.id] = !grup.classList.contains("buka");       // lebar: buka/tutup di tempat
      grup.classList.toggle("buka", SISI.buka[m.id]);
      btn.setAttribute("aria-expanded", SISI.buka[m.id]);
      return;
    }
    buka(m.id, m.sub && m.sub.length ? m.sub[0].id : "");
  });
  sisi.addEventListener("mouseover", (ev) => {
    const btn = ev.target.closest("[data-buka], #btnCiut");
    if (!btn || !document.body.classList.contains("ciut") || (ev.relatedTarget && btn.contains(ev.relatedTarget))) return;
    if (btn.parentElement.querySelector(".sm-sub")) return;      // nama sudah tampil di kepala submenu
    clearTimeout(TIP.t);
    TIP.t = setTimeout(() => tampilTip(btn, "kanan"), 250);
  });
  sisi.addEventListener("mouseout", (ev) => { const btn = ev.target.closest("[data-buka], #btnCiut"); if (btn && !btn.contains(ev.relatedTarget)) sembunyiTip(); });

  // ---------- Menu bawah (HP) ----------
  const w = el("menuBawah");
  w.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-buka]");
    if (!btn) return;
    if (TIP.lama) { TIP.lama = false; return; }               // tekan lama hanya menampilkan nama
    sembunyiTip();
    const m = menuBoleh().find(x => x.id === btn.dataset.buka);
    if (!m) return;
    if (m.sub && m.sub.length > 1) { bukaLembar(m); return; }
    buka(m.id, m.sub && m.sub.length ? m.sub[0].id : "");
  });
  w.addEventListener("touchstart", (ev) => {
    const btn = ev.target.closest("[data-buka]");
    if (!btn) return;
    TIP.lama = false;
    clearTimeout(TIP.tekan);
    TIP.tekan = setTimeout(() => { TIP.lama = true; tampilTip(btn, "atas"); if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { /* abaikan */ } } }, 450);
  }, { passive: true });
  const lepas = () => { clearTimeout(TIP.tekan); if (TIP.lama) setTimeout(sembunyiTip, 900); };
  w.addEventListener("touchend", lepas);
  w.addEventListener("touchcancel", lepas);
  w.addEventListener("touchmove", () => clearTimeout(TIP.tekan), { passive: true });
  w.addEventListener("contextmenu", (ev) => { if (ev.target.closest("[data-buka]")) ev.preventDefault(); });
  // nama menu sudah tampil di bawah ikon, jadi tidak perlu tooltip saat disorot

  document.addEventListener("click", (ev) => {
    if (!ev.target.closest(".sm-grup")) tutupSubmenu();
    if (!ev.target.closest("#cariGlobal")) el("cariHasil").classList.add("hidden");
    if (!ev.target.closest("#btnLonceng, #panelLonceng")) el("panelLonceng").classList.add("hidden");
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { tutupSubmenu(); el("cariHasil").classList.add("hidden"); el("panelLonceng").classList.add("hidden"); }
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === "k" || ev.key === "K") && S.wbps && S.wbps.length) {
      ev.preventDefault();
      if (window.innerWidth >= 768) el("cariWbp").focus(); else dialogCariWbp();
    }
  });
  window.addEventListener("scroll", sembunyiTip, { passive: true });
  pasangCariGlobal();
  el("btnCari").onclick = dialogCariWbp;
  el("btnLonceng").onclick = () => { const p = el("panelLonceng"); if (p.classList.contains("hidden")) { gambarLonceng(); p.classList.remove("hidden"); } else p.classList.add("hidden"); };
}

// ---------- Pencarian WBP (bar atas) ----------
function hasilCari(q) {
  const n = normCari(q);
  if (!n) return [];
  return (S.wbps || []).filter(w => normCari(w.nm).indexOf(n) !== -1 || normCari(w.bl).indexOf(n) !== -1 || normCari(w.id).indexOf(n) !== -1)
    .sort((a, b) => (a.ar - b.ar) || a.nm.localeCompare(b.nm)).slice(0, 12);
}
function htmlHasilCari(daftar, q) {
  if (!q) return "";
  if (!daftar.length) return '<div class="kosong-isi kecil">Tidak ada WBP yang cocok.</div>';
  return daftar.map((w, i) => '<button type="button" class="cari-item' + (i === 0 ? " aktif" : "") + '" data-wbp="' + esc(w.id) + '">' + avatar(w, 32) +
    '<div class="min-w-0 flex-1"><div class="font-semibold truncate">' + esc(w.nm) + '</div><div class="mini muted truncate">' +
    esc([w.bl ? "Blok " + w.bl : "", (w.hr || []).join(", ") || "belum ada jadwal", w.ar ? "diarsipkan" : ""].filter(Boolean).join(" · ")) + "</div></div>" +

}
function pasangCariGlobal() {
  const inp = el("cariWbp"), hasil = el("cariHasil");
  const gambar = () => {
    const q = inp.value.trim();
    hasil.innerHTML = htmlHasilCari(hasilCari(q), q);
    hasil.classList.toggle("hidden", !q);
  };
  inp.addEventListener("input", debounce(gambar, 80));
  inp.addEventListener("focus", gambar);
  inp.addEventListener("keydown", (ev) => {
    const item = Array.from(hasil.querySelectorAll(".cari-item"));
    const i = item.findIndex(x => x.classList.contains("aktif"));
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (!item.length) return;
      const j = ev.key === "ArrowDown" ? Math.min(item.length - 1, i + 1) : Math.max(0, i - 1);
      item.forEach((x, k) => x.classList.toggle("aktif", k === j));
      item[j].scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter" && i >= 0) { ev.preventDefault(); item[i].click(); }
  });
  hasil.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-wbp]");
    if (!b) return;
    hasil.classList.add("hidden");
    inp.value = "";
    inp.blur();
    dialogKartuWbp(b.dataset.wbp);
  });

// ---------- Lonceng: TUGAS HARI INI untuk akun yang sedang masuk ----------
// Isinya hanya hal yang bisa langsung dikerjakan: absensi/penilaian hari ini yang belum diisi,
// isian yang belum terkirim, WBP yang tidak hadir berturut-turut, dan (admin) data WBP yang belum lengkap.
function daftarLonceng() {
  const out = [];
  const n = antreku().reduce((t, x) => t + Object.keys(x.items).length, 0);
  if (n) out.push({ ikon: "fa-cloud-arrow-up", warna: "#c98500", judul: "Belum terkirim ke server", ket: "Isian tersimpan di perangkat ini. Ketuk untuk mengirim sekarang.", n: n, aksi: () => { KIRIM.gagal = 0; kirimJalan(); toast("Mencoba mengirim…", "info"); } });
  const libur = liburPada(S.hariIni);
  const d = S.hariData[S.hariIni];
  if (d && !libur) {
    const jadwal = (S.wbps || []).filter(w => terjadwal(w, S.hariIni));
    if (bisa("act_absensi")) {
      const sisa = jadwal.filter(w => !d.abs[w.id]).length;
      if (sisa) out.push({ ikon: "fa-clipboard-user", warna: "#2563eb", judul: "Absensi hari ini belum lengkap", ket: sisa + " dari " + jadwal.length + " WBP terjadwal " + namaHari(S.hariIni) + " belum diabsen.", n: sisa, aksi: () => { S.tgl = S.hariIni; buka("absensi", "isi"); } });
    }
    if (bisa("act_input_monitoring")) {
      const sisa = jadwal.filter(w => !d.nil[w.id] && !(d.abs[w.id] && d.abs[w.id][0] !== "Hadir")).length;
      if (sisa) out.push({ ikon: "fa-seedling", warna: "#7c3aed", judul: "Penilaian hari ini belum lengkap", ket: sisa + " WBP yang hadir/terjadwal belum dinilai hari ini.", n: sisa, aksi: () => { S.tgl = S.hariIni; buka("monitoring", "isi"); } });
    }
  }
  const p = S.dash && S.dash.perhatian;
  if (p && p.absenBeruntun.length) out.push({ ikon: "fa-user-xmark", warna: "#dc2626", judul: "Tidak hadir berturut-turut", ket: p.absenBeruntun.length + " WBP tidak hadir 3 sesi atau lebih berturut-turut. Perlu ditanyakan.", n: p.absenBeruntun.length, aksi: () => { buka("dashboard"); setTimeout(dialogPerhatian, 300); } });
  if (S.role === "admin" && S.menunggu) out.push({ ikon: "fa-user-clock", warna: "#7c3aed", judul: "Pendaftaran akun menunggu", ket: S.menunggu + " orang mendaftar dan menunggu persetujuan Anda.", n: S.menunggu, aksi: () => buka("pengaturan", "pengguna") });
  if (S.role === "admin") {
    const aktif = (S.wbps || []).filter(w => !w.ar);
    const kurang = aktif.filter(w => !(w.hr || []).length || !w.jk).length;
    if (kurang) out.push({ ikon: "fa-address-book", warna: "#0f766e", judul: "Data WBP belum lengkap", ket: kurang + " WBP belum punya jadwal belajar atau jenis kelamin, sehingga tidak muncul di absensi / papan juara.", n: kurang, aksi: () => { DB.kurang = true; buka("database"); } });
  }
  return out;
}
function perbaruiLonceng() {
  const b = el("btnLonceng");
  if (!S.sesi) { b.classList.add("hidden"); return; }

// ---------- Tombol Kembali (HP) ----------
// Riwayat browser: [akar] [app] [halaman?] [dialog...]. Kembali menutup dialog,
// lalu kembali ke halaman awal, lalu meminta konfirmasi sebelum benar-benar keluar.
const NAVH = { aktif: false, tumpuk: [], antre: [], sibuk: false, tunggu: null, abaikan: 0, siapKeluar: false, timer: 0 };
function navJalan() {
  if (NAVH.sibuk) return;
  const f = NAVH.antre.shift();
  if (!f) return;
  NAVH.sibuk = true;
  f(() => { NAVH.sibuk = false; navJalan(); });
}
function navDorong(jenis, penutup) {
  if (!NAVH.aktif) return;
  NAVH.tumpuk.push({ j: jenis, t: penutup || null, mati: false });
  NAVH.antre.push((selesai) => { try { history.pushState({ cm: jenis }, ""); } catch (e) { /* abaikan */ } selesai(); });
  navJalan();
}
function navLepas(penutup, jenis) {
  if (!NAVH.aktif) return;
  let i = -1;
  for (let k = NAVH.tumpuk.length - 1; k >= 0; k--) {
    const e = NAVH.tumpuk[k];
    if (!e.mati && (penutup ? e.t === penutup : e.j === jenis)) { i = k; break; }
  }
  if (i < 0) return;
  if (i !== NAVH.tumpuk.length - 1) { NAVH.tumpuk[i].mati = true; NAVH.tumpuk[i].t = null; return; }
  NAVH.tumpuk.pop();
  let n = 1;
  while (NAVH.tumpuk.length && NAVH.tumpuk[NAVH.tumpuk.length - 1].mati) { NAVH.tumpuk.pop(); n++; }
  navMundur(n);
}
function navMundur(n) {
  NAVH.antre.push((selesai) => {
    NAVH.abaikan++;
    NAVH.tunggu = selesai;
    setTimeout(() => { if (NAVH.tunggu === selesai) { NAVH.tunggu = null; if (NAVH.abaikan > 0) NAVH.abaikan--; selesai(); } }, 600);
    try { history.go(-n); } catch (e) { NAVH.abaikan--; NAVH.tunggu = null; selesai(); }
  });
  navJalan();
}
function navView(id) {
  if (!NAVH.aktif) return;
  const rumah = !id || id === "kosong" || id === viewPertama();
  const ada = NAVH.tumpuk.some(e => e.j === "view" && !e.mati);
  if (rumah) { if (ada) navLepas(null, "view"); }
  else if (!ada) navDorong("view");
}
function navPop() {
  if (NAVH.abaikan > 0) {
    NAVH.abaikan--;
    const t = NAVH.tunggu; NAVH.tunggu = null;
    if (t) t();
    return;
  }
  if (NAVH.tumpuk.length) {
    const e = NAVH.tumpuk.pop();
    if (e.mati) return;
    if (e.j === "dlg") {
      const ok = e.t ? e.t() : true;
      if (ok === false) navDorong("dlg", e.t);
      return;
    }
    if (e.j === "view") { tampilkanView(viewPertama(), subPertama(viewPertama())); return; }
    return;
  }
  if (NAVH.siapKeluar) {
    NAVH.aktif = false;
    window.removeEventListener("popstate", navPop);
    try { history.back(); } catch (e) { /* abaikan */ }
    return;
  }
  try { history.pushState({ cm: "app" }, ""); } catch (e) { return; }
  NAVH.siapKeluar = true;
  toast("Tekan Kembali sekali lagi untuk keluar", "info");
  clearTimeout(NAVH.timer);
  NAVH.timer = setTimeout(() => { NAVH.siapKeluar = false; }, 2500);
}
function navMulai() {
  if (NAVH.aktif) return;
  try {
    history.replaceState({ cm: "akar" }, "");
    history.pushState({ cm: "app" }, "");
    NAVH.aktif = true;
    window.addEventListener("popstate", navPop);
  } catch (e) { NAVH.aktif = false; }
}

// ---------- Excel (SheetJS dimuat saat dibutuhkan) ----------
let _xlsxJanji = null;
function muatXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (_xlsxJanji) return _xlsxJanji;
  _xlsxJanji = new Promise((ok, gagal) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => (window.XLSX ? ok(window.XLSX) : gagal(new Error("Pustaka Excel gagal dimuat.")));
    s.onerror = () => { _xlsxJanji = null; gagal(new Error("Pustaka Excel gagal dimuat. Periksa koneksi internet lalu coba lagi.")); };
    document.head.appendChild(s);
  });
  return _xlsxJanji;
}
// lembar: [{ nama, data: [[...]], lebar: [angka] }]
async function unduhExcel(namaFile, lembar) {
  try {
    mulaiMuat();
    const X = await muatXlsx();
    const wb = X.utils.book_new();
    lembar.forEach(l => {
      const ws = X.utils.aoa_to_sheet(l.data);
      if (l.lebar) ws["!cols"] = l.lebar.map(w => ({ wch: w }));
      X.utils.book_append_sheet(wb, ws, String(l.nama).slice(0, 31));
    });
    X.writeFile(wb, namaFile);
    toast("File " + namaFile + " diunduh.", "ok");
  } catch (e) {
    infoDialog("Unduhan gagal", esc(pesanGalat(e)) + '<p class="mt-2 kecil muted">Jika unduhan diblokir, buka aplikasi di tab baru lalu coba lagi.</p>', "warn");
  } finally { selesaiMuat(); }
}

function rentangCepat(kode) {
  const t = S.hariIni, awal = t.slice(0, 8) + "01";
  if (kode === "hari") return [t, t];
  if (kode === "7") return [tambahHari(t, -6), t];
  if (kode === "bulan") return [awal, t];
  if (kode === "lalu") { const akhir = tambahHari(awal, -1); return [akhir.slice(0, 8) + "01", akhir]; }
  return ["", ""];
}
// bagian: [{ k, label, pilihan: [[nilai, label]] }] | { k: "rentang", label } | { k, label, centang: "teks" }
function dialogSaring(judul, bagian, nilai) {
  const v = Object.assign({}, nilai);
  const isiRentang = () => {

    const kode = !v.dari && !v.sampai ? "" : (cocok || "pilih");

  };
  const isi = bagian.map(b => '<div class="mb-4"><div class="lbl">' + esc(b.label) + "</div>" +
    (b.k === "rentang" ? isiRentang()
      : b.centang ? '<label class="flex items-center gap-2 kecil cursor-pointer"><input type="checkbox" data-centang="' + b.k + '"' + (v[b.k] ? " checked" : "") + ">" + esc(b.centang) + "</label>"
      : '<div class="flex flex-wrap gap-1.5" data-grup="' + b.k + '">' + b.pilihan.map(x => '<button type="button" class="chip-pilih' + ((v[b.k] || "") === x[0] ? " on" : "") + '" data-v="' + esc(x[0]) + '" aria-pressed="' + ((v[b.k] || "") === x[0]) + '">' + esc(x[1]) + "</button>").join("") + "</div>") +
    "</div>").join("");
  return dialog({
    judul: '<i class="fa-solid fa-sliders t-accent mr-2"></i>' + esc(judul), lebar: 480, isi: isi, tanpaFokus: true,
    tombol: [{ teks: "Reset", nilai: "reset", kelas: "btn-ghost mr-auto" }, { teks: "Batal", nilai: null }, { teks: "Terapkan", nilai: true, kelas: "btn-primary", utama: true }],
    saatBuka: (root) => {
      root.querySelectorAll("[data-grup]").forEach(g => g.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
        v[g.dataset.grup] = b.dataset.v;
        g.querySelectorAll("[data-v]").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
      }));
      root.querySelectorAll("[data-centang]").forEach(c => c.onchange = () => { v[c.dataset.centang] = c.checked; });
      const rg = root.querySelector("[data-rentang]");
      if (rg) {
        const pilih = root.querySelector("[data-tgl-pilih]");
        rg.querySelectorAll("[data-rg]").forEach(b => b.onclick = () => {
          rg.querySelectorAll("[data-rg]").forEach(x => x.classList.toggle("on", x === b));
          pilih.classList.toggle("hidden", b.dataset.rg !== "pilih");
          if (b.dataset.rg !== "pilih") { const r = rentangCepat(b.dataset.rg); v.dari = r[0]; v.sampai = r[1]; }
        });
        root.querySelector("[data-dari]").onchange = (ev) => { v.dari = ev.target.value; };
        root.querySelector("[data-sampai]").onchange = (ev) => { v.sampai = ev.target.value; };
      }
    },
    ambil: (root, tombol) => {
      if (tombol === "reset") return "reset";
      if (v.dari && v.sampai && v.dari > v.sampai) throw new Error("Tanggal awal tidak boleh sesudah tanggal akhir.");
      return v;
    }
  });
}
