<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabinaku · Pembinaan Rutan Raba Bima</title>
<meta name="description" content="Monitoring pembinaan WBP Rutan Kelas IIB Raba Bima">
<meta name="theme-color" content="#0b1328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rabinaku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<style>
  :root { --bg: #0b1328; --teks: #eef4ff; --redup: #8ea0c4; --aksen: #3b82f6; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--teks); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* aplikasi memenuhi seluruh layar */
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  #muat { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .35s; z-index: 2; }
  #muat.selesai { opacity: 0; pointer-events: none; }
  .kotak { text-align: center; padding: 24px; }
  .logo { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, #3b82f6, #6d28d9); box-shadow: 0 0 30px rgba(59, 130, 246, .55); }
  .logo svg { width: 34px; height: 34px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
  p { margin: 6px 0 0; color: var(--redup); font-size: 13px; }
  .putar { width: 26px; height: 26px; margin: 18px auto 0; border: 3px solid rgba(110, 168, 255, .25); border-top-color: var(--aksen); border-radius: 50%; animation: putar .8s linear infinite; }
  @keyframes putar { to { transform: rotate(360deg); } }
  #lambat { display: none; margin-top: 16px; font-size: 13px; color: var(--redup); }
  #lambat a { color: #93bfff; }
  @media (prefers-reduced-motion: reduce) { .putar { animation-duration: 2s; } }
</style>
</head>
<body>
<div id="muat" role="status" aria-live="polite">
  <div class="kotak">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/></svg></div>
    <h1>Rabinaku</h1>
    <p>Rutan Kelas IIB Raba Bima</p>
    <div class="putar"></div>
    <div id="lambat">Koneksi lambat? <a id="langsung" href="#" target="_top" rel="noopener">Buka langsung</a></div>
  </div>
</div>
<iframe id="app" title="Rabinaku" allow="clipboard-write; camera" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  // Alamat Web App Google Apps Script (Deploy → Manage deployments → Web app URL)
  var ALAMAT_APP = "https://script.google.com/macros/s/AKfycbwkRupA-Z8DvPcs6z7DkR2MaJotye9F-SSN22XGtGeRm7YQNfXrMsTqOmtnP3CPswE/exec";
  var app = document.getElementById("app"), muat = document.getElementById("muat");
  document.getElementById("langsung").href = ALAMAT_APP;
  app.addEventListener("load", function () { setTimeout(function () { muat.classList.add("selesai"); }, 250); });
  app.src = ALAMAT_APP;
  setTimeout(function () { document.getElementById("lambat").style.display = "block"; }, 12000);
</script>
</body>
</html>
