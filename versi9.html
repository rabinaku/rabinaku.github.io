function ringkasLevel(n) {
  return PROGRAM.filter(p => n && n[p]).map(p => String(n[p][0]).toLowerCase().indexOf(p.toLowerCase()) === 0 ? n[p][0] : p + " " + n[p][0]).join(" · ");
}

function barisNilai(w, tgl, d) {
  const n = d.nil[w.id];
  const ab = d.abs[w.id];
  const tunggu = menunggu("simpanMonitoring", tgl, w.id);
  const ikut = PROGRAM.filter(p => ikutMateri(w, p));
  let sub;
  if (n) sub = '<span class="t-ok font-bold"><i class="fa-solid fa-check mr-1"></i>' + esc(ringkasLevel(n)) + "</span>";
  else if (!ikut.length) sub = '<span class="t-warn">Belum ikut materi apa pun</span>';
  else sub = esc([w.bl ? "Blok " + w.bl : "", "terakhir dinilai " + relatif(w.ld)].filter(Boolean).join(" · "));
  const lencana = ab && ab[0] !== "Hadir" ? '<span class="badge ' + KELAS_ABSEN[ab[0]] + '">' + esc(ab[0]) + "</span>" : "";
  return '<button type="button" class="baris klik' + (n ? " selesai" : "") + '" data-id="' + esc(w.id) + '">' + avatar(w, 36) +
    '<div class="min-w-0 flex-1"><div class="nm truncate">' + esc(w.nm) + '</div><div class="mini muted truncate">' + sub + "</div></div>" + lencana +
    (tunggu ? '<span class="titik ' + (KIRIM.gagal ? "tunda" : "kirim") + '" title="' + (KIRIM.gagal ? "Menunggu sinyal" : "Menyimpan") + '"></span>' : "") +
    '<i class="fa-solid ' + (n ? "fa-pen" : "fa-chevron-right") + ' muted"></i></button>';
}

function gambarNilai() {
  const tgl = S.tgl || S.hariIni;
  const d = S.hariData[tgl];
  if (!d || !el("monDaftar")) return;
  const L = daftarHariIni(tgl, MON.cari);
  const dinilai = L.jadwal.filter(w => d.nil[w.id]).length;
  const tdkHadir = L.jadwal.filter(w => d.abs[w.id] && d.abs[w.id][0] !== "Hadir").length;
  el("monInfo").innerHTML =
    htmlInfoLibur(tgl, "") +
    '<div class="flex flex-wrap items-center gap-x-4 gap-y-2"><span class="stat-kecil"><i class="fa-solid fa-calendar-check t-accent"></i>' + esc(namaHari(tgl)) + ": <b>" + L.jadwal.length + "</b> terjadwal</span>" +
    '<span class="stat-kecil t-ok"><i class="fa-solid fa-pen-to-square"></i><b>' + dinilai + "</b> sudah dinilai</span>" +
    (tdkHadir ? '<span class="stat-kecil"><i class="fa-solid fa-user-xmark"></i><b>' + tdkHadir + "</b> tidak hadir</span>" : "") + "</div>";
  let h;
  if (!L.jadwal.length && !MON.cari) {
    h = L.libur.length ? '<div class="card kosong-isi">Semua WBP yang terjadwal hari ' + esc(namaHari(tgl)) + " sedang libur.</div>"
      : '<div class="card kosong-isi">Tidak ada WBP yang jadwalnya hari ' + esc(namaHari(tgl)) + '.<div class="mini mt-2">Ketik nama di kotak pencarian untuk menilai WBP lain.</div></div>';
    h += htmlKelompokLibur(L, tgl, w => barisNilai(w, tgl, d));
  } else {
    // yang belum dinilai di atas, yang sudah di bawah
    const urut = L.tampil.filter(w => !d.nil[w.id]).concat(L.tampil.filter(w => d.nil[w.id]));
    h = urut.map(w => barisNilai(w, tgl, d)).join("");
    if (MON.cari && !L.tampil.length && !L.lain.length && !L.libur.length) h = '<div class="card kosong-isi">Tidak ada nama yang cocok.</div>';
    h += htmlKelompokLibur(L, tgl, w => barisNilai(w, tgl, d));
    if (L.lain.length) h += '<div class="pemisah">Tidak terjadwal hari ' + esc(namaHari(tgl)) + "</div>" + L.lain.map(w => barisNilai(w, tgl, d)).join("");
  }
  el("monDaftar").innerHTML = h;
}

// Simpan nilai satu WBP: layar langsung berubah, pengiriman di belakang
function setNilai(id, tgl, n, c, jenis) {
  const d = S.hariData[tgl];
  if (d) {
    const o = d.nil[id] = d.nil[id] || {};
    Object.keys(n).forEach(p => {
      if (n[p] === "#hapus") delete o[p];
      else o[p] = [n[p], jenis, c !== undefined ? c : (o[p] ? o[p][2] : ""), o[p] ? o[p][3] : ""];
    });
    if (!Object.keys(o).length) delete d.nil[id];
  }
  const data = { n: n };
  if (c !== undefined) data.c = c;
  kirimTambah("simpanMonitoring", tgl, id, data, jenis);
}

// ---------- Pop-up nilai satu WBP ----------
function dialogNilaiWbp(id, opsi) {
  opsi = opsi || {};
  const w = S.wbpMap[id];
  if (!w) { toast("WBP tidak ditemukan.", "warn"); return Promise.resolve(false); }
  const K = { tgl: (opsi.tgl && opsi.tgl <= S.hariIni) ? opsi.tgl : S.hariIni, jenis: "Rutin", pilih: {}, n: {}, c: undefined, siap: false, galat: "", minta: 0, awal: true, tutup: false, row: null };
  const ikutList = () => PROGRAM.filter(p => ikutMateri(w, p));
  let akar = null;
  const R = (q) => akar.querySelector(q);

  // Data dasar: untuk hari ini semuanya sudah ada di HP (tanpa menunggu server)
  const dariLokal = (tgl) => {
    const d = S.hariData[tgl];
    const nilai = {};
    const n = d && d.nil[id];
    if (n) Object.keys(n).forEach(p => { nilai[p] = { v: n[p][0], j: n[p][1], c: n[p][2] }; });
    return { sb: (w.sb || []).slice(), rs: (w.rs || []).slice(), nilai: nilai };
  };
  const asli = (p) => (K.row && K.row.nilai[p] ? K.row.nilai[p].v : "");
  const kini = (p) => (p in K.n ? K.n[p] : asli(p));
  const catAsli = () => { for (const p of ikutList()) { if (K.pilih[p] && K.row.nilai[p] && K.row.nilai[p].c) return K.row.nilai[p].c; } return ""; };

  const siapkan = () => {
    ikutList().forEach(p => { if (asli(p)) K.pilih[p] = true; });
    if (K.awal) {
      K.awal = false;
      const terakhir = ambilLokal("cm_materi_cepat");
      if (!Object.keys(K.pilih).length && terakhir && ikutList().indexOf(terakhir) !== -1) K.pilih[terakhir] = true;
      if (!Object.keys(K.pilih).length && ikutList().length === 1) K.pilih[ikutList()[0]] = true;
    }
  };

  const muatRow = async () => {
    const minta = ++K.minta;
    K.galat = "";
    if (K.tgl === S.hariIni && S.dataTgl === S.hariIni && S.hariData[K.tgl]) {
      K.row = dariLokal(K.tgl); K.siap = true; siapkan();
      if (akar) gambarSemua();
      return;
    }
    K.siap = false;
    if (akar) gambarSemua();
    try {
      const r = await api("getNilaiWbp", S.token, id, K.tgl);
      if (minta !== K.minta || K.tutup) return;
      const nilai = {};
      Object.keys(r.nilai || {}).forEach(p => { const x = r.nilai[p]; nilai[p] = { v: x[0], j: x[1], c: x[2] }; });
      // isian yang masih antre untuk tanggal itu ikut ditampilkan
      KIRIM.antre.forEach(x => {
        if (x.fn !== "simpanMonitoring" || x.tgl !== K.tgl || !x.items[id]) return;
        const v = x.items[id];
        Object.keys(v.n || {}).forEach(p => { if (v.n[p] === "#hapus") delete nilai[p]; else nilai[p] = { v: v.n[p], j: x.jenis, c: v.c || (nilai[p] ? nilai[p].c : "") }; });
      });
      K.row = { sb: r.sb, rs: r.rs, nilai: nilai };
      K.siap = true;
      siapkan();
    } catch (e) {
      if (minta !== K.minta || K.tutup) return;
      const m = pesanGalat(e);
      K.galat = m.indexOf("SESI_HABIS") !== -1 ? "Sesi login berakhir. Tutup jendela ini, masuk lagi, lalu ulangi." : m;
    }
    if (akar && !K.tutup) gambarSemua();
  };

  const gambarKepala = () => {
    const ab = S.hariData[K.tgl] && S.hariData[K.tgl].abs[id];
    const st = ab ? ab[0] : "";
    const sub = [w.bl ? "Blok " + w.bl : "", (w.hr || []).join(", ")].filter(Boolean).join(" · ");
    R("#pnKepala").innerHTML = '<div class="flex items-center gap-3">' + avatar(w, 46) +
      '<div class="min-w-0 flex-1"><div class="font-bold text-lg truncate">' + esc(w.nm) + '</div><div class="mini muted truncate">' + esc(sub) + "</div></div>" +
      (st ? '<span class="badge ' + KELAS_ABSEN[st] + '">' + esc(st) + "</span>" : "") + "</div>" +
      (st && st !== "Hadir" ? '<div class="mini t-warn mt-2"><i class="fa-solid fa-circle-info mr-1"></i>Tercatat ' + esc(st.toLowerCase()) + " pada tanggal ini. Bila diberi nilai, WBP dianggap hadir.</div>" : "");
  };
  const gambarChip = () => {
    const daftar = ikutList();
    R("#pnChip").innerHTML = daftar.length ? daftar.map(p => {
      const on = !!K.pilih[p], ada = !!asli(p);
      return '<button type="button" class="chip-pilih' + (on ? " on" : "") + '" data-mat="' + p + '" aria-pressed="' + on + '"><i class="fa-solid ' + (on ? "fa-square-check" : "fa-square") + '"></i>' + p +
        (ada ? ' <span class="mini t-ok"><i class="fa-solid fa-check"></i></span>' : "") + "</button>";
    }).join("") : '<p class="kecil t-warn">WBP ini belum mengikuti materi apa pun. Atur di menu Data WBP.</p>';
  };
  const panelMateri = (p) => {
    const i = PROGRAM.indexOf(p), L = levelNyata(p);
    const v = kini(p), a = asli(p), ber = v !== a;
    const sb = K.row.sb[i], rs = K.row.rs[i], tg = (w.tg || [])[i];
    const iv = L.indexOf(v), iSb = L.indexOf(sb), iRs = L.indexOf(rs);
    const pilihan = '<option value="">— belum dipilih —</option>' + L.map((x, j) => {
      const tanda = [j === iSb ? "sebelumnya" : "", j === iRs && iRs !== iSb ? "rekor" : "", x === tg ? "target" : ""].filter(Boolean).join(", ");
      return '<option value="' + esc(x) + '"' + (x === v ? " selected" : "") + ">" + esc(x) + (tanda ? " (" + tanda + ")" : "") + "</option>";
    }).join("");
    const dasar = iv >= 0 ? iv : iSb;
    const berikut = dasar >= 0 && dasar + 1 < L.length ? L[dasar + 1] : "";
    let tanda = "";
    if (iv >= 0 && iRs >= 0) {
      if (iv < iRs) tanda = '<div class="nil-tanda t-warn" style="margin-left:0"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Di bawah rekor ' + esc(rs) + ". Naik kembali sampai rekor tidak menambah poin.</div>";
      else if (iv - iRs >= 2) tanda = '<div class="nil-tanda t-warn" style="margin-left:0"><i class="fa-solid fa-bolt mr-1"></i>Naik ' + (iv - iRs) + " tingkat sekaligus. Pastikan benar; akan ditandai untuk diperiksa.</div>";
      else if (iv > iRs) tanda = '<div class="nil-tanda t-ok" style="margin-left:0"><i class="fa-solid fa-arrow-up mr-1"></i>Naik 1 tingkat dari rekor.</div>';
    }
    let status = "";
    if (a && !ber) status = '<span class="t-ok"><i class="fa-solid fa-check mr-1"></i>tersimpan</span>';
    else if (a && !v) status = '<span class="t-bad"><i class="fa-solid fa-trash-can mr-1"></i>akan dihapus</span>';
    const info = [sb ? "sebelumnya <b>" + esc(sb) + "</b>" : "", iRs > iSb ? '<span class="t-warn">rekor ' + esc(rs) + "</span>" : "", tg ? "target " + esc(tg) : "", status].filter(Boolean).join(" · ");
    return '<div class="nilai-materi" data-panel="' + p + '"><div class="mb-1"><b class="text-base">' + p + "</b></div>" +
      (info ? '<div class="mini t2 mb-2">' + info + "</div>" : "") +
      '<label class="sr-only" for="pn-' + p + '">Level ' + p + '</label><select class="inp' + (ber ? " berubah" : "") + '" id="pn-' + p + '" data-sel="' + p + '">' + pilihan + "</select>" +
      '<div class="kilat"><button type="button" class="btn btn-besar" data-tetap="' + p + '"' + (sb ? "" : " disabled") + '><i class="fa-solid fa-equals"></i>Tetap</button>' +
      '<button type="button" class="btn btn-besar" data-naik="' + p + '"' + (berikut ? "" : " disabled") + '><i class="fa-solid fa-arrow-up"></i>Naik' + (berikut ? " ke " + esc(berikut) : "") + "</button></div>" + tanda +
      catatanSebelum(p) + "</div>";
  };
  // Catatan & level yang diisi pengajar sebelumnya (dari semua pengajar)
  const catatanSebelum = (p) => {
    if (K.catGalat) return "";
    if (!K.cat) return '<div class="mini muted mt-3"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>Memuat catatan pengajar sebelumnya…</div>';
    const L = (K.cat[p] || []).filter(x => !(x.t === K.tgl && !x.c));
    if (!L.length) return '<div class="mini muted mt-3"><i class="fa-solid fa-note-sticky mr-1"></i>Belum ada catatan sebelumnya untuk ' + esc(p) + ".</div>";
    return '<div class="catatan-lalu mt-3"><div class="mini font-semibold t2 mb-1"><i class="fa-solid fa-clock-rotate-left mr-1"></i>Catatan sebelumnya</div>' + L.map(x =>
      '<div class="catatan-item"><div class="flex flex-wrap items-baseline gap-x-2"><b class="kecil">' + esc(x.v) + '</b><span class="mini muted">' + esc(tglPendek(x.t)) + (x.o ? " · " + esc(x.o) : "") + "</span></div>" +
      (x.c ? '<div class="kecil t2">“' + esc(x.c) + "”</div>" : "") + "</div>").join("") + "</div>";
  };
  const gambarPanel = () => {
    let h = "";
    if (K.galat) h = '<div class="p-3 rounded-xl kecil" style="background:var(--bad-bg)"><i class="fa-solid fa-triangle-exclamation t-bad mr-1"></i>' + esc(K.galat) + ' <button type="button" class="btn btn-sm ml-2" data-ulang="1">Coba lagi</button></div>';
    else if (!K.siap) h = '<div class="kosong-isi"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Memuat level…</div>';
    else if (ikutList().length) {
      const daftar = ikutList().filter(p => K.pilih[p]);
      h = daftar.length ? daftar.map(panelMateri).join("") : '<div class="kecil muted p-3 text-center panel-2"><i class="fa-solid fa-hand-pointer mr-1"></i>Ketuk materi yang kamu ajarkan di atas, lalu pilih levelnya.</div>';
    }
    R("#pnPanel").innerHTML = h;
    const tampilCat = K.siap && bisa("data_catatan") && ikutList().some(p => K.pilih[p]);
    R("#pnCatatan").classList.toggle("hidden", !tampilCat);
    if (tampilCat && document.activeElement !== R("#pnCat")) R("#pnCat").value = K.c !== undefined ? K.c : catAsli();
    const tombol = akar.querySelector('.dialog-f [data-i="1"]');
    if (tombol) tombol.disabled = !K.siap;
  };
  const gambarSemua = () => {
    gambarKepala();
    if (K.siap) gambarChip(); else R("#pnChip").innerHTML = "";
    gambarPanel();
    R("#pnInfoTgl").innerHTML = K.tgl !== S.hariIni
      ? '<span class="t-warn"><i class="fa-solid fa-clock-rotate-left mr-1"></i>Isi susulan ' + esc(tglPanjang(K.tgl)) + "</span>" : "";
  };

  muatRow();
  // catatan pengajar lain dimuat di belakang (pop-up tidak menunggu)
  K.cat = CATATAN[id] || null;
  api("getCatatanWbp", S.token, id).then(r => { CATATAN[id] = r.materi || {}; K.cat = CATATAN[id]; if (akar && !K.tutup && K.siap) gambarPanel(); })
    .catch(() => { K.catGalat = !K.cat; if (akar && !K.tutup && K.siap) gambarPanel(); });
  return dialog({
    judul: '<i class="fa-solid fa-seedling t-accent mr-2"></i>Isi perkembangan',
    lebar: 540, tanpaFokus: true,
    isi: '<div id="pnKepala" class="mb-3"></div>' +
      '<div class="flex flex-wrap items-end gap-3 mb-3"><div><label class="lbl" for="pnTgl">Tanggal</label><input type="date" class="inp" style="width:auto" id="pnTgl" max="' + S.hariIni + '" value="' + K.tgl + '"></div>' +
      '<div class="mini ml-auto" id="pnInfoTgl"></div></div>' +
      '<div class="lbl">Materi yang kamu ajarkan</div><div class="flex flex-wrap gap-2 mb-3" id="pnChip"></div>' +
      '<div id="pnPanel"></div>' +
      '<div id="pnCatatan" class="mt-3 hidden"><label class="lbl" for="pnCat">Catatan untuk pengajar berikutnya (opsional)</label><input class="inp" id="pnCat" maxlength="500" placeholder="Misalnya: Iqra 1 halaman 25, perlu mengulang tajwid"><div class="bantu">Catatan ini terlihat oleh pengajar lain saat menilai WBP ini.</div></div>',
    tombol: [{ teks: "Batal", nilai: null }, { teks: '<i class="fa-solid fa-check"></i>Simpan', nilai: true, kelas: "btn-primary btn-besar", utama: true }],
    saatBuka: (root) => {
      akar = root;
      gambarSemua();
      root.addEventListener("click", (ev) => {
        const b = ev.target.closest("button");
        if (!b || !root.contains(b) || b.disabled) return;
        const d = b.dataset;
        if (d.mat) {
          K.pilih[d.mat] = !K.pilih[d.mat];
          if (K.pilih[d.mat]) simpanLokal("cm_materi_cepat", d.mat);
          gambarChip(); gambarPanel();
        } else if (d.tetap) {
          const i = PROGRAM.indexOf(d.tetap);
          if (K.row.sb[i]) { K.n[d.tetap] = K.row.sb[i]; gambarPanel(); }
        } else if (d.naik) {
          const L = levelNyata(d.naik), i = PROGRAM.indexOf(d.naik);
          const kn = L.indexOf(kini(d.naik)), dasar = kn >= 0 ? kn : L.indexOf(K.row.sb[i]);
          if (dasar >= 0 && dasar + 1 < L.length) { K.n[d.naik] = L[dasar + 1]; gambarPanel(); }
        } else if (d.ulang) muatRow();
      });
      root.addEventListener("change", (ev) => {
        const t = ev.target;
        if (t.dataset && t.dataset.sel) { K.n[t.dataset.sel] = t.value; gambarPanel(); }
        else if (t.id === "pnTgl") {
          if (!t.value || t.value > S.hariIni) { t.value = K.tgl; return; }
          K.tgl = t.value; K.n = {}; K.pilih = {}; K.c = undefined; K.awal = true;
          muatRow();
        }
      });
      root.addEventListener("input", (ev) => { if (ev.target.id === "pnCat") K.c = ev.target.value; });
    },
    ambil: async () => {
      if (!K.siap) throw new Error(K.galat || "Tunggu sebentar, level masih dimuat.");
      const dipilih = ikutList().filter(p => K.pilih[p]);
      if (!dipilih.length) throw new Error("Ketuk dulu materi yang kamu ajarkan, lalu pilih levelnya.");
      const catUbah = bisa("data_catatan") && K.c !== undefined && K.c !== catAsli();
      const n = {};
      dipilih.forEach(p => {
        const v = kini(p), a = asli(p);
        if (v) { if (v !== a || catUbah) n[p] = v; }
        else if (a) n[p] = "#hapus";
      });
      if (!Object.keys(n).length) {
        if (dipilih.every(p => !kini(p))) throw new Error("Pilih level (atau tekan Tetap / Naik).");
        return "sama";
      }
      return { n: n, c: catUbah ? K.c : undefined };
    }
  }).then(v => {
    K.tutup = true;
    if (!v) return false;
    if (v === "sama") return true;
    // Tanggal lain yang belum dimuat: tetap dikirim, tampilan tanggal itu dimuat ulang nanti
    setNilai(id, K.tgl, v.n, v.c, "Rutin");
    // catatan sendiri langsung ikut terlihat di pop-up berikutnya
    if (CATATAN[id]) Object.keys(v.n).forEach(p => { if (v.n[p] === "#hapus") return; const arr = CATATAN[id][p] = (CATATAN[id][p] || []).filter(x => x.t !== K.tgl); arr.unshift({ t: K.tgl, v: v.n[p], c: v.c !== undefined ? v.c : catAsli(), o: penggunaKini() }); arr.splice(4); });
    const naik = Object.keys(v.n).filter(p => {
      const i = PROGRAM.indexOf(p), L = levelNyata(p);
      return v.n[p] !== "#hapus" && L.indexOf(v.n[p]) - L.indexOf(K.row.rs[i]) >= 2;
    });
    if (naik.length) toast("Tersimpan. Catatan: " + naik.join(", ") + " naik lebih dari satu tingkat sekaligus — pastikan benar.", "warn");
    segarkanBarisTampil();
    return true;
  });
}

// =====================================================================
//  RIWAYAT (penilaian & absensi), disaring di server
// =====================================================================
function riwBaru(jenis) { return { q: "", jk: "", p: "", st: "", dari: "", sampai: "", offset: 0, limit: 20, data: null }; }
const RIW = { nilai: riwBaru("nilai"), absen: riwBaru("absen") };
let _riwMinta = 0;

function renderRiwayat(wadah, jenis) {
  const f = RIW[jenis];
  const nilai = jenis === "nilai";
  const pre = "riw-" + jenis;
  const bagian = [];
  if (S.akses === "semua") bagian.push({ k: "jk", label: "Jenis kelamin", ikon: "fa-venus-mars", pilihan: [["", "Semua"], ["L", "Putra"], ["P", "Putri"]] });
  if (nilai) bagian.push({ k: "p", label: "Materi", ikon: "fa-book-open", pilihan: [["", "Semua materi"]].concat(PROGRAM.map(x => [x, x])) });
  else bagian.push({ k: "st", label: "Status", ikon: "fa-user-check", pilihan: [["", "Semua status"]].concat(STATUS_ABSEN.map(x => [x, x])) });
  bagian.push({ k: "rentang", label: "Tanggal", ikon: "fa-calendar-days" });
  const ulang = () => { RIW[jenis].offset = 0; renderRiwayat(wadah, jenis); };
  const cfg = {
    pre: pre, q: f.q, ph: "Cari nama atau blok…", judul: nilai ? "Saring riwayat penilaian" : "Saring riwayat absensi", bagian: bagian, nilai: f,
    kanan: '<button type="button" class="btn btn-ikon shrink-0" id="' + pre + 'Excel" title="Unduh Excel (sesuai saringan)" aria-label="Unduh Excel"><i class="fa-solid fa-file-excel"></i></button>',
    cari: (q) => { f.q = q; f.offset = 0; muatRiwayat(jenis); },
    terapkan: (v) => { ["jk", "p", "st", "dari", "sampai"].forEach(k => { f[k] = v[k] || ""; }); ulang(); },
    reset: () => { const q = f.q; RIW[jenis] = riwBaru(jenis); RIW[jenis].q = q; ulang(); }
  };
  wadah.innerHTML = '<div class="mb-3">' + htmlSaring(cfg) + "</div>" +
    '<div id="' + pre + 'Tabel"><div class="kosong-isi"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Memuat riwayat…</div></div>';
  pasangSaring(cfg);
  el(pre + "Excel").onclick = () => eksporRiwayat(jenis);
  // sudah pernah dimuat dengan saringan yang sama: tampilkan langsung, muat ulang hanya bila ada data baru
  if (f.data && f.kunci === JSON.stringify(saringRiw(jenis))) {
    gambarRiwayat(jenis);
    segarkanJikaPerlu(f.data._v, jenis === "absen" ? ["a", "w", "u"] : ["n", "w", "u"], () => muatRiwayat(jenis, true));
  } else muatRiwayat(jenis);
}

function saringRiw(jenis, semua) {
  const f = RIW[jenis];
  return { jenis: jenis, q: f.q, jk: f.jk, p: f.p, st: f.st, dari: f.dari, sampai: f.sampai, offset: semua ? 0 : f.offset, limit: semua ? 5000 : f.limit };
}

// diam: penyegaran di belakang (tanpa redup / indikator), gambar ulang hanya bila isinya berubah
async function muatRiwayat(jenis, diam) {
  const f = RIW[jenis];
  const box = el("riw-" + jenis + "Tabel");
  if (!box) return;
  const minta = ++_riwMinta;
  if (!diam) { box.style.opacity = ".55"; mulaiMuat(); }
  try {
    const kunci = JSON.stringify(saringRiw(jenis));
    const d = await api("getRiwayat", S.token, saringRiw(jenis));
    if (minta !== _riwMinta) return;
    const sama = diam && f.data && JSON.stringify([f.data.total, f.data.rows]) === JSON.stringify([d.total, d.rows]);
    f.data = d;
    f.kunci = kunci;
    if (sama) return;
    const y = window.scrollY;
    gambarRiwayat(jenis);
    if (diam) window.scrollTo(0, y);
    if (S.lompatKe === "riwayat") { lompatBagian(); S.lompatKe = ""; }
  } catch (e) {
    if (minta === _riwMinta) { box.innerHTML = '<div class="card kosong-isi">Riwayat gagal dimuat.</div>'; tanganiGalat(e); }
  } finally {
    if (!diam) selesaiMuat();
    const b = el("riw-" + jenis + "Tabel");
    if (b && minta === _riwMinta) b.style.opacity = "";
  }
}

function selPerubahan(r) {
  if (r.d > 0) {
    let ket;
    if (r.n >= r.d) ket = '<span class="mini muted">dihitung</span>';
    else if (r.n > 0) ket = '<span class="mini t-warn">dihitung +' + r.n + " (" + esc(ALASAN_NAIK[r.al] || r.al) + ")</span>";
    else ket = '<span class="mini muted">tidak dihitung: ' + esc(ALASAN_NAIK[r.al] || r.al || "—") + "</span>";
    return '<span class="t-ok font-bold whitespace-nowrap"><i class="fa-solid fa-arrow-up mr-1"></i>+' + r.d + "</span> " + ket;
  }
  if (r.d < 0) return '<span class="t-bad font-bold whitespace-nowrap"><i class="fa-solid fa-arrow-down mr-1"></i>' + r.d + '</span> <span class="mini muted">di bawah rekor</span>';
  return '<span class="muted">—</span>';
}

function gambarRiwayat(jenis) {
  const f = RIW[jenis], d = f.data;
  const box = el("riw-" + jenis + "Tabel");
  if (!box || !d) return;
  if (!d.rows.length) {
    box.innerHTML = '<div class="card kosong-isi">' + (d.total ? "Halaman ini kosong." : "Tidak ada catatan untuk saringan ini.") + "</div>";
    return;
  }
  const ubah = bisa("act_edit_riwayat");
  const nilai = jenis === "nilai";
  const cat = nilai && bisa("data_catatan");
  const oleh = bisa("data_penginput");
  const aksiSel = (i) => ubah ? '<td class="kanan whitespace-nowrap"><button type="button" class="btn btn-ghost btn-sm btn-ikon" data-ubah="' + i + '" title="Ubah" aria-label="Ubah"><i class="fa-solid fa-pen"></i></button>' +
    '<button type="button" class="btn btn-ghost btn-sm btn-ikon" data-hapus="' + i + '" title="Hapus" aria-label="Hapus"><i class="fa-solid fa-trash-can t-bad"></i></button></td>' : "";
  const selTgl = (r) => '<td class="whitespace-nowrap">' + esc(tglPendek(r.tgl)) + '<div class="mini muted">' + esc(namaHari(r.tgl)) + "</div></td>";
  const selNama = (r) => '<td><div class="font-semibold">' + esc(r.nm) + "</div>" + (r.bl ? '<div class="mini muted">Blok ' + esc(r.bl) + "</div>" : "") + "</td>";
  let kepala, baris;
  if (nilai) {
    kepala = "<th>Tanggal</th><th>WBP</th><th>Materi</th><th>Level</th><th>Dibanding rekor</th><th>Jenis</th>" + (cat ? "<th>Catatan</th>" : "") + (oleh ? "<th>Oleh</th>" : "") + (ubah ? '<th class="kanan">Aksi</th>' : "");
    baris = d.rows.map((r, i) => "<tr>" + selTgl(r) + selNama(r) + "<td>" + esc(r.p) + '</td><td class="font-semibold">' + esc(r.v) + "</td><td>" + selPerubahan(r) + "</td>" +
      "<td>" + (r.j === "Asesmen" ? '<span class="badge b-violet">Asesmen</span>' : '<span class="badge b-muted">Rutin</span>') + "</td>" +
      (cat ? '<td class="kecil t2" style="max-width:260px">' + esc(r.c) + "</td>" : "") + (oleh ? '<td class="kecil t2">' + esc(r.o) + "</td>" : "") + aksiSel(i) + "</tr>").join("");
  } else {
    kepala = "<th>Tanggal</th><th>WBP</th><th>Status</th><th>Keterangan</th>" + (oleh ? "<th>Oleh</th>" : "") + (ubah ? '<th class="kanan">Aksi</th>' : "");
    baris = d.rows.map((r, i) => "<tr>" + selTgl(r) + selNama(r) + '<td><span class="badge ' + (KELAS_ABSEN[r.s] || "b-muted") + '">' + esc(r.s) + "</span></td>" +
      '<td class="kecil t2">' + esc(r.k) + "</td>" + (oleh ? '<td class="kecil t2">' + esc(r.o) + "</td>" : "") + aksiSel(i) + "</tr>").join("");
  }
  const a = f.offset + 1, b = Math.min(d.total, f.offset + d.rows.length);
  // HP: daftar kartu (tanpa geser ke samping); komputer: tabel
  const hp = window.innerWidth < 640;
  const tombolHp = (i) => ubah ? '<div class="flex shrink-0"><button type="button" class="btn btn-ghost btn-sm btn-ikon" data-ubah="' + i + '" aria-label="Ubah"><i class="fa-solid fa-pen"></i></button><button type="button" class="btn btn-ghost btn-sm btn-ikon" data-hapus="' + i + '" aria-label="Hapus"><i class="fa-solid fa-trash-can t-bad"></i></button></div>' : "";
  const kartuHp = d.rows.map((r, i) => '<div class="baris" style="align-items:flex-start"><div class="min-w-0 flex-1">' +
    '<div class="flex items-baseline justify-between gap-2"><span class="nm truncate">' + esc(r.nm) + '</span><span class="mini muted shrink-0">' + esc(tglPendek(r.tgl)) + "</span></div>" +
    (nilai
      ? '<div class="kecil mt-1"><span class="muted">' + esc(r.p) + ':</span> <b>' + esc(r.v) + "</b> " + (r.d > 0 ? '<span class="t-ok font-bold">↑' + r.d + "</span>" : r.d < 0 ? '<span class="t-bad font-bold">↓' + (-r.d) + "</span>" : "") +
        (r.j === "Asesmen" ? ' <span class="badge b-violet">Asesmen</span>' : "") + "</div>" + (cat && r.c ? '<div class="mini muted mt-1">“' + esc(r.c) + "”</div>" : "")
      : '<div class="kecil mt-1"><span class="badge ' + (KELAS_ABSEN[r.s] || "b-muted") + '">' + esc(r.s) + "</span> " + esc(r.k || "") + "</div>") +
    (oleh && r.o ? '<div class="mini muted mt-1">oleh ' + esc(r.o) + "</div>" : "") + "</div>" + tombolHp(i) + "</div>").join("");
  box.innerHTML = (hp ? '<div class="daftar">' + kartuHp + "</div>" : '<div class="card overflow-x-auto"><table class="tbl"><thead><tr>' + kepala + "</tr></thead><tbody>" + baris + "</tbody></table></div>") +
    '<div class="flex flex-wrap items-center justify-between gap-3 mt-3"><div class="kecil t2">Menampilkan ' + angka(a) + "–" + angka(b) + " dari " + angka(d.total) + " catatan</div>" +
    '<div class="flex gap-2"><button type="button" class="btn btn-sm" data-hal="-1"' + (f.offset <= 0 ? " disabled" : "") + '><i class="fa-solid fa-chevron-left"></i>Sebelumnya</button>' +
    '<button type="button" class="btn btn-sm" data-hal="1"' + (b >= d.total ? " disabled" : "") + '>Berikutnya<i class="fa-solid fa-chevron-right"></i></button></div></div>';
  box.querySelectorAll("[data-hal]").forEach(btn => btn.onclick = () => {
    f.offset = Math.max(0, f.offset + (+btn.dataset.hal) * f.limit);
    muatRiwayat(jenis);
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  box.querySelectorAll("[data-ubah]").forEach(btn => btn.onclick = () => (nilai ? ubahRiwayatNilai : ubahRiwayatAbsen)(d.rows[+btn.dataset.ubah]));
  box.querySelectorAll("[data-hapus]").forEach(btn => btn.onclick = () => (nilai ? hapusRiwayatNilai : hapusRiwayatAbsen)(d.rows[+btn.dataset.hapus]));
}

// Sesudah riwayat diubah: muat ulang tabel, dan data ringkas di belakang
function sesudahUbahRiwayat(jenis) { return async () => { await muatRiwayat(jenis); S.hariData = {}; S.dash = null; muatData({ latar: true }); }; }

async function ubahRiwayatNilai(r) {
  const L = levelNyata(r.p);
  const v = await dialog({
    judul: "Ubah penilaian",
    isi: '<p class="t2 mb-3"><b>' + esc(r.nm) + "</b> · " + esc(r.p) + " · " + esc(tglPanjang(r.tgl)) + "</p>" +
      '<label class="lbl" for="rwLevel">Level</label><select class="inp" id="rwLevel">' + L.map(x => '<option value="' + esc(x) + '"' + (x === r.v ? " selected" : "") + ">" + esc(x) + "</option>").join("") + "</select>" +
      (bisa("data_catatan") ? '<label class="lbl mt-3" for="rwCat">Catatan pembina</label><textarea class="inp" id="rwCat" rows="2" maxlength="500">' + esc(r.c) + "</textarea>" : "") +
      '<p class="bantu mt-3">Rekor dan poin dihitung ulang otomatis.</p>',
    tombol: [{ teks: "Batal", nilai: null }, { teks: "Simpan", nilai: true, kelas: "btn-primary", utama: true }],
    ambil: (root) => ({ level: root.querySelector("#rwLevel").value, cat: root.querySelector("#rwCat") ? root.querySelector("#rwCat").value : null })
  });
  if (!v) return;
  await aksi("editLog", [S.token, r.id, v.level, v.cat], { sesudah: sesudahUbahRiwayat("nilai") });
}

async function hapusRiwayatNilai(r) {
  const ok = await konfirmasi("Hapus penilaian", "Hapus nilai <b>" + esc(r.p) + ": " + esc(r.v) + "</b> milik <b>" + esc(r.nm) + "</b> pada " + esc(tglPanjang(r.tgl)) + "? Rekor dan poin akan dihitung ulang.", { ok: "Hapus", bahaya: true });
  if (ok) await aksi("deleteLog", [S.token, r.id], { sesudah: sesudahUbahRiwayat("nilai") });
}

async function ubahRiwayatAbsen(r) {
  let pilih = r.s;
  const v = await dialog({
    judul: "Ubah absensi",
    isi: '<p class="t2 mb-3"><b>' + esc(r.nm) + "</b> · " + esc(tglPanjang(r.tgl)) + "</p>" +
      '<div class="ab-grup" role="group" aria-label="Status kehadiran">' + STATUS_ABSEN.map(s => '<button type="button" class="ab ' + s + (s === r.s ? " on" : "") + '" data-s="' + s + '" title="' + s + '" aria-label="' + s + '">' + HURUF_ABSEN[s] + "</button>").join("") + "</div>" +
      '<label class="lbl mt-3" for="rwKet">Keterangan (untuk izin, sakit, alpa)</label><input class="inp" id="rwKet" maxlength="150" value="' + esc(r.k) + '">',
    tombol: [{ teks: "Batal", nilai: null }, { teks: "Simpan", nilai: true, kelas: "btn-primary", utama: true }],
    saatBuka: (root) => root.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {

      root.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", x === b));

}

async function hapusRiwayatAbsen(r) {
  const ok = await konfirmasi("Hapus catatan absensi", "Hapus absensi <b>" + esc(r.nm) + "</b> pada " + esc(tglPanjang(r.tgl)) + " (" + esc(r.s) + ")?", { ok: "Hapus", bahaya: true });
  if (ok) await aksi("ubahAbsen", [S.token, r.w, r.tgl, "", ""], { sesudah: sesudahUbahRiwayat("absen") });
}

async function eksporRiwayat(jenis) {
  let d;
  mulaiMuat();
  try { d = await api("getRiwayat", S.token, saringRiw(jenis, true)); }
  catch (e) { tanganiGalat(e); return; }
  finally { selesaiMuat(); }
  if (!d.rows.length) { toast("Tidak ada data untuk diunduh.", "warn"); return; }
  const cat = bisa("data_catatan"), oleh = bisa("data_penginput");
  let data, lebar, nama;
  if (jenis === "nilai") {
    data = [["Tanggal", "Hari", "ID WBP", "Nama", "Blok", "Materi", "Level", "Dibanding rekor", "Naik dihitung", "Keterangan", "Jenis"].concat(cat ? ["Catatan"] : [], oleh ? ["Diisi oleh"] : [])];
    d.rows.forEach(r => data.push([r.tgl, namaHari(r.tgl), r.w, r.nm, r.bl, r.p, r.v, r.d, r.n, r.al ? (ALASAN_NAIK[r.al] || r.al) : "", r.j].concat(cat ? [r.c] : [], oleh ? [r.o] : [])));
    lebar = [12, 9, 15, 28, 8, 10, 18, 10, 10, 24, 9].concat(cat ? [32] : [], oleh ? [14] : []);
    nama = "riwayat-penilaian";
  } else {
    data = [["Tanggal", "Hari", "ID WBP", "Nama", "Blok", "Status", "Keterangan"].concat(oleh ? ["Dicatat oleh"] : [])];
    d.rows.forEach(r => data.push([r.tgl, namaHari(r.tgl), r.w, r.nm, r.bl, r.s, r.k].concat(oleh ? [r.o] : [])));
    lebar = [12, 9, 15, 28, 8, 10, 30].concat(oleh ? [14] : []);
    nama = "riwayat-absensi";
  }
  if (d.total > d.rows.length) toast("Hanya " + angka(d.rows.length) + " dari " + angka(d.total) + " baris yang diunduh. Persempit rentang tanggal untuk sisanya.", "warn");
  unduhExcel(nama + "-" + S.hariIni + ".xlsx", [{ nama: jenis === "nilai" ? "Penilaian" : "Absensi", data: data, lebar: lebar }]);
}
// =====================================================================
//  DATA WBP: daftar, tambah/ubah (dengan jadwal hari belajar), arsip, Excel
// =====================================================================
const DB = { q: "", st: "", jk: "", hari: "", kurang: false, hal: 0, per: 50, pilih: {} };

RENDER_VIEW.database = function (sub, latar) {
  if (latar && el("dbTabel")) { gambarDatabase(); return; }
  renderDatabase();
};

function chipHari(idWadah, terpilih) {
  return '<div class="flex flex-wrap gap-1.5" id="' + idWadah + '" role="group" aria-label="Hari belajar">' + HARI.map(h => '<label class="chip-pilih' + (terpilih.indexOf(h) !== -1 ? " on" : "") + '"><input type="checkbox" class="sr-only" value="' + h + '"' +
    (terpilih.indexOf(h) !== -1 ? " checked" : "") + '><i class="fa-solid fa-check cek"></i>' + h + "</label>").join("") + "</div>";
}
function pasangChipHari(wadah) {
  wadah.querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => inp.parentElement.classList.toggle("on", inp.checked)));
}
function ambilChipHari(wadah) { return Array.from(wadah.querySelectorAll("input:checked")).map(x => x.value); }

function levelTeks(v) { return v === S.tidakIkut ? "Tidak ikut" : (v || ""); }
function levelSah(p, v) { return v === S.tidakIkut || levelNyata(p).indexOf(v) !== -1; }
function opsiLevel(p, nilai) {
  return [S.tidakIkut].concat(levelNyata(p)).map(x => '<option value="' + esc(x) + '"' + (x === nilai ? " selected" : "") + ">" + esc(levelTeks(x)) + "</option>").join("");
}
function levelPertama(p) { return levelNyata(p)[0] || S.tidakIkut; }
function levelTerakhir(p) { const L = levelNyata(p); return L[L.length - 1] || S.tidakIkut; }

const LABEL_ST_DB = { Aktif: "Aktif", "Tidak Aktif": "Tidak aktif", Lulus: "Lulus", Arsip: "Diarsipkan / keluar" };
function renderDatabase() {
  const v = el("v-database");
  const ubah = bisa("act_edit_wbp");
  const ulang = () => { DB.hal = 0; renderDatabase(); };
  const bagian = [{ k: "st", label: "Status", ikon: "fa-circle-half-stroke", pilihan: [["", "Semua (tanpa arsip)"], ["Aktif", "Aktif"], ["Tidak Aktif", "Tidak aktif"], ["Lulus", "Lulus"], ["Arsip", "Diarsipkan / keluar"]] }];
  if (S.akses === "semua") bagian.push({ k: "jk", label: "Jenis kelamin", ikon: "fa-venus-mars", pilihan: [["", "Semua"], ["L", "Putra"], ["P", "Putri"]] });
  bagian.push({ k: "hari", label: "Jadwal", ikon: "fa-calendar-week", pilihan: [["", "Semua hari"]].concat(HARI.map(h => [h, h]), [["-", "Belum ada jadwal"]]) });
  bagian.push({ k: "kurang", label: "Kelengkapan", pendek: "Data belum lengkap", ikon: "fa-circle-exclamation", centang: "Hanya yang jenis kelamin / jadwalnya belum diisi" });
  const cfg = {
    pre: "db", q: DB.q, ph: "Cari nama, blok, atau ID…", judul: "Saring data WBP", bagian: bagian, nilai: DB, jedaCari: 200,
    kanan: '<button type="button" class="btn btn-ikon shrink-0" id="dbEkspor" title="Unduh Excel (sesuai saringan)" aria-label="Unduh Excel"><i class="fa-solid fa-file-excel"></i></button>',
    cari: (q) => { DB.q = q; DB.hal = 0; gambarDatabase(); },
    terapkan: (r) => { DB.st = r.st || ""; DB.jk = r.jk || ""; DB.hari = r.hari || ""; DB.kurang = !!r.kurang; ulang(); },
    reset: () => { DB.st = ""; DB.jk = ""; DB.hari = ""; DB.kurang = false; ulang(); }
  };
  v.innerHTML = kepalaHal("Data WBP", "Nama, jenis kelamin, jadwal hari belajar, level awal, dan target tiap materi.",
    (ubah ? '<button type="button" class="btn btn-primary" id="dbTambah"><i class="fa-solid fa-user-plus"></i>Tambah</button>' : "")) +
    '<div class="mb-4">' + htmlSaring(cfg) + "</div>" +
    '<div id="dbMassal"></div><div id="dbTabel"></div>';
  pasangSaring(cfg);
  el("dbEkspor").onclick = eksporDatabase;
  if (ubah) el("dbTambah").onclick = () => dialogWbp("");
  pasangTabelDb(el("dbTabel"));
  gambarDatabase();
}

function saringDb() {
  const q = normCari(DB.q);
  return (S.wbps || []).filter(w => {
    if (DB.st === "Arsip") { if (!w.ar) return false; }
    else { if (w.ar) return false; if (DB.st && w.st !== DB.st) return false; }
    if (DB.jk && w.jk !== DB.jk) return false;
    const hr = w.hr || [];
    if (DB.kurang && w.jk && hr.length) return false;
    if (DB.hari === "-" ? hr.length > 0 : (DB.hari && hr.indexOf(DB.hari) === -1)) return false;
    if (q && normCari(w.nm).indexOf(q) === -1 && normCari(w.bl).indexOf(q) === -1 && normCari(w.id).indexOf(q) === -1) return false;
    return true;
  }).sort((a, b) => a.nm.localeCompare(b.nm));
}

function gambarDatabase() {
  const box = el("dbTabel");
  if (!box) return;
  const rows = saringDb();
  const ubah = bisa("act_edit_wbp");
  Object.keys(DB.pilih).forEach(id => { if (!S.wbpMap[id]) delete DB.pilih[id]; });
  if (!rows.length) {
    box.innerHTML = '<div class="card kosong-isi">' + ((S.wbps || []).length ? "Tidak ada WBP yang cocok dengan saringan." :
      "Belum ada data WBP." + (ubah ? '<div class="mt-3"><button type="button" class="btn btn-primary" data-db="tambah"><i class="fa-solid fa-user-plus"></i>Tambah WBP</button></div>' : "")) + "</div>";
    gambarMassal();
    return;
  }
  const nHal = Math.ceil(rows.length / DB.per);
  if (DB.hal >= nHal) DB.hal = nHal - 1;
  const isi = rows.slice(DB.hal * DB.per, DB.hal * DB.per + DB.per);
  const semua = isi.every(w => DB.pilih[w.id]);
  box.innerHTML =
    (ubah ? '<label class="flex items-center gap-2 kecil t2 mb-2 ml-1 cursor-pointer"><input type="checkbox" data-db="pilih-hal"' + (semua ? " checked" : "") + ">Pilih semua di halaman ini</label>" : "") +
    '<div class="daftar">' + isi.map(w => barisDb(w, ubah)).join("") + "</div>" +
    '<div class="flex flex-wrap items-center justify-between gap-3 mt-3"><div class="kecil t2">' + angka(rows.length) + " WBP" +
    (nHal > 1 ? " · halaman " + (DB.hal + 1) + " dari " + nHal : "") +
    (ubah && semua && rows.length > isi.length && !rows.every(w => DB.pilih[w.id]) ? ' · <button type="button" class="t-accent font-semibold" data-db="pilih-semua">Pilih semua ' + angka(rows.length) + "</button>" : "") + "</div>" +
    (nHal > 1 ? '<div class="flex gap-2"><button type="button" class="btn btn-sm" data-hal="-1"' + (DB.hal <= 0 ? " disabled" : "") + '><i class="fa-solid fa-chevron-left"></i>Sebelumnya</button>' +
      '<button type="button" class="btn btn-sm" data-hal="1"' + (DB.hal >= nHal - 1 ? " disabled" : "") + '>Berikutnya<i class="fa-solid fa-chevron-right"></i></button></div>' : "") + "</div>";
  gambarMassal();
}

function barisDb(w, ubah) {
  const id = esc(w.id);
  const warnaSt = { "Aktif": "b-ok", "Tidak Aktif": "b-bad", "Lulus": "b-gold", "Arsip": "b-muted" }[w.st] || "b-muted";
  const kurang = [!w.jk ? "JK belum diisi" : "", !(w.hr || []).length ? "jadwal belum ada" : ""].filter(Boolean);
  const sub = [w.jk === "P" ? "Putri" : w.jk === "L" ? "Putra" : "", w.bl ? "Blok " + w.bl : "", w.kl ? "keluar " + tglPendek(w.kl[0]) + " (" + w.kl[1] + ")" : (w.hr || []).join(", ")].filter(Boolean).join(" · ");
  return '<div class="baris' + (DB.pilih[w.id] ? " selesai" : "") + '">' +
    (ubah ? '<input type="checkbox" data-pilih="' + id + '" aria-label="Pilih ' + esc(w.nm) + '"' + (DB.pilih[w.id] ? " checked" : "") + ' style="width:18px;height:18px">' : "") +
    '<button type="button" class="flex items-center gap-3 min-w-0 flex-1 text-left" data-kartu="' + id + '">' + avatar(w, 36) +
    '<div class="min-w-0"><div class="nm truncate">' + esc(w.nm) + '</div><div class="mini muted truncate">' + esc(sub) +
    (kurang.length ? ' <span class="t-warn">· ' + esc(kurang.join(", ")) + "</span>" : "") + "</div></div></button>" +
    '<span class="badge ' + warnaSt + ' hidden sm:inline-flex"' + (w.kl ? ' title="' + esc("Keluar " + tglPendek(w.kl[0]) + ": " + w.kl[1]) + '"' : "") + ">" + esc(w.kl ? (w.kl[1] || "Keluar").split(" - ")[0] : w.st) + "</span>" +
    (ubah ? '<button type="button" class="btn btn-ghost btn-sm btn-ikon" data-ubah="' + id + '" title="Ubah data" aria-label="Ubah data ' + esc(w.nm) + '"><i class="fa-solid fa-pen"></i></button>' : "") + "</div>";
}

function pasangTabelDb(box) {
  box.onclick = (ev) => {
    const t = ev.target.closest("button");
    if (!t || !box.contains(t)) return;
    const d = t.dataset;
    if (d.kartu) dialogKartuWbp(d.kartu);
    else if (d.ubah) dialogWbp(d.ubah);
    else if (d.hal) { DB.hal = Math.max(0, DB.hal + (+d.hal)); gambarDatabase(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (d.db === "tambah") dialogWbp("");
    else if (d.db === "pilih-semua") { saringDb().forEach(w => { DB.pilih[w.id] = true; }); gambarDatabase(); }
  };
  box.onchange = (ev) => {
    const t = ev.target;
    if (t.dataset.pilih) {
      if (t.checked) DB.pilih[t.dataset.pilih] = true; else delete DB.pilih[t.dataset.pilih];
      t.closest(".baris").classList.toggle("selesai", t.checked);
      gambarMassal();
    } else if (t.dataset.db === "pilih-hal") {
      const isi = saringDb().slice(DB.hal * DB.per, DB.hal * DB.per + DB.per);
      isi.forEach(w => { if (t.checked) DB.pilih[w.id] = true; else delete DB.pilih[w.id]; });
      gambarDatabase();
    }
  };
}

// ---------- Aksi massal ----------
function gambarMassal() {
  const box = el("dbMassal");
  if (!box) return;
  const ids = Object.keys(DB.pilih).filter(id => S.wbpMap[id]);
  if (!ids.length || !bisa("act_edit_wbp")) { box.innerHTML = ""; return; }
  const adaArsip = ids.some(id => S.wbpMap[id].ar);
  box.innerHTML = '<div class="card card-pad mb-4 flex flex-wrap items-center gap-2" style="border-color:var(--accent)">' +
    '<b class="mr-2"><i class="fa-solid fa-square-check t-accent mr-1"></i>' + ids.length + " dipilih</b>" +
    '<button type="button" class="btn btn-sm" id="dbMHari"><i class="fa-solid fa-calendar-week"></i>Atur jadwal</button>' +
    '<select class="inp inp-sm" style="width:auto" id="dbMJk" aria-label="Atur jenis kelamin"><option value="">Jenis kelamin…</option><option value="L">Laki-laki</option>' +
    (S.akses === "semua" ? '<option value="P">Perempuan</option>' : "") + "</select>" +
    (adaArsip ? '<button type="button" class="btn btn-sm" id="dbMPulih"><i class="fa-solid fa-box-open"></i>Pulihkan</button>'
      : '<button type="button" class="btn btn-sm" id="dbMArsip"><i class="fa-solid fa-box-archive"></i>Arsipkan</button>') +
    '<button type="button" class="btn btn-ghost btn-sm ml-auto" id="dbMBatal">Batal</button></div>';
  const selesai = async () => { DB.pilih = {}; await muatData({ latar: true }); };
  const jalan = async (aksiNama, nilai, judul, isi) => {
    const ok = await konfirmasi(judul, isi, { ok: "Lanjutkan" });
    if (!ok) { gambarMassal(); return; }
    await aksi("bulkUpdateWBP", [S.token, ids, aksiNama, nilai], { sesudah: selesai });
  };
  el("dbMJk").onchange = (ev) => {
    const v = ev.target.value;
    if (v) jalan("jk", v, "Atur jenis kelamin", ids.length + " WBP akan ditetapkan sebagai <b>" + (v === "P" ? "perempuan" : "laki-laki") + "</b>.");
  };
  if (el("dbMArsip")) el("dbMArsip").onclick = () => jalan("arsip", true, "Arsipkan WBP", ids.length + " WBP akan diarsipkan (misalnya sudah bebas atau pindah). Riwayatnya tetap tersimpan dan bisa dipulihkan.");
  if (el("dbMPulih")) el("dbMPulih").onclick = () => jalan("arsip", false, "Pulihkan dari arsip", ids.length + " WBP akan dikembalikan ke daftar aktif.");
  el("dbMBatal").onclick = () => { DB.pilih = {}; gambarDatabase(); };
  el("dbMHari").onclick = async () => {
    const hari = await dialog({
      judul: "Jadwal belajar " + ids.length + " WBP",
      isi: '<p class="kecil t2 mb-3">Centang hari belajarnya. Pada hari itu nama mereka otomatis muncul di Absensi dan Monitoring.</p>' + chipHari("mHari", []),
      tombol: [{ teks: "Batal", nilai: null }, { teks: "Simpan", nilai: true, kelas: "btn-primary", utama: true }],
      saatBuka: (root) => pasangChipHari(root.querySelector("#mHari")),
      ambil: (root) => {
        const h = ambilChipHari(root.querySelector("#mHari"));
        if (!h.length) throw new Error("Pilih minimal satu hari.");
        return { h: h };
      }
    });
    if (!hari) return;
    await aksi("bulkUpdateWBP", [S.token, ids, "hari", hari.h], { sesudah: selesai });
  };
}

// ---------- Tambah / ubah satu WBP ----------
async function dialogWbp(id) {
  const w = id ? S.wbpMap[id] : null;
  if (id && !w) return;
  const bolehNama = !w || bisa("data_nama_lengkap");
  const blok = bisa("data_alamat_blok");
  const aw = PROGRAM.map((p, i) => w ? (levelSah(p, w.aw[i]) ? w.aw[i] : S.tidakIkut) : levelPertama(p));
  const tg = PROGRAM.map((p, i) => {
    if (w && levelSah(p, w.tg[i]) && !(w.tg[i] === S.tidakIkut && aw[i] !== S.tidakIkut)) return w.tg[i];
    return aw[i] === S.tidakIkut ? S.tidakIkut : levelTerakhir(p);
  });
  const jkAwal = w ? w.jk : (S.akses === "semua" ? "" : "L");
  const opsiJk = '<option value="">— pilih —</option><option value="L"' + (jkAwal === "L" ? " selected" : "") + ">Laki-laki</option>" +
    (S.akses === "semua" ? '<option value="P"' + (jkAwal === "P" ? " selected" : "") + ">Perempuan</option>" : "");
  const isi =
    '<div class="grid gap-4">' +
    '<div><label class="lbl" for="fwNama">Nama lengkap</label><input class="inp" id="fwNama" maxlength="120" value="' + esc(w ? w.nm : "") + '"' + (bolehNama ? "" : " disabled") + ">" +
    (bolehNama ? "" : '<div class="bantu">Nama disamarkan untuk akun Anda sehingga tidak bisa diubah di sini.</div>') + "</div>" +
    '<div class="grid sm:grid-cols-2 gap-4"><div><label class="lbl" for="fwJk">Jenis kelamin</label><select class="inp" id="fwJk">' + opsiJk + "</select></div>" +
    '<div><label class="lbl" for="fwTm">Tanggal mulai ikut pembinaan</label><input type="date" class="inp" id="fwTm" value="' + esc(w ? (w.tm || "") : S.hariIni) + '" max="' + S.hariIni + '"></div></div>' +
    '<div><div class="lbl">Jadwal hari belajar</div>' + chipHari("fwHari", w ? (w.hr || []) : []) +
    '<div class="bantu">Pada hari yang dicentang, nama WBP ini otomatis muncul di Absensi dan Monitoring.</div></div>' +
    (blok ? '<div class="grid sm:grid-cols-[140px_1fr] gap-4"><div><label class="lbl" for="fwBl">Blok / kamar</label><input class="inp" id="fwBl" maxlength="40" value="' + esc(w ? (w.bl || "") : "") + '"></div>' +
      '<div><label class="lbl" for="fwAl">Alamat asal</label><input class="inp" id="fwAl" maxlength="200" value="' + esc(w ? (w.al || "") : "") + '"></div></div>' : "") +
    '<div><div class="lbl">Level per materi</div><div class="panel-2 p-3 grid gap-3">' +
    '<div class="grid grid-cols-[72px_1fr_1fr] gap-2 mini muted font-semibold"><span>Materi</span><span>Level awal</span><span>Target</span></div>' +
    PROGRAM.map((p, i) => '<div class="grid grid-cols-[72px_1fr_1fr] gap-2 items-center"><b class="kecil">' + p + "</b>" +
      '<select class="inp inp-sm" id="fwAw' + i + '" aria-label="Level awal ' + p + '">' + opsiLevel(p, aw[i]) + "</select>" +
      '<select class="inp inp-sm" id="fwTg' + i + '" aria-label="Target ' + p + '">' + opsiLevel(p, tg[i]) + "</select>" +
      (w && ikutMateri(w, p) ? '<div class="col-start-2 col-span-2 mini muted">sekarang ' + esc(w.sk[i]) + (w.rk[i] && w.rk[i] !== w.sk[i] ? " · rekor " + esc(w.rk[i]) : "") + "</div>" : "") + "</div>").join("") +
    '</div><div class="bantu">Level awal = hasil asesmen saat mulai ikut. Pilih "Tidak ikut" bila WBP tidak mengikuti materi itu.</div></div>' +
    "</div>";
  const tombol = [{ teks: "Batal", nilai: null }];
  if (w) {
    if (bisa("act_delete_wbp")) tombol.unshift({ teks: '<i class="fa-solid fa-trash-can"></i><span class="lbl-tombol">Hapus</span>', nilai: "hapus", kelas: "btn-danger mr-auto", ringkas: "Hapus" });
    tombol.splice(tombol.length - 1, 0, { teks: w.ar ? '<i class="fa-solid fa-box-open"></i><span class="lbl-tombol">Pulihkan</span>' : '<i class="fa-solid fa-box-archive"></i><span class="lbl-tombol">Arsipkan</span>', nilai: "arsip", ringkas: w.ar ? "Pulihkan" : "Arsipkan" });
  }
  tombol.push({ teks: w ? "Simpan" : "Tambahkan", nilai: "simpan", kelas: "btn-primary", utama: true });

  const hasil = await dialog({
    judul: w ? "Ubah data WBP" : "Tambah WBP",
    lebar: 620, isi: isi, tombol: tombol,
    saatBuka: (root) => {
      pasangChipHari(root.querySelector("#fwHari"));
      PROGRAM.forEach((p, i) => {
        const a = root.querySelector("#fwAw" + i), t = root.querySelector("#fwTg" + i);
        a.onchange = () => {
          if (a.value === S.tidakIkut) t.value = S.tidakIkut;
          else if (t.value === S.tidakIkut) t.value = levelTerakhir(p);
        };
      });
    },
    ambil: async (root, nilai) => {
      if (nilai === "hapus" || nilai === "arsip") return nilai;
      const nama = root.querySelector("#fwNama").value.trim();
      if (bolehNama && !nama) throw new Error("Nama wajib diisi.");
      const d = {
        id: w ? w.id : "", nama: nama, jk: root.querySelector("#fwJk").value,
        tm: root.querySelector("#fwTm").value, aw: {}, tg: {}, hari: ambilChipHari(root.querySelector("#fwHari"))
      };
      if (!d.jk) throw new Error("Pilih jenis kelamin.");
      if (!d.hari.length) throw new Error("Pilih minimal satu hari jadwal belajar.");
      if (blok) { d.bl = root.querySelector("#fwBl").value.trim(); d.al = root.querySelector("#fwAl").value.trim(); }
      for (let i = 0; i < PROGRAM.length; i++) {
        const p = PROGRAM[i];
        let a = root.querySelector("#fwAw" + i).value, t = root.querySelector("#fwTg" + i).value;
        if (a === S.tidakIkut) t = S.tidakIkut;
        else if (t === S.tidakIkut) throw new Error("Target " + p + " wajib diisi karena WBP mengikuti materi ini.");
        d.aw[p] = a; d.tg[p] = t;
      }
      return await simpanDariDialog(root, "saveWBP", [S.token, d]);
    }
  });
  if (!hasil) return;
  if (hasil === "hapus") { hapusWbp(w); return; }
  if (hasil === "arsip") {
    await aksi("bulkUpdateWBP", [S.token, [w.id], "arsip", !w.ar], { sesudah: () => muatData({ latar: true }) });
    return;
  }
  toast(hasil.message || "Tersimpan.", "ok");
  await muatData({ latar: true });
}

async function hapusWbp(w) {
  const v = await dialog({
    judul: '<i class="fa-solid fa-triangle-exclamation t-bad mr-2"></i>Hapus permanen',
    isi: '<p class="t2">Data <b>' + esc(w.nm) + "</b> beserta seluruh riwayat penilaian dan absensinya akan dihapus permanen.</p>" +
      '<p class="t2 mt-2">Jika WBP sudah bebas atau pindah, sebaiknya <b>arsipkan</b> saja agar riwayatnya tetap ada.</p>' +
      '<label class="lbl mt-3" for="konfHapus">Ketik HAPUS untuk melanjutkan</label><input class="inp" id="konfHapus" autocomplete="off">',
    tombol: [{ teks: "Batal", nilai: null }].concat(w.ar ? [] : [{ teks: "Arsipkan saja", nilai: "arsip" }]).concat([{ teks: "Hapus permanen", nilai: "hapus", kelas: "btn-danger" }]),
    ambil: (root, nilai) => {
      if (nilai === "arsip") return "arsip";
      if (root.querySelector("#konfHapus").value.trim().toUpperCase() !== "HAPUS") throw new Error("Ketik HAPUS terlebih dahulu.");
      return "hapus";
    }
  });
  if (v === "arsip") await aksi("bulkUpdateWBP", [S.token, [w.id], "arsip", true], { sesudah: () => muatData({ latar: true }) });
  if (v === "hapus") await aksi("deleteWBP", [S.token, w.id], { sesudah: () => { delete DB.pilih[w.id]; S.hariData = {}; return muatData({ latar: true }); } });
}

// ---------- Unduh Excel ----------
function eksporDatabase() {
  const rows = saringDb();
  if (!rows.length) { toast("Tidak ada data untuk diunduh.", "warn"); return; }
  const blok = bisa("data_alamat_blok");
  const judul = ["ID_WBP", "Nama", "Jenis Kelamin", "Hari Belajar"].concat(blok ? ["Blok", "Alamat"] : [], ["Tanggal Masuk"]);
  PROGRAM.forEach(p => judul.push("Level Awal " + p, "Target " + p, "Level Sekarang " + p));
  judul.push("Status", "Terakhir Dinilai", "Terakhir Hadir");
  const data = [judul];
  rows.forEach(w => {
    const r = [w.id, w.nm, w.jk, (w.hr || []).join(", ")].concat(blok ? [w.bl || "", w.al || ""] : [], [w.tm || ""]);
    PROGRAM.forEach((p, i) => r.push(levelTeks(w.aw[i]), levelTeks(w.tg[i]), ikutMateri(w, p) ? w.sk[i] : ""));
    r.push(w.st, w.ld || "", w.lh || "");
    data.push(r);
  });
  const lebar = [15, 30, 8, 24].concat(blok ? [9, 26] : [], [13]).concat(PROGRAM.map(() => [18, 18, 18]).reduce((a, b) => a.concat(b), []), [12, 14, 14]);
  unduhExcel("data-wbp-" + S.hariIni + ".xlsx", [{ nama: "Data WBP", data: data, lebar: lebar }]);
}

function medan(nama, label, nilai, o) {
  o = o || {};
  return '<div><label class="lbl" for="f-' + nama + '">' + label + '</label><input class="inp" id="f-' + nama + '" name="' + nama + '" value="' + esc(nilai) + '"' +
    (o.maks ? ' maxlength="' + o.maks + '"' : "") + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : "") + ">" + (o.bantu ? '<div class="bantu">' + o.bantu + "</div>" : "") + "</div>";
}
function medanAngka(nama, label, nilai, satuan, min, max, bantu) {
  return '<div><label class="lbl" for="f-' + nama + '">' + label + '</label><div class="flex items-center gap-2"><input type="number" inputmode="numeric" class="inp" style="width:100px" id="f-' + nama + '" name="' + nama + '" value="' + esc(nilai) + '" min="' + min + '" max="' + max + '" step="1">' +
    '<span class="kecil t2">' + satuan + "</span></div>" + (bantu ? '<div class="bantu">' + bantu + "</div>" : "") + "</div>";
}
function ambilForm(form) {
  const o = {};
  form.querySelectorAll("[name]").forEach(x => { o[x.name] = x.type === "checkbox" ? x.checked : x.value; });
  return o;
}
function sandiAcak() {
  const huruf = "abcdefghjkmnpqrstuvwxyz23456789";
  const a = new Uint32Array(10);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.from(a).map(x => huruf[x % huruf.length]).join("");
}

    (baru ? '<div><label class="lbl" for="uPass">Password awal</label><div class="flex gap-2"><input class="inp" id="uPass" maxlength="60" value="' + sandiAcak() + '" autocomplete="off"><button type="button" class="btn btn-ikon" id="uAcak" title="Buat password acak" aria-label="Buat password acak"><i class="fa-solid fa-dice"></i></button></div><div class="bantu">Minimal 6 karakter.</div></div>' : "") +
    "</div>";
  const v = await dialog({
    judul: baru ? "Tambah pengguna" : "Ubah pengguna", lebar: 520, isi: isi,
    tombol: [{ teks: "Batal", nilai: null }, { teks: baru ? "Tambahkan" : "Simpan", nilai: true, kelas: "btn-primary", utama: true }],
    saatBuka: (root) => {
      pasangPengecualian(root);
      const info = () => {
        root.querySelector("#uAksesWadah").classList.toggle("hidden", peran === "admin");
        root.querySelector("#uInfo").textContent = peran === "admin" ? "Admin dapat membuka Pengaturan dan menangani semua WBP."
          : jk === "P" ? "Guru perempuan dapat menangani WBP putra dan putri." : jk === "L" ? "Guru laki-laki hanya menangani WBP putra." : "Jenis kelamin menentukan WBP yang boleh ditangani.";
      };
      const pasang = (id, set) => root.querySelectorAll("#" + id + " button").forEach(b => b.onclick = () => {
        set(b.dataset.v);
        root.querySelectorAll("#" + id + " button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
        info();
      });
      pasang("uPeran", (x) => { peran = x; });
      pasang("uJk", (x) => { jk = x; });
      if (root.querySelector("#uAcak")) root.querySelector("#uAcak").onclick = () => { root.querySelector("#uPass").value = sandiAcak(); };
      info();
    },
    ambil: async (root) => {
      const nama = root.querySelector("#uNama").value.trim();
      if (!nama) throw new Error("Nama wajib diisi.");
      if (!jk) throw new Error("Pilih jenis kelamin pengguna.");
      if (baru) {
        const data = { username: root.querySelector("#uUser").value.trim(), nama: nama, role: peran, jk: jk, password: root.querySelector("#uPass").value, akses: ambilPengecualian(root) };
        if (!/^[a-zA-Z0-9._-]{3,30}$/.test(data.username)) throw new Error("Username 3 sampai 30 karakter: huruf, angka, titik, strip, atau garis bawah.");
        if (data.password.length < 6) throw new Error("Password minimal 6 karakter.");
        const r = await simpanDariDialog(root, "addUser", [S.token, data]);
        r.sandi = data.password; r.username = data.username;
        return r;
      }
      return await simpanDariDialog(root, "updateUser", [S.token, { username: u.username, nama: nama, role: peran, jk: jk, akses: ambilPengecualian(root) }]);
    }
  });
  if (!v) return;
  if (v.sandi) await infoDialog("Pengguna ditambahkan", "Sampaikan langsung kepada yang bersangkutan:<div class=\"panel-2 p-3 mt-3 kecil\">Username: <b>" + esc(v.username) + "</b><br>Password: <b class=\"num\" style=\"font-size:18px\">" + esc(v.sandi) + "</b></div>", "ok");
  else toast(v.message || "Tersimpan.", "ok");
  await sesudahAdmin(false);
}

async function dialogSandiPengguna(u) {

function pasangPengecualian(root) {

  if (!w) return;
  const hitung = () => {
    let n = 0;
    w.querySelectorAll("[data-akses]").forEach(c => { const beda = c.checked !== (c.dataset.bawaan === "1"); c.closest(".cek-akses").classList.toggle("beda", beda); if (beda) n++; });
    w.querySelector("#uAksesJml").innerHTML = labelJmlKhusus(n);
  };
  w.addEventListener("change", hitung);
  w.querySelector("#uAksesAwal").onclick = () => { w.querySelectorAll("[data-akses]").forEach(c => { c.checked = c.dataset.bawaan === "1"; }); hitung(); };
}
function ambilPengecualian(root) {
  const a = {};
  root.querySelectorAll("[data-akses]").forEach(c => { if (c.checked !== (c.dataset.bawaan === "1")) a[c.dataset.akses] = c.checked; });
  return a;
}

// Logo: diperkecil di perangkat lalu disimpan sebagai gambar langsung (tanpa link)
function kecilkanLogo(berkas) {
  return new Promise((ok, gagal) => {
    if (!/^image\//.test(berkas.type)) { gagal(new Error("Pilih berkas gambar (PNG atau JPG).")); return; }
    if (berkas.size > 15 * 1024 * 1024) { gagal(new Error("Gambar terlalu besar (maks 15 MB).")); return; }
    const url = URL.createObjectURL(berkas);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const coba = (ukuran) => {
        const r = Math.min(1, ukuran / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        const x = c.getContext("2d");
        x.imageSmoothingQuality = "high";
        x.drawImage(img, 0, 0, c.width, c.height);
        let hasil = c.toDataURL("image/webp", 0.9);
        if (!/^data:image\/webp/.test(hasil) || hasil.length > 45000) { const png = c.toDataURL("image/png"); if (png.length < hasil.length || !/^data:image\/webp/.test(hasil)) hasil = png; }
        return hasil;
      };
      for (const u of [192, 160, 128, 96, 72]) { const h = coba(u); if (h.length <= 45000) { ok(h); return; } }
      gagal(new Error("Gambar terlalu rumit untuk dijadikan logo. Coba gambar lain."));
    };
    img.onerror = () => { URL.revokeObjectURL(url); gagal(new Error("Gambar tidak bisa dibaca.")); };
    img.src = url;
  });
}
// =====================================================================
//  MEMUAT DATA, MASUK / KELUAR, GANTI SANDI, MULAI
// =====================================================================
const VERSI_UI = "9.0";
let _muatMinta = 0, _peringatanVersi = false, _sandiTerbuka = false;

// ---------- Salinan data di HP: halaman langsung tampil, data terbaru menyusul di belakang ----------
// Salinan disimpan per akun (bukan per token), jadi tetap terpakai setelah login ulang di HP yang sama.
const KUNCI_CACHE = "cm_cache6";
function akunToken(t) { const b = String(t || "").split(":"); try { return b.length === 4 ? decodeURIComponent(b[1]) : ""; } catch (e) { return ""; } }
function tglLokal() { try { return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Makassar" }); } catch (e) { return ""; } }
function simpanCache(d) {
  if (!d || (d.session && d.session.wajibGanti)) return;
  try { localStorage.setItem(KUNCI_CACHE, JSON.stringify({ u: akunToken(S.token), t: Date.now(), d: d })); }
  catch (e) { hapusCache(); }
}
function bacaCache() {
  try {
    const c = JSON.parse(localStorage.getItem(KUNCI_CACHE) || "null");
    if (!c || !c.d || c.u !== akunToken(S.token) || Date.now() - c.t > 30 * 86400000 || c.d.versi !== VERSI_UI) return null;
    const d = c.d, kini = tglLokal();
    if (kini && d.hariIni && d.hariIni !== kini) {
      // Salinan hari sebelumnya tetap ditampilkan (cepat), tetapi isian harian dimuat segar
      return Object.assign({}, d, { hariIni: kini > d.hariIni ? kini : d.hariIni, hari: null, _usang: true });
    }
    return d;
  } catch (e) { return null; }
}
function hapusCache() { simpanLokal(KUNCI_CACHE, null); simpanLokal("cm_dash6", null); }

// opsi: { segar: baca langsung dari spreadsheet, latar: tanpa layar memuat, bar: tampilkan bilah memuat }
async function muatData(opsi) {
  opsi = opsi || {};
  const minta = ++_muatMinta;
  const mulai = Date.now();
  const bar = !opsi.latar || !!opsi.bar;
  if (bar) mulaiMuat();
  try {
    const d = await api("getAppData", S.token, !!opsi.segar);
    if (minta !== _muatMinta) return;
    terapkanData(d, Object.assign({}, opsi, { mulai: mulai }));
  } catch (e) {
    if (minta !== _muatMinta) return;
    if (opsi.latar) { console.warn("Penyegaran latar gagal:", e); return; }
    const awal = el("memuatAwal");
    if (awal && !awal.classList.contains("hidden")) {
      awal.innerHTML = '<div class="card card-pad max-w-lg mx-auto text-left"><div class="font-bold mb-2"><i class="fa-solid fa-triangle-exclamation t-warn mr-2"></i>Data belum bisa dimuat</div>' +
        '<p class="kecil t2 mb-4">' + esc(pesanGalat(e)) + '</p><button class="btn btn-primary" onclick="location.reload()"><i class="fa-solid fa-rotate"></i>Coba lagi</button></div>';
      selesaiMuat(true);
      return;
    }
    tanganiGalat(e);
  } finally {
    if (bar) selesaiMuat();
  }
}

function terapkanData(d, opsi) {
  opsi = opsi || {};
  if (d.tokenKadaluarsa && S.token) {
    S.token = "";
    simpanSesi("cm_token", "");
    hapusCache();
    toast("Sesi login berakhir. Silakan masuk lagi.", "warn");
  }
  if (!opsi.dariCache && !(opsi.mulai && KIRIM.okTerakhir > opsi.mulai)) simpanCache(d);
  const akunLama = (S.sesi ? S.sesi.username : "") + "|" + S.role + "|" + S.akses;
  S.sesi = d.session || null;
  // login diperpanjang otomatis oleh server: simpan token barunya
  if (d.tokenBaru && S.token && akunToken(d.tokenBaru) === akunToken(S.token)) { S.token = d.tokenBaru; simpanSesi("cm_token", d.tokenBaru); }
  S.menunggu = d.menunggu || 0;
  S.role = d.role || "umum";
  S.perms = d.perms || {};
  S.akses = d.akses || "L";
  S.set = d.settings || {};
  S.levels = d.levels || {};
  S.tidakIkut = d.tidakIkut || S.tidakIkut;
  S.hariIni = d.hariIni || S.hariIni;
  S.dataTgl = d._usang ? "" : (d.hariIni || "");      // tanggal acuan level "sebelumnya" di daftar WBP
  if (!S.tgl || S.tgl > S.hariIni) S.tgl = S.hariIni;
  S.libur = d.libur || [];
  S.ganti = d.ganti || [];
  S.meta = d.meta || {};
  S.wbps = d.wbps || [];
  S.wbpMap = {};
  S.wbps.forEach(w => { S.wbpMap[w.id] = w; });
  const akunBaru = (S.sesi ? S.sesi.username : "") + "|" + S.role + "|" + S.akses;
  const gantiAkun = akunLama !== akunBaru;
  if (gantiAkun) { S.hariData = {}; S.dash = null; }
  // Bila ada isian yang terkirim selagi data ini dimuat, isian hari ini di HP lebih baru: jangan ditimpa
  const usang = d.hari && opsi.mulai && KIRIM.okTerakhir > opsi.mulai && S.hariData[d.hari.tgl] && !gantiAkun;
  if (d.hari && !usang) { d.hari._v = d._v; S.hariData[d.hari.tgl] = d.hari; terapkanAntre(d.hari.tgl); }
  S.appV = d._v || null;
  // data tanggal lain yang tersimpan sementara dibuang agar dimuat ulang saat dibuka
  Object.keys(S.hariData).forEach(t => { if (!d.hari || t !== d.hari.tgl) delete S.hariData[t]; });
  S.dimuat = new Date();

  terapkanMerek();
  perbaruiAkun();
  el("memuatAwal").classList.add("hidden");
  const kaki = el("kaki");
  kaki.innerHTML = esc((S.set.institusi || "") + " · " + (S.set.app_name || "")) + ' · versi <span class="num">' + esc(d.versi || "?") + "</span>";
  kaki.classList.remove("hidden");
  if (d.versi && d.versi !== VERSI_UI && !_peringatanVersi) {
    _peringatanVersi = true;
    toast("Versi Code.gs (" + d.versi + ") berbeda dengan Index.html (" + VERSI_UI + "). Perbarui kedua file lalu deploy ulang.", "warn");
  }
  if (S.sesi && S.sesi.wajibGanti) {
    tampilkanView("");
    el("menuSisi").innerHTML = "";
    el("menuBawah").innerHTML = "";
    dialogGantiSandi(true);
    return;
  }
  if (S.token) kirimJalan();
  if (opsi.tetap) { renderMenu(); return; }
  if (opsi.latar && !gantiAkun && S.view && viewBoleh(S.view)) {
    renderMenu();
    if (RENDER_VIEW[S.view]) RENDER_VIEW[S.view](S.sub, true);
    return;
  }
  if (!menuBoleh().length) { tampilkanView("kosong"); return; }
  // halaman dimuat ulang: kembali ke halaman (dan posisi) terakhir, bukan ke halaman awal
  const akhir = !S.view ? halamanTerakhir() : null;
  if (akhir) {
    buka(akhir.v, akhir.s || "");
    if (akhir.y && akhir.t && Date.now() - akhir.t < 6 * 3600000) setTimeout(() => window.scrollTo(0, akhir.y), 350);
    return;
  }
  const v = (!gantiAkun && S.view && viewBoleh(S.view)) ? S.view : viewPertama();
  buka(v, (!gantiAkun && v === S.view) ? S.sub : "");
}

// ---------- Masuk / keluar ----------
function dialogMasuk(opsi) {
  opsi = opsi || {};
  return dialog({
    judul: '<i class="fa-solid fa-right-to-bracket t-accent mr-2"></i>Masuk',
    lebar: 420,
    isi: '<div class="grid gap-3">' +
      '<div><label class="lbl" for="lgUser">Username</label><input class="inp" id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false"></div>' +
      '<div><label class="lbl" for="lgPass">Password</label><div class="relative"><input class="inp" style="padding-right:46px" id="lgPass" type="password" autocomplete="current-password">' +
      '<button type="button" class="btn btn-ghost btn-sm btn-ikon absolute right-1 top-1" id="lgLihat" aria-label="Tampilkan password"><i class="fa-solid fa-eye"></i></button></div></div>' +
      '<p class="bantu">Lupa password? Minta admin mengatur ulang dari Pengaturan → Pengguna.</p>' +
      '<div class="daftar-ajak">Belum punya akun? <button type="button" class="t-accent font-semibold" id="lgDaftar">Daftar di sini</button></div></div>',
    tombol: [{ teks: "Batal", nilai: null }, { teks: "Masuk", nilai: true, kelas: "btn-primary", utama: true }],
    saatBuka: (root) => {
      root.querySelector("#lgDaftar").onclick = () => { root._tutup(null); dialogDaftar(); };
      root.querySelector("#lgLihat").onclick = () => {
        const p = root.querySelector("#lgPass");
        const lihat = p.type === "password";
        p.type = lihat ? "text" : "password";
        root.querySelector("#lgLihat").innerHTML = '<i class="fa-solid ' + (lihat ? "fa-eye-slash" : "fa-eye") + '"></i>';
      };
    },
    ambil: async (root) => {
      const u = root.querySelector("#lgUser").value.trim(), p = root.querySelector("#lgPass").value;
      if (!u || !p) throw new Error("Isi username dan password.");
      const r = await simpanDariDialog(root, "login", [u, p]);
      S.token = r.token;
      simpanSesi("cm_token", r.token);
      return true;
    }
  }).then(async ok => {
    if (!ok) return;
    await muatData({ tetap: !!opsi.tetap, latar: !!opsi.tetap, bar: true });
    if (S.sesi && !S.sesi.wajibGanti) toast("Selamat datang, " + S.sesi.nama + ".", "ok");
  });
}

async function keluar() {
  const t = S.token;
  S.token = "";
  simpanSesi("cm_token", "");
  hapusCache();
  try { if (t) await api("logout", t); } catch (e) { /* abaikan */ }
  await muatData();
  toast("Anda sudah keluar.", "info");
}

function dialogGantiSandi(wajib) {
  if (_sandiTerbuka) return Promise.resolve();
  _sandiTerbuka = true;
  const medanSandi = (id, label, auto) => '<div><label class="lbl" for="' + id + '">' + label + '</label><input class="inp" id="' + id + '" type="password" autocomplete="' + auto + '"></div>';
  return dialog({
    judul: '<i class="fa-solid fa-key t-accent mr-2"></i>' + (wajib ? "Buat password baru" : "Ganti password"),
    kunci: !!wajib, lebar: 440,
    isi: (wajib ? '<p class="t2 mb-3">Akun ini masih memakai password bawaan. Demi keamanan data WBP, buat password baru sebelum melanjutkan.</p>' : "") +
      '<div class="grid gap-3">' + medanSandi("gsLama", "Password sekarang", "current-password") + medanSandi("gsBaru", "Password baru (minimal 6 karakter)", "new-password") +
      medanSandi("gsUlang", "Ulangi password baru", "new-password") + "</div>",
    tombol: wajib ? [{ teks: "Keluar", nilai: "keluar" }, { teks: "Simpan password", nilai: "simpan", kelas: "btn-primary", utama: true }]
      : [{ teks: "Batal", nilai: null }, { teks: "Simpan password", nilai: "simpan", kelas: "btn-primary", utama: true }],
    ambil: async (root, nilai) => {
      if (nilai === "keluar") return "keluar";
      const lama = root.querySelector("#gsLama").value, baru = root.querySelector("#gsBaru").value, ulang = root.querySelector("#gsUlang").value;
      if (!lama) throw new Error("Isi password sekarang.");
      if (baru.length < 6) throw new Error("Password baru minimal 6 karakter.");
      if (baru !== ulang) throw new Error("Ulangan password baru tidak sama.");
      if (baru === lama) throw new Error("Password baru harus berbeda dari password sekarang.");
      const r = await simpanDariDialog(root, "changeMyPassword", [S.token, lama, baru]);
      if (r && r.token) { S.token = r.token; simpanSesi("cm_token", r.token); hapusCache(); }
      return "ok";
    }
  }).then(async v => {
    _sandiTerbuka = false;
    if (v === "keluar") { await keluar(); return; }
    if (v === "ok") {
      toast("Password berhasil diganti.", "ok");
      if (wajib) await muatData();
    }
  });
}

// ---------- Mulai ----------
function mulaiAplikasi() {
  navMulai();
  kirimMuat();
  pasangMenu();
  el("btnAkun").onclick = menuAkun;
  // Menu bawah tetap tampil saat mengetik di HP
  const salinan = bacaCache();
  if (salinan) {
    try { terapkanData(salinan, { dariCache: true }); } catch (e) { console.warn("Salinan data rusak:", e); hapusCache(); muatData(); return; }
    muatData({ latar: true, bar: true });                 // tampil dulu dari salinan, data terbaru menyusul
  } else muatData();
  tampilStatusKirim();
  // Kembali ke aplikasi setelah lama ditinggal: kirim yang tertunda, lalu segarkan data di belakang
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !S.dimuat) return;
    kirimJalan();
    if (Date.now() - S.dimuat.getTime() < 3 * 60000) return;
    if (el("dialogRuang").children.length) return;
    // kembali ke aplikasi: muat ulang hanya bila ada data baru
    segarkanJikaPerlu(S.appV, SEMUA_BAGIAN, () => muatData({ latar: true }));
  });
}
window.addEventListener("unhandledrejection", ev => { console.warn("Galat tak tertangani:", ev.reason); });
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mulaiAplikasi);
else mulaiAplikasi();

  return dialog({

      '<div><label class="lbl" for="dfPass">Password</label><div class="relative"><input class="inp" style="padding-right:46px" id="dfPass" type="password" autocomplete="new-password">' +
      '<button type="button" class="btn btn-ghost btn-sm btn-ikon absolute right-1 top-1" id="dfLihat" aria-label="Tampilkan password"><i class="fa-solid fa-eye"></i></button></div><div class="bantu">Minimal 6 karakter.</div></div>' +

      '<p class="bantu"><i class="fa-solid fa-shield-halved t-accent mr-1"></i>Akun baru bisa dipakai setelah <b>disetujui admin</b>.</p>' +
      '<div class="daftar-ajak">Sudah punya akun? <button type="button" class="t-accent font-semibold" id="dfMasuk">Masuk di sini</button></div></div>',
    tombol: [{ teks: "Batal", nilai: null }, { teks: "Daftar", nilai: true, kelas: "btn-primary", utama: true }],
    saatBuka: (root) => {
      root.querySelector("#dfMasuk").onclick = () => { root._tutup(null); dialogMasuk(); };
      root.querySelector("#dfJk").onclick = (ev) => {

        jk = b.dataset.v;
        root.querySelectorAll("#dfJk [data-v]").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });

      root.querySelector("#dfLihat").onclick = () => {

      if (!d.jk) throw new Error("Pilih jenis kelamin.");
      return await simpanDariDialog(root, "daftarAkun", [d]);
    }
  }).then(r => {
    if (r && r.success) infoDialog("Pendaftaran terkirim", '<p class="kecil">' + esc(r.message) + " Silakan coba masuk lagi setelah admin menyetujui.</p>", "ok");
  });
}
