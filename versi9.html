function saringLebar() { return window.innerWidth >= 1024; }
function nilaiAktifSaring(b, v) { return b.k === "rentang" ? !!(v.dari || v.sampai) : !!v[b.k]; }
function teksNilaiSaring(b, v) {
  if (b.k === "rentang") return labelRentang(v.dari, v.sampai);
  if (b.centang) return b.pendek || b.label;
  const x = (b.pilihan || []).find(p => p[0] === v[b.k]);
  return (b.awalan || "") + (x ? x[1] : v[b.k]);
}
function htmlSaring(cfg) {
  const aktif = cfg.bagian.filter(b => nilaiAktifSaring(b, cfg.nilai));
  if (!saringLebar()) return htmlBatangSaring(cfg.pre, cfg.q, cfg.ph, aktif.length, cfg.kanan);
  return '<div class="saring-bar saring-lebar"><div class="relative flex-1 min-w-0" style="max-width:360px"><i class="fa-solid fa-magnifying-glass saring-ikon"></i>' +
    '<input class="inp" style="padding-left:2.3rem" id="' + cfg.pre + 'Q" placeholder="' + esc(cfg.ph) + '" autocomplete="off" value="' + esc(cfg.q || "") + '" aria-label="Cari"></div>' +
    cfg.bagian.map(b => {
      const on = nilaiAktifSaring(b, cfg.nilai);
      return '<div class="pil-wadah"><button type="button" class="pil' + (on ? " on" : "") + '" data-pil="' + b.k + '" aria-haspopup="true" aria-expanded="false">' +
        (b.ikon ? '<i class="fa-solid ' + b.ikon + '"></i>' : "") + "<span>" + esc(on ? (b.centang ? (b.pendek || b.label) : (b.label + ": " + teksNilaiSaring(b, cfg.nilai))) : b.label) + "</span>" +
        '<i class="fa-solid fa-chevron-down pil-panah"></i></button></div>';
    }).join("") +
    (aktif.length ? '<button type="button" class="btn btn-ghost btn-sm" id="' + cfg.pre + 'Reset"><i class="fa-solid fa-xmark"></i>Hapus saringan</button>' : "") +
    '<div class="ml-auto flex gap-2">' + (cfg.kanan || "") + "</div></div>";
}
function pasangSaring(cfg) {
  const inp = el(cfg.pre + "Q");
  if (inp) inp.addEventListener("input", debounce((ev) => cfg.cari(String(ev.target.value || "").trim()), cfg.jedaCari || 400));
  if (!saringLebar()) {
    const daftar = cfg.bagian.filter(b => nilaiAktifSaring(b, cfg.nilai)).map(b => ({
      label: teksNilaiSaring(b, cfg.nilai),
      hapus: () => { const v = Object.assign({}, cfg.nilai); if (b.k === "rentang") { v.dari = ""; v.sampai = ""; } else v[b.k] = b.centang ? false : ""; cfg.terapkan(v); }
    }));
    gambarChipSaring(el(cfg.pre + "Chip"), daftar, cfg.reset);
    el(cfg.pre + "Saring").onclick = async () => {
      const v = await dialogSaring(cfg.judul, cfg.bagian, cfg.nilai);
      if (!v) return;
      if (v === "reset") cfg.reset(); else cfg.terapkan(v);
    };
    return;
  }
  const r = el(cfg.pre + "Reset");
  if (r) r.onclick = cfg.reset;
  const bar = inp ? inp.closest(".saring-bar") : null;
  if (!bar) return;
  bar.querySelectorAll("[data-pil]").forEach(btn => btn.onclick = (ev) => {
    ev.stopPropagation();
    const wadah = btn.parentElement;
    const sudah = wadah.querySelector(".pil-menu");
    tutupMenuPil();
    if (sudah) return;
    const b = cfg.bagian.find(x => x.k === btn.dataset.pil);
    const v = Object.assign({}, cfg.nilai);
    const menu = document.createElement("div");
    menu.className = "pil-menu";
    menu.setAttribute("role", "menu");
    if (b.k === "rentang") {
      const cocok = ["hari", "7", "bulan", "lalu"].find(k => { const x = rentangCepat(k); return x[0] === v.dari && x[1] === v.sampai; });
      const kode = !v.dari && !v.sampai ? "" : (cocok || "pilih");
      menu.innerHTML = [["", "Semua tanggal"], ["hari", "Hari ini"], ["7", "7 hari terakhir"], ["bulan", "Bulan ini"], ["lalu", "Bulan lalu"]].map(x =>
        '<button type="button" class="pil-opsi' + (kode === x[0] ? " on" : "") + '" data-rg="' + x[0] + '">' + x[1] + (kode === x[0] ? '<i class="fa-solid fa-check"></i>' : "") + "</button>").join("") +
        '<div class="pil-pisah"></div><div class="px-2 pb-1 mini muted">Pilih tanggal</div><div class="grid grid-cols-2 gap-2 px-2"><input type="date" class="inp inp-sm" data-dari value="' + esc(v.dari || "") + '" max="' + S.hariIni + '" aria-label="Dari tanggal">' +
        '<input type="date" class="inp inp-sm" data-sampai value="' + esc(v.sampai || "") + '" max="' + S.hariIni + '" aria-label="Sampai tanggal"></div>' +
        '<div class="px-2 pt-2 pb-1"><button type="button" class="btn btn-primary btn-sm w-full" data-terap>Terapkan tanggal</button></div>';
      menu.querySelectorAll("[data-rg]").forEach(o => o.onclick = () => { const x = rentangCepat(o.dataset.rg); v.dari = x[0]; v.sampai = x[1]; tutupMenuPil(); cfg.terapkan(v); });
      menu.querySelector("[data-terap]").onclick = () => {
        v.dari = menu.querySelector("[data-dari]").value; v.sampai = menu.querySelector("[data-sampai]").value;
        if (v.dari && v.sampai && v.dari > v.sampai) { toast("Tanggal awal tidak boleh sesudah tanggal akhir.", "warn"); return; }
        tutupMenuPil(); cfg.terapkan(v);
      };
    } else if (b.centang) {
      menu.innerHTML = '<label class="pil-opsi" style="cursor:pointer"><input type="checkbox" data-c' + (v[b.k] ? " checked" : "") + "> " + esc(b.centang) + "</label>";
      menu.querySelector("[data-c]").onchange = (e) => { v[b.k] = e.target.checked; tutupMenuPil(); cfg.terapkan(v); };
    } else {
      menu.innerHTML = b.pilihan.map(x => '<button type="button" class="pil-opsi' + ((v[b.k] || "") === x[0] ? " on" : "") + '" data-v="' + esc(x[0]) + '" role="menuitemradio" aria-checked="' + ((v[b.k] || "") === x[0]) + '">' + esc(x[1]) +
        ((v[b.k] || "") === x[0] ? '<i class="fa-solid fa-check"></i>' : "") + "</button>").join("");
      menu.querySelectorAll("[data-v]").forEach(o => o.onclick = () => { v[b.k] = o.dataset.v; tutupMenuPil(); cfg.terapkan(v); });
    }
    menu.addEventListener("click", (e) => e.stopPropagation());
    wadah.appendChild(menu);
    btn.setAttribute("aria-expanded", "true");
  });
}
function tutupMenuPil() {
  document.querySelectorAll(".pil-menu").forEach(m => { const b = m.parentElement.querySelector("[data-pil]"); if (b) b.setAttribute("aria-expanded", "false"); m.remove(); });
}
document.addEventListener("click", tutupMenuPil);
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") tutupMenuPil(); });

if (window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches) {
  let _sorot = null, _raf = 0, _ev = null;
  document.addEventListener("pointermove", (ev) => {
    _ev = ev;
    if (_raf) return;
    _raf = requestAnimationFrame(() => {
      _raf = 0;
      const k = _ev.target && _ev.target.closest ? _ev.target.closest(".kpi, .panel, .baris, .card") : null;
      if (_sorot && _sorot !== k) _sorot.classList.remove("disorot");
      _sorot = k;
      if (!k) return;
      const r = k.getBoundingClientRect();
      k.style.setProperty("--mx", (_ev.clientX - r.left) + "px");
      k.style.setProperty("--my", (_ev.clientY - r.top) + "px");
      k.classList.add("disorot");
    });
  }, { passive: true });
}

//  FOTO PROFIL: diperkecil di perangkat (persegi 192 px, JPEG) lalu disimpan
// =====================================================================
function kecilkanFotoProfil(berkas) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(berkas), img = new Image();
    img.onload = () => {
      try {
        const sisi = Math.min(img.naturalWidth, img.naturalHeight);
        const sx = (img.naturalWidth - sisi) / 2, sy = (img.naturalHeight - sisi) / 2;
        let ukuran = 192, mutu = .82, hasil = "";
        for (let i = 0; i < 5; i++) {
          const c = document.createElement("canvas");
          c.width = c.height = ukuran;
          const g = c.getContext("2d");
          g.fillStyle = "#0b1328"; g.fillRect(0, 0, ukuran, ukuran);
          g.drawImage(img, sx, sy, sisi, sisi, 0, 0, ukuran, ukuran);
          hasil = c.toDataURL("image/jpeg", mutu);
          if (hasil.length <= 42000) break;
          ukuran = Math.round(ukuran * .8); mutu = Math.max(.6, mutu - .08);
        }
        URL.revokeObjectURL(url);
        resolve(hasil);
      } catch (e) { reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Berkas bukan gambar yang bisa dibaca.")); };
    img.src = url;
  });
}

      '<p class="bantu">Foto otomatis dipotong persegi dan diperkecil, jadi tetap ringan.</p></div>',

// =====================================================================
//  MUAT ULANG HANYA BILA ADA DATA BARU
//  Halaman tampil dari data yang sudah ada. Lalu ditanyakan ke server versi datanya (sangat ringan);
//  data berat hanya diambil lagi bila versinya berubah (diisi orang lain / dari perangkat lain / hari berganti).
// =====================================================================
const SEGAR = { ver: null, waktu: 0, janji: null };
const SEMUA_BAGIAN = ["w", "n", "a", "k", "s", "u"];
function tulisTerakhir() { return Math.max(KIRIM.okTerakhir || 0, S.tulisTerakhir || 0); }
function versiServer() {
  // satu pertanyaan cukup untuk beberapa halaman sekaligus (15 detik), kecuali baru saja ada yang disimpan
  if (SEGAR.ver && Date.now() - SEGAR.waktu < 15000 && SEGAR.waktu > tulisTerakhir()) return Promise.resolve(SEGAR.ver);
  if (SEGAR.janji) return SEGAR.janji;
  SEGAR.janji = api("getVersiData", S.token).then(v => { SEGAR.ver = v; SEGAR.waktu = Date.now(); return v; }).finally(() => { SEGAR.janji = null; });
  return SEGAR.janji;
}
// vLama: versi saat data itu diambil; bagian: bagian data yang dipakai halaman itu
async function adaDataBaru(vLama, bagian) {
  if (!vLama) return true;
  try {
    const v = await versiServer();
    if (!v || v.habis) return false;
    return v.hari !== vLama.hari || (bagian || SEMUA_BAGIAN).some(b => v[b] !== vLama[b]);
  } catch (e) { return false; }                // tidak ada sinyal: tetap pakai data yang ada
}
async function segarkanJikaPerlu(vLama, bagian, muat) {
  if (await adaDataBaru(vLama, bagian)) await muat();
}
// Data per tanggal (absensi & penilaian): muat ulang diam-diam bila ada isian baru dari orang lain
async function cekHariSegar(tgl) {
  const d = S.hariData[tgl];
  if (!d) return;
  if (!(await adaDataBaru(d._v, ["a", "n", "w", "k"]))) return;
  const lama = JSON.stringify([d.abs, d.nil, d.libur, d.lj]);
  try {
    const baru = await muatHari(tgl, true);
    if (JSON.stringify([baru.abs, baru.nil, baru.libur, baru.lj]) !== lama && (S.tgl || S.hariIni) === tgl) {
      const y = window.scrollY;
      segarkanBarisTampil();
      window.scrollTo(0, y);
    }
  } catch (e) { /* abaikan: tetap pakai data yang ada */ }
}

function dashLokal() {
  try {
    const c = JSON.parse(ambilLokal("cm_dash6") || "null");
    if (c && c.d && c.u === akunToken(S.token) && c.p === S.periode && c.v === VERSI_UI && Date.now() - c.t < 7 * 86400000) return c.d;
  } catch (e) { /* abaikan */ }

RENDER_VIEW.dashboard = function (sub, latar) {
  // penyegaran latar (data aplikasi diperbarui): jangan gambar ulang; cukup ambil dashboard terbaru diam-diam
  if (latar && el("d-grid")) { segarkanJikaPerlu(S.dash && S.dash._v, SEMUA_BAGIAN, () => muatDashboard(true)); return; }
  if (!S.dash) S.dash = dashLokal();

  if (S.dash && S.dash._v) segarkanJikaPerlu(S.dash._v, SEMUA_BAGIAN, () => muatDashboard(true));
  else muatDashboard(!!S.dash);
};
// diam: tanpa indikator; hanyaPeriode: hanya bagian yang bergantung pada periode (papan juara, pertemuan)
async function muatDashboard(diam, hanyaPeriode) {
  if (!bisa("view_dashboard")) return;
  const minta = ++_dashMinta;
  if (!diam) mulaiMuat();
  try {
    const d = await api("getDashboard", S.token, S.periode);
    if (minta !== _dashMinta) return;
    const sama = S.dash && JSON.stringify(S.dash) === JSON.stringify(d);
    const adaTampilan = S.view === "dashboard" && !!el("d-grid");
    S.dash = d;
    try { localStorage.setItem("cm_dash6", JSON.stringify({ u: akunToken(S.token), p: S.periode, v: VERSI_UI, t: Date.now(), d: d })); } catch (e) { /* penuh: abaikan */ }
    if (S.view !== "dashboard") return;
    if (hanyaPeriode && adaTampilan) {
      tetapDiTempat(() => { const j = (f) => { try { f(); } catch (e) { console.warn(e); } }; j(renderJuara); j(renderPertemuan); });
      return;
    }
    if (sama && adaTampilan) return;                       // tidak ada yang berubah: biarkan
    renderDashboard({ diam: adaTampilan });                // data baru: gambar ulang tanpa animasi & tanpa pindah posisi
  } catch (e) {
    if (minta === _dashMinta && !diam) tanganiGalat(e);
  } finally { if (!diam) selesaiMuat(); }
}

// =====================================================================
//  PEMBANTU GRAFIK (SVG ringan, tanpa pustaka)
// =====================================================================
function skala(maks, nTick) {
  maks = Math.max(maks, 1);
  let step = maks / nTick;
  const p = Math.pow(10, Math.floor(Math.log10(step)));
  const f = step / p;
  step = Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p);
  return { step: step, max: step * Math.ceil(maks / step) };
}
function svgBuka(w, h, label) { return '<svg viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="' + esc(label) + '">'; }
function tooltipDi(box, html, x, y) {
  let t = box.querySelector(".tooltip-g");
  if (!t) { t = document.createElement("div"); t.className = "tooltip-g"; box.appendChild(t); }
  t.innerHTML = html;
  t.classList.add("tampil");
  const w = t.offsetWidth, h = t.offsetHeight, W = box.clientWidth;
  t.style.left = Math.max(0, Math.min(W - w, x - w / 2)) + "px";
  t.style.top = Math.max(-8, y - h - 12) + "px";
}
function tooltipSembunyi(box) { const t = box.querySelector(".tooltip-g"); if (t) t.classList.remove("tampil"); }
function barTt(warna, label, nilai, garis) {
  return '<div class="bar-tt">' + (garis ? '<i class="garis-putus" style="width:10px"></i>' : '<i class="kotak" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + warna + '"></i>') + "<span>" + esc(label) + "</span><span>" + nilai + "</span></div>";
}
function sparkline(nilai, warna, w, h) {
  const v = nilai.map(x => (x === null || x === undefined) ? null : +x);
  const ada = v.filter(x => x !== null);
  if (ada.length < 2) return "";
  const mx = Math.max.apply(null, ada), mn = Math.min.apply(null, ada);
  const rentang = mx - mn || 1;
  const X = (i) => 2 + i * (w - 4) / (v.length - 1), Y = (x) => h - 3 - (x - mn) / rentang * (h - 8);
  let d = "", awal = true;
  v.forEach((x, i) => { if (x === null) { awal = true; return; } d += (awal ? "M" : "L") + X(i).toFixed(1) + " " + Y(x).toFixed(1); awal = false; });
  const id = "sp" + Math.random().toString(36).slice(2, 7);
  return '<svg viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '" aria-hidden="true" style="color:' + warna + '"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + warna + '" stop-opacity=".25"/><stop offset="1" stop-color="' + warna + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + d + '" fill="none" stroke="' + warna + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function rataSesi(hari, k) {
  const sesi = hari.slice(0, -1).filter(o => o.j > 0 && !o.l).slice(-10);
  if (!sesi.length) return null;
  return sesi.reduce((t, o) => t + o[k], 0) / sesi.length;
}
function teksDelta(kini, acuan, satuan, ket) {
  if (satuan !== "poin" && kini === 0) return '<span class="datar">Belum ada isian hari ini</span>';
  if (acuan === null || acuan === undefined || kini === null || kini === undefined) return '<span class="datar">—</span><span>' + ket + "</span>";
  let selisih, teks;
  if (satuan === "poin") { selisih = kini - acuan; teks = (selisih > 0 ? "+" : "") + selisih + " poin"; }
  else { selisih = acuan ? Math.round((kini - acuan) / acuan * 100) : (kini ? 100 : 0); teks = Math.abs(selisih) + "%"; }
  const kelas = selisih > 0 ? "naik" : selisih < 0 ? "turun" : "datar";
  const ikon = selisih > 0 ? "fa-arrow-up" : selisih < 0 ? "fa-arrow-down" : "fa-minus";
  return '<span class="' + kelas + '"><i class="fa-solid ' + ikon + ' mr-1" style="font-size:11px"></i>' + teks + "</span><span>" + ket + "</span>";

// Angka KPI berhitung naik dari nilai sebelumnya (pertama kali dari 0)
const _kpiLalu = {};
function hitungNaik(box) {
  if (!box || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  box.querySelectorAll(".kpi-nilai").forEach((n, k) => {
    const t = n.firstChild;
    if (!t || t.nodeType !== 3) return;
    const m = /^(\d+)(.*)$/.exec(t.nodeValue.trim());
    if (!m) return;
    const akhir = +m[1], ekor = m[2], awal = _kpiLalu[k] === undefined ? 0 : _kpiLalu[k];
    _kpiLalu[k] = akhir;
    if (awal === akhir) return;
    const mulai = performance.now(), lama = 700;
    const langkah = (w) => {
      const p = Math.min(1, (w - mulai) / lama), e = 1 - Math.pow(1 - p, 3);
      t.nodeValue = Math.round(awal + (akhir - awal) * e) + ekor;
      if (p < 1 && t.isConnected) requestAnimationFrame(langkah);

  });
}

// =====================================================================
//  GRAFIK TREN KEHADIRAN (garis + area, dengan garis bantu dan keterangan)
// =====================================================================
function renderTren() {
  const box = el("d-tren");

  // hanya hari yang ada jadwal/kehadiran (hari tanpa jadwal tidak dihitung sebagai nol)

  if (data.length < 1) { box.innerHTML = '<div class="kosong-isi kecil"><i class="fa-solid fa-chart-line mr-1"></i>Grafik tampil setelah absensi hari belajar pertama diisi.' + (S.dash.stat.awalData ? '<div class="mini mt-1">Data tercatat mulai ' + esc(tglPanjang(S.dash.stat.awalData)) + ".</div>" : "") + "</div>"; return; }

  const pd = { l: 34, r: 8, t: 10, b: 24 };

  const n = data.length;
  // satu hari saja: titik di tengah; dua hari atau lebih: dibentang selebar grafik
  const X = (i) => n === 1 ? (pd.l + W - pd.r) / 2 : pd.l + i * (W - pd.l - pd.r) / (n - 1);
  const Y = (v) => pd.t + (H - pd.t - pd.b) * (1 - v / sk.max);

    '<defs><linearGradient id="gTren" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--c1)" stop-opacity=".38"/><stop offset="1" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs>';
  for (let v = 0; v <= sk.max; v += sk.step) {
    s += '<line x1="' + pd.l + '" x2="' + (W - pd.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + (v === 0 ? "var(--sumbu)" : "var(--grid)") + '" stroke-width="1"/>' +
      '<text x="' + (pd.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + "</text>";
  }

  s += '<path d="' + garis("h") + "L" + X(n - 1) + " " + Y(0) + "L" + X(0) + " " + Y(0) + 'Z" fill="url(#gTren)" class="tren-area"/>';
  s += '<path d="' + garis("j") + '" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" stroke-linejoin="round"/>';
  s += '<path d="' + garis("h") + '" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="tren-garis" pathLength="1"/>';
  // sedikit hari: tiap hari diberi titik agar tetap terbaca (satu hari = satu titik)
  if (n <= 14) data.forEach((o, i) => {
    s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(o.j).toFixed(1) + '" r="3.5" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>' +
      '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(o.h).toFixed(1) + '" r="' + (n === 1 ? 6 : 4.5) + '" fill="var(--c1)" stroke="var(--surface)" stroke-width="2" class="tren-titik"/>';
  });
  if (n === 1) s += '<text x="' + (X(0) + 12) + '" y="' + (Y(data[0].h) + 4) + '" font-size="12" font-weight="600" fill="var(--text)">' + data[0].h + " hadir dari " + data[0].j + "</text>";
  const lompat = Math.max(1, Math.ceil(n / (W < 420 ? 4 : 6)));

  });
  s += '<g id="trenFokus" style="display:none"><line y1="' + pd.t + '" y2="' + (H - pd.b) + '" stroke="var(--line-2)" stroke-width="1"/><circle r="5" fill="var(--c1)" stroke="var(--surface)" stroke-width="2"/></g>';
  s += '<rect x="' + pd.l + '" y="0" width="' + (W - pd.l - pd.r) + '" height="' + H + '" fill="transparent" id="trenSentuh"/></svg>';
  box.innerHTML = '<div class="grafik">' + s + '</div><div class="legenda mt-2"><span><i class="kotak" style="background:var(--c1)"></i>Hadir</span><span><i class="garis-putus"></i>Terjadwal</span><span class="muted">' + (n === 1 ? "baru 1 hari belajar — garis tren muncul mulai hari kedua" : "tiap titik = satu hari belajar (hari libur tidak dihitung)") + '</span></div>';
  const g = box.querySelector(".grafik"), fokus = box.querySelector("#trenFokus");
  const gerak = (ev) => {

    const i = Math.max(0, Math.min(n - 1, Math.round((px - pd.l) / ((W - pd.l - pd.r) / Math.max(1, n - 1)))));
    const o = data[i];

      '<div class="bar-tt"><span>Diabsen</span><span>' + o.d + '</span></div><div class="bar-tt"><span>Dinilai</span><span>' + o.n + "</span></div>", X(i) * r.width / W, Y(o.h) * r.height / H);

// =====================================================================
//  STATUS WBP (donat) — warna kategori 1-3, selalu dengan legenda & persen
// =====================================================================
// Donat status WBP: cincin tipis bergradasi & bercahaya, label di sudut luar (titik warna, nama, persen besar)
const DONAT_WARNA = [["#3b82f6", "#6d5cf6"], ["#f43f5e", "#fb923c"], ["#2dd4bf", "#22d3ee"]];
function renderDonut() {
  const box = el("d-donut");
  const a = S.dash.angka;
  if (!box || !a) { if (box) box.innerHTML = ""; return; }
  const isi = [["Aktif", a.aktif], ["Tidak aktif", a.tidakAktif], ["Lulus", a.lulus]];
  const total = isi.reduce((t, x) => t + x[1], 0);
  const W = Math.max(260, box.clientWidth || 300);
  const D = Math.max(130, Math.min(176, W - 150)), SW = 15, R = D / 2 - SW / 2 - 2, H = D + 8;
  const cx = W / 2, cy = H / 2;
  const pc = isi.map(x => total ? Math.round(x[1] * 100 / total) : 0);
  const titik = (sudut, r) => [cx + r * Math.cos(sudut * Math.PI / 180), cy + r * Math.sin(sudut * Math.PI / 180)];
  const ada = isi.map((x, i) => i).filter(i => isi[i][1] > 0);
  const celah = ada.length > 1 ? 3 : 0;                 // jarak antarpotongan (derajat)
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Status WBP: ' + isi.map((x, i) => x[0] + " " + pc[i] + "%").join(", ") + '"><defs>';
  let segs = "", mulai = -90;
  const tengah = [];
  isi.forEach((x, i) => {
    if (!x[1]) { tengah[i] = null; return; }
    const lebar = x[1] / total * 360;
    const a0 = mulai + celah / 2, a1 = mulai + lebar - celah / 2;
    tengah[i] = mulai + lebar / 2;
    const p0 = titik(a0, R), p1 = titik(a1, R);
    s += '<linearGradient id="dg' + i + '" gradientUnits="userSpaceOnUse" x1="' + p0[0].toFixed(1) + '" y1="' + p0[1].toFixed(1) + '" x2="' + p1[0].toFixed(1) + '" y2="' + p1[1].toFixed(1) + '">' +
      '<stop offset="0" stop-color="' + DONAT_WARNA[i][0] + '"/><stop offset="1" stop-color="' + DONAT_WARNA[i][1] + '"/></linearGradient>';
    const d = lebar >= 359.9
      ? "M" + (cx + R) + " " + cy + "A" + R + " " + R + " 0 1 1 " + (cx - R) + " " + cy + "A" + R + " " + R + " 0 1 1 " + (cx + R) + " " + cy
      : "M" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) + "A" + R + " " + R + " 0 " + (a1 - a0 > 180 ? 1 : 0) + " 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2);
    segs += '<path d="' + d + '" fill="none" stroke="url(#dg' + i + ')" stroke-width="' + SW + '" data-i="' + i + '" class="donut-seg" style="cursor:pointer;--i:' + i + ";color:" + DONAT_WARNA[i][0] + '"/>';
    mulai += lebar;
  });
  s += "</defs>";
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="var(--surface-3)" stroke-width="' + SW + '" opacity=".55"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R - SW / 2 - 6) + '" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>';
  s += segs;
  s += '<text x="' + cx + '" y="' + (cy + 2) + '" text-anchor="middle" font-size="26" font-weight="700" fill="var(--text)">' + angka(total) + '</text>' +
    '<text x="' + cx + '" y="' + (cy + 20) + '" text-anchor="middle" font-size="11" fill="var(--muted)">WBP dibina</text></svg>';
  // label ke sudut terdekat dari tengah potongannya (yang terbesar memilih lebih dulu)
  const SUDUT = { kananAtas: -45, kananBawah: 45, kiriBawah: 135, kiriAtas: -135 };
  const pakai = {}, letak = [];
  const jarak = (p, q) => { const d = Math.abs(((p - q) % 360 + 540) % 360 - 180); return d; };
  isi.map((x, i) => i).sort((p, q) => isi[q][1] - isi[p][1]).forEach(i => {
    const m = tengah[i] === null ? [-135, 135, -45, 45][i] : tengah[i];
    let pilih = null;
    Object.keys(SUDUT).forEach(k => { if (!pakai[k] && (pilih === null || jarak(SUDUT[k], m) < jarak(SUDUT[pilih], m))) pilih = k; });
    pakai[pilih] = 1; letak[i] = pilih;
  });
  const label = isi.map((x, i) => '<div class="donat-lbl ' + letak[i] + (x[1] ? "" : " nol") + '" data-i="' + i + '">' +
    '<div class="donat-nama"><i style="background:' + DONAT_WARNA[i][0] + ";box-shadow:0 0 8px " + DONAT_WARNA[i][0] + '"></i>' + x[0] + "</div>" +
    '<div class="donat-pc num">' + pc[i] + '<small>%</small></div><div class="mini muted num">' + angka(x[1]) + " WBP</div></div>").join("");
  box.innerHTML = '<div class="donat" style="height:' + H + 'px"><div class="grafik">' + s + "</div>" + label + "</div>" +
    '<div class="mini muted text-center mt-3">Tidak aktif: tanpa kegiatan lebih dari ' + (S.set.stagnanHari || 30) + " hari</div>";
  const g = box.querySelector(".grafik");
  g.style.position = "relative";
  const sorot = (i) => box.querySelectorAll("[data-i]").forEach(e => e.classList.toggle("redup", i !== null && +e.dataset.i !== i));
  g.querySelectorAll("path[data-i]").forEach(c => {
    const tampil = (ev) => {
      const i = +c.dataset.i, x = isi[i], r = g.getBoundingClientRect();
      sorot(i);
      tooltipDi(g, "<b>" + x[0] + "</b>" + barTt(DONAT_WARNA[i][0], "WBP", angka(x[1]) + " (" + pc[i] + "%)"), ev.clientX - r.left, ev.clientY - r.top);
    };
    c.addEventListener("pointermove", tampil);
    c.addEventListener("pointerdown", tampil);
    c.addEventListener("pointerleave", (ev) => { sorot(null); if (ev.pointerType !== "touch") tooltipSembunyi(g); });
  });
  box.querySelectorAll(".donat-lbl").forEach(l => {
    l.addEventListener("pointerenter", () => sorot(+l.dataset.i));
    l.addEventListener("pointerleave", () => sorot(null));
  });
}

function sesudahGanti() { S.hariData = {}; return muatData({ segar: true, latar: true }); }
// tanggal terdekat (mulai hari ini) yang jatuh pada hari tertentu
function tanggalBerikut(hari) { let t = S.hariIni; for (let i = 0; i < 7 && namaHari(t) !== hari; i++) t = tambahHari(t, 1); return t; }
async function dialogGanti(g, saran) {

  const jumlahHari = {};
  st.perHari.forEach(x => { jumlahHari[x.h] = x.n; });
  // jumlah terjadwal tanggal tertentu (libur khusus putra/putri sudah dikurangi)
  const nTerjadwal = (t) => S.wbps ? S.wbps.filter(w => terjadwal(w, t)).length : (jumlahHari[namaHari(t)] || 0);
  const sel = [];
  for (let i = 0; i < hariKe(awal); i++) sel.push('<div class="kt luar" aria-hidden="true"></div>');
  for (let dd = 1; dd <= nHari; dd++) {
    const t = awal.slice(0, 8) + (dd < 10 ? "0" : "") + dd;
    const o = peta[t], libur = liburPada(t) || (o && o.l);
    const sb = libur ? "" : teksLiburJk((o && o.lj) || liburJkPada(t));
    let warna = "", ket = tglPanjang(t);
    if (libur) ket += " · libur: " + libur;
    if (sb) ket += " · " + sb;
    else if (t <= S.hariIni && o && o.j) {
      warna = o.d >= o.j ? "var(--s-baik)" : o.d > 0 ? "var(--s-waspada)" : (t < S.hariIni ? "var(--s-kritis)" : "");
      ket += " · diabsen " + o.d + "/" + o.j;
    } else if (t > S.hariIni && nTerjadwal(t)) { warna = "var(--line-2)"; ket += " · " + nTerjadwal(t) + " WBP terjadwal"; }
    sel.push('<div class="kt' + (t === S.hariIni ? " ini" : "") + (libur ? " libur" : sb ? " libur-sb" : "") + '" title="' + esc(ket) + '">' + dd + (warna && t !== S.hariIni ? '<i class="tt" style="background:' + warna + '"></i>' : "") + "</div>");
  }
  const depan = [];
  for (let k = 0; k < 4; k++) {
    const t = tambahHari(S.hariIni, k), lb = liburPada(t), n = nTerjadwal(t), sb = lb ? "" : teksLiburJk(liburJkPada(t));
    // keterangan libur di baris kedua (boleh turun baris), supaya tidak terpotong
    const ketLibur = lb ? "Libur: " + lb : sb;
    depan.push('<div class="flex items-start gap-2 kecil"><i class="fa-solid fa-circle" style="font-size:7px;margin-top:7px;color:' + (k === 0 ? "var(--c1)" : "var(--muted)") + '"></i><span class="t2 shrink-0" style="width:72px">' + (k === 0 ? "Hari ini" : k === 1 ? "Besok" : namaHari(t)) + "</span>" +
      '<span class="flex-1 min-w-0"><span class="block">' + (lb ? '<span class="muted">—</span>' : n + " WBP terjadwal") + "</span>" + (ketLibur ? '<span class="block mini t-warn" style="overflow-wrap:anywhere"><i class="fa-solid fa-umbrella-beach mr-1"></i>' + esc(ketLibur) + "</span>" : "") + "</span>" +
      '<span class="mini muted shrink-0" style="margin-top:2px">' + esc(tglPendek(t)) + "</span></div>");
  }
  box.innerHTML = '<div class="kal-mini">' + HARI.map(h => '<div class="kh">' + h.slice(0, 2) + "</div>").join("") + sel.join("") + "</div>" +
    '<div class="legenda mt-3"><span><i class="kotak" style="background:var(--s-baik);border-radius:50%"></i>Lengkap</span><span><i class="kotak" style="background:var(--s-waspada);border-radius:50%"></i>Sebagian</span><span><i class="kotak" style="background:var(--s-kritis);border-radius:50%"></i>Belum</span><span><b class="t-warn">Angka kuning</b> = libur</span></div>' +
    '<div class="grid gap-2 mt-4 pt-3 border-t garis">' + depan.join("") + "</div>";
}

  const jadwal = (S.wbps || []).filter(w => terjadwal(w, S.hariIni));
  const j = d ? jadwal.length : a.terjadwal;

      '<span class="kecil font-semibold num" style="width:42px;text-align:right">' + pc + "%</span></button>";
  }).join("") + "</div>" + (a.libur ? '<p class="mini t-warn mt-2"><i class="fa-solid fa-umbrella-beach mr-1"></i>Hari ini libur: ' + esc(a.libur) + "</p>"

  box.innerHTML = '<div class="flex flex-wrap items-center gap-2 mb-3">' +

function infoPeringkat(w) {
  const pr = Math.max(0, Math.min(100, +w.prr || 0));
  if (w.st === "Lulus") return Object.assign({ i: 7, div: 0, pr: 100, berikut: null, sisa: 0 }, GLORY);
  let i = 0;
  while (i < PERINGKAT.length - 1 && pr >= PERINGKAT[i + 1].m) i++;
  const p = PERINGKAT[i], berikut = PERINGKAT[i + 1] || GLORY;
  const div = p.k === "mythic" ? 0 : 3 - Math.min(2, Math.floor((pr - p.m) / 5));
  return Object.assign({ i: i, div: div, pr: pr, berikut: berikut, sisa: Math.max(0, berikut.m - pr) }, p);
}

// Kalender runtun bulan berjalan: api menyala di tanggal hadir, runtun yang sedang berjalan paling terang
function htmlKalenderRuntun(w) {
  const kl = (w.b && w.b.kl) || "";
  const awal = S.hariIni.slice(0, 8) + "01";
  const y = +S.hariIni.slice(0, 4), m = +S.hariIni.slice(5, 7), nHari = new Date(Date.UTC(y, m, 0)).getUTCDate();
  // runtun berjalan: dari catatan terakhir mundur; izin/sakit tidak memutus, alpa memutus
  const runtun = {};
  let n = 0;
  for (let k = kl.length - 1; k >= 0; k--) {
    const c = kl.charAt(k);
    if (c === "A") break;
    if (c === "H") { runtun[k] = 1; n++; }
  }
  const sel = [];
  for (let i = 0; i < hariKe(awal); i++) sel.push('<div class="rk luar"></div>');
  for (let d = 1; d <= nHari; d++) {
    const t = awal.slice(0, 8) + (d < 10 ? "0" : "") + d, c = kl.charAt(d - 1) || "", lewat = t <= S.hariIni;
    const jadwal = (w.hr || []).indexOf(namaHari(t)) !== -1;
    let kelas = "rk", isi = "", ket = tglPanjang(t);
    if (c === "H") { kelas += runtun[d - 1] ? " api nyala" : " api"; isi = '<i class="fa-solid fa-fire-flame-curved"></i>'; ket += " · hadir" + (runtun[d - 1] ? " (runtun)" : ""); }
    else if (c === "A") { kelas += " alpa"; isi = '<i class="fa-solid fa-xmark"></i>'; ket += " · alpa"; }
    else if (c === "I" || c === "S") { kelas += " izin"; isi = "<b>" + c + "</b>"; ket += c === "I" ? " · izin" : " · sakit"; }
    else if (jadwal) { kelas += lewat ? " kosong" : " nanti"; ket += lewat ? " · terjadwal, belum dicatat" : " · terjadwal"; }
    if (t === S.hariIni) kelas += " ini";
    sel.push('<div class="' + kelas + '" title="' + esc(ket) + '" style="--d:' + d + '"><span>' + d + "</span>" + isi + "</div>");
  }
  const bulan = BULAN[m - 1];
  return '<div class="sl-panel sl-runtun"><div class="flex items-center justify-between gap-2 mb-2"><div class="sl-panel-j" style="margin:0">RUNTUN · ' + esc(bulan.toUpperCase()) + "</div>" +
    '<div class="sl-api-jml' + (n ? " on" : "") + '" title="Terbaik bulan ini: ' + ((w.b && w.b.sk) || 0) + ' hadir beruntun"><i class="fa-solid fa-fire-flame-curved"></i><b class="num">' + n + "</b> hadir beruntun</div></div>" +
    '<div class="rk-grid">' + HARI.map(h => '<div class="rk-h">' + h.slice(0, 2) + "</div>").join("") + sel.join("") + "</div>" +
    '<div class="rk-leg"><span><i class="fa-solid fa-fire-flame-curved" style="color:#fb923c"></i>Hadir</span><span><i class="fa-solid fa-xmark" style="color:#f87171"></i>Alpa</span><span><b>I/S</b>Izin/Sakit</span><span><i class="rk-kosong-ikon"></i>Terjadwal</span></div></div>';
}

function htmlKartuWbp(w) {
  const r = infoPeringkat(w);
  const statusWarna = { "Aktif": "ok", "Tidak Aktif": "bad", "Lulus": "gold", "Arsip": "muted" }[w.st] || "muted";
  const chip = [];
  chip.push('<span class="sl-chip"><i class="fa-solid ' + (w.jk === "P" ? "fa-venus" : "fa-mars") + '"></i>' + (w.jk === "P" ? "Putri" : w.jk === "L" ? "Putra" : "JK belum diisi") + "</span>");
  if (w.bl) chip.push('<span class="sl-chip"><i class="fa-solid fa-door-closed"></i>Blok ' + esc(w.bl) + "</span>");
  chip.push('<span class="sl-chip"><i class="fa-solid fa-calendar-day"></i>' + esc((w.hr || []).length ? w.hr.join(", ") : "Belum ada jadwal") + "</span>");
  const skill = PROGRAM.map((p, i) => {
    if (!ikutMateri(w, p)) return '<div class="sl-skill mati"><div class="sl-skill-atas"><span>' + p + '</span><span class="sl-redup">Tidak ikut</span></div></div>';
    const L = levelNyata(p);
    const sek = L.indexOf(w.sk[i]), rek = L.indexOf(w.rk[i]), tgt = L.indexOf(w.tg[i]);

// ---------- Grafik perkembangan WBP (bulanan / tahunan) ----------
const PERK = {};                 // id -> { t: waktu muat, d: data }
const PERK_WARNA = ["var(--c1)", "var(--c2)", "var(--c7)", "var(--c4)"];   // hijau dipakai untuk kehadiran
function pasangPerkembangan(root, id) {
  const lipat = root.querySelector("details.sl-perk");
  if (!lipat) return;
  let sudah = false;
  lipat.addEventListener("toggle", () => { if (lipat.open && !sudah) { sudah = true; muatPerkembangan(root, id); } });
}
async function muatPerkembangan(root, id) {
  const isi = root.querySelector("[data-perk-isi]"), seg = root.querySelector("[data-perk-mode]");
  if (!isi) return;
  if (!PERK[id]) isi.innerHTML = '<div class="sl-redup kecil py-6 text-center"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Memuat perkembangan…</div>';
  let mode = "bulan";
  const gambar = () => { if (PERK[id]) gambarPerkembangan(isi, PERK[id].d, mode); };
  seg.onclick = (ev) => {
    const b = ev.target.closest("[data-v]");
    if (!b) return;
    mode = b.dataset.v;
    seg.querySelectorAll("[data-v]").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
    gambar();
  };
  if (PERK[id] && Date.now() - PERK[id].t < 5 * 60000) { gambar(); return; }
  try {
    const d = await api("getPerkembanganWbp", S.token, id);
    PERK[id] = { t: Date.now(), d: d };
    if (isi.isConnected) gambar();
  } catch (e) {
    if (isi.isConnected) isi.innerHTML = '<div class="sl-redup kecil py-4 text-center">Grafik perkembangan belum bisa dimuat. ' + esc(pesanGalat(e)) + "</div>";
  }
}
function gambarPerkembangan(box, d, mode) {
  let data = mode === "tahun" ? d.tahun : d.bulan.slice(-12);
  if (!data.length) { box.innerHTML = '<div class="sl-redup kecil py-6 text-center">Belum ada penilaian atau absensi untuk digambar.</div>'; return; }
  const seri = d.materi.map((q, i) => ({ n: q, w: PERK_WARNA[i % PERK_WARNA.length], v: data.map(x => x.m[q]) }));
  const W = Math.max(280, box.clientWidth || 600), H = 190, HB = 0;
  const pd = { l: 34, r: 78, t: 12, b: 26 };
  const n = data.length;
  const X = (i) => n === 1 ? (pd.l + W - pd.r) / 2 : pd.l + i * (W - pd.l - pd.r) / (n - 1);
  const Y = (v) => pd.t + (H - pd.t - pd.b) * (1 - v / 100);
  let s = svgBuka(W, H + HB, "Perkembangan " + (mode === "tahun" ? "per tahun" : "per bulan"));
  [0, 25, 50, 75, 100].forEach(v => {
    s += '<line x1="' + pd.l + '" x2="' + (W - pd.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + (v ? "rgba(110,168,255,.12)" : "rgba(110,168,255,.35)") + '"/>' +
      '<text x="' + (pd.l - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="10" fill="#8ea0c4">' + v + "%</text>";
  });
  // garis tiap materi lalu rata-rata (paling tebal, di atas)
  seri.forEach(sr => {
    const d0 = sr.v.map((v, i) => v == null ? null : [X(i), Y(v)]);
    let path = "", awal = true;
    d0.forEach(p => { if (!p) { awal = true; return; } path += (awal ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1); awal = false; });
    s += '<path d="' + path + '" fill="none" stroke="' + sr.w + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" class="perk-garis' + (sr.utama ? " utama" : "") + '" pathLength="1"/>';
    if (n <= 14) d0.forEach(p => { if (p) s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" fill="' + sr.w + '" stroke="#0b1328" stroke-width="1.5"/>'; });
  });
  // label langsung di ujung kanan (tidak tumpang tindih)
  // label langsung di ujung kanan; materi dengan nilai sama digabung dalam satu label
  const grup = {};
  seri.forEach(sr => { let k = sr.v.length - 1; while (k >= 0 && sr.v[k] == null) k--; if (k >= 0) (grup[sr.v[k]] = grup[sr.v[k]] || []).push(sr.n); });
  const ujung = Object.keys(grup).map(v => ({ v: +v, y: Y(+v), n: grup[v].join(" · ") })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ujung.length; k++) if (ujung[k].y - ujung[k - 1].y < 13) ujung[k].y = ujung[k - 1].y + 13;
  const xLabel = n === 1 ? X(0) + 10 : X(n - 1) + 8;
  ujung.forEach(u => { s += '<text x="' + xLabel + '" y="' + (u.y + 4).toFixed(1) + '" font-size="10.5" font-weight="600" fill="#c7d4ee">' + esc(u.n) + " " + u.v + "%</text>"; });
  // label sumbu x
  const lompat = Math.max(1, Math.ceil(n / (W < 420 ? 4 : 7)));
  data.forEach((x, i) => { if ((n - 1 - i) % lompat) return; s += '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#8ea0c4">' + esc(x.l) + "</text>"; });
  s += '<g class="perk-fokus" style="display:none"><line y1="' + pd.t + '" y2="' + (H - pd.b) + '" stroke="rgba(147,191,255,.45)" stroke-dasharray="3 3"/></g>';
  s += '<rect x="' + pd.l + '" y="0" width="' + (W - pd.l - pd.r) + '" height="' + (H + HB) + '" fill="transparent" class="perk-sentuh"/></svg>';
  box.innerHTML = '<div class="grafik">' + s + "</div>" +
    '<div class="legenda mt-1">' + seri.map(sr => '<span><i class="kotak" style="background:' + sr.w + '"></i>' + esc(sr.n) + "</span>").join("") + "</div>" +
    '<p class="sl-redup mini mt-1">Progres = level di akhir ' + (mode === "tahun" ? "tahun" : "bulan") + " dibanding target tiap materi." + (mode === "bulan" && d.bulan.length > 12 ? " Menampilkan 12 bulan terakhir." : "") + "</p>";
  const g = box.querySelector(".grafik"), fokus = g.querySelector(".perk-fokus");
  const gerak = (ev) => {
    const r = g.getBoundingClientRect();
    const px = (ev.clientX - r.left) * W / r.width;
    const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((px - pd.l) / ((W - pd.l - pd.r) / (n - 1)))));
    const x = data[i];
    fokus.style.display = "";
    fokus.querySelector("line").setAttribute("x1", X(i)); fokus.querySelector("line").setAttribute("x2", X(i));
    const atas = Math.max.apply(null, seri.map(sr => sr.v[i] == null ? 0 : sr.v[i]));
    tooltipDi(g, "<b>" + esc(x.l) + "</b>" + seri.map(sr => barTt(sr.w, sr.n, sr.v[i] == null ? "—" : sr.v[i] + "%")).join(""), X(i) * r.width / W, Y(atas) * r.height / (H + HB));
  };
  const sentuh = g.querySelector(".perk-sentuh");
  sentuh.addEventListener("pointermove", gerak);
  sentuh.addEventListener("pointerdown", gerak);
  sentuh.addEventListener("pointerleave", (ev) => { if (ev.pointerType !== "touch") { fokus.style.display = "none"; tooltipSembunyi(g); } });
}
// =====================================================================

const ABS = { cari: "" };
const HURUF_ABSEN = { Hadir: "H", Izin: "I", Sakit: "S", Alpa: "A" };

// Satu halaman: isi absensi di atas, riwayat absensi di bawah

function renderIsiAbsensi() {

    '<div id="absDaftar" class="daftar"></div>';

async function gantiTanggalAbsensi() {
  const t = S.tgl || S.hariIni;
  el("absTgl").innerHTML = kontrolTanggal();
  pasangTanggal(el("absTgl"), gantiTanggalAbsensi);

    try { await muatHari(t); } catch (e) { tanganiGalat(e); return; }

  }

}

// WBP terjadwal pada tanggal ini + hasil pencarian dari WBP lain
function daftarHariIni(tgl, cari) {
  const q = normCari(cari);
  const cocok = (w) => !q || normCari(w.nm).indexOf(q) !== -1 || normCari(w.bl).indexOf(q) !== -1;
  const aktif = (S.wbps || []).filter(w => !w.ar);
  const urut = (a, b) => a.nm.localeCompare(b.nm);
  const jadwal = aktif.filter(w => terjadwal(w, tgl)).sort(urut);
  const libur = aktif.filter(w => liburJadwal(w, tgl) && cocok(w)).sort(urut);       // libur khusus putra/putri
  const lain = q ? aktif.filter(w => !terjadwal(w, tgl) && !liburJadwal(w, tgl) && cocok(w)).sort(urut).slice(0, 25) : [];
  return { jadwal: jadwal, tampil: jadwal.filter(cocok), lain: lain, libur: libur };
}
// Pemisah + daftar WBP yang libur khusus (tetap bisa diisi bila ada kegiatan)
function htmlKelompokLibur(L, tgl, baris) {
  if (!L.libur.length) return "";
  const grup = {}, urut = [];
  L.libur.forEach(w => { const a = alasanLibur(w, tgl); if (!grup[a]) { grup[a] = []; urut.push(a); } grup[a].push(w); });
  return urut.map(a => '<div class="pemisah"><i class="fa-solid fa-umbrella-beach t-warn mr-1"></i>' + esc(a) + " · " + grup[a].length + " WBP</div>" +
    '<div class="grup-libur">' + grup[a].map(baris).join("") + "</div>").join("");
}

function barisAbsensi(w, tgl, d) {
  const x = d.abs[w.id];
  const st = x ? x[0] : "";
  const ket = x ? x[1] : "";
  const tunggu = menunggu("simpanAbsensi", tgl, w.id);
  const dinilai = d.nil[w.id];
  const sub = [w.bl ? "Blok " + w.bl : "", ket ? "“" + ket + "”" : "", dinilai && !st ? "sudah dinilai" : ""].filter(Boolean).join(" · ");
  return '<div class="baris abs' + (st ? " selesai" : "") + '" data-id="' + esc(w.id) + '">' + avatar(w, 36) +
    '<div class="min-w-0 flex-1"><div class="nm truncate">' + esc(w.nm) + "</div>" +
    '<div class="mini muted truncate">' + esc(sub || (w.hr || []).join(", ")) +
    (st && st !== "Hadir" ? ' <button type="button" class="t-accent font-bold" data-ket="1">' + (ket ? "ubah keterangan" : "+ keterangan") + "</button>" : "") + "</div></div>" +
    (tunggu ? '<span class="titik ' + (KIRIM.gagal ? "tunda" : "kirim") + '" title="' + (KIRIM.gagal ? "Menunggu sinyal" : "Menyimpan") + '"></span>' : "") +
    (bisa("act_bebas") ? '<button type="button" class="btn btn-ghost btn-sm btn-ikon shrink-0" data-keluar="1" title="WBP sudah bebas / keluar" aria-label="Tandai ' + esc(w.nm) + ' bebas atau keluar"><i class="fa-solid fa-door-open"></i></button>' : "") +
    '<div class="ab-grup">' + STATUS_ABSEN.map(s => '<button type="button" class="ab ' + s + (st === s ? " on" : "") + '" data-ab="' + s + '" aria-pressed="' + (st === s) + '" aria-label="' + s + '" title="' + s + '">' + HURUF_ABSEN[s] + "</button>").join("") + "</div></div>";
}

function gambarAbsensi() {
  const tgl = S.tgl || S.hariIni;
  const d = S.hariData[tgl];
  if (!d) return;
  const L = daftarHariIni(tgl, ABS.cari);
  const sudah = L.jadwal.filter(w => d.abs[w.id]).length;
  const hadir = L.jadwal.filter(w => d.abs[w.id] && d.abs[w.id][0] === "Hadir").length;
  const sisa = L.jadwal.filter(w => !d.abs[w.id]).length;
  el("absInfo").innerHTML =
    htmlInfoLibur(tgl, "Absensi tetap bisa diisi bila ada kegiatan.") +
    '<div class="flex flex-wrap items-center gap-x-4 gap-y-2"><span class="stat-kecil"><i class="fa-solid fa-calendar-check t-accent"></i>' + esc(namaHari(tgl)) + ": <b>" + L.jadwal.length + "</b> terjadwal</span>" +
    '<span class="stat-kecil"><i class="fa-solid fa-list-check"></i><b>' + sudah + "</b> sudah diabsen</span>" +
    '<span class="stat-kecil t-ok"><i class="fa-solid fa-user-check"></i><b>' + hadir + "</b> hadir</span>" +
    (sisa && bisa("act_absensi") ? '<button type="button" class="btn btn-sm ml-auto" id="absSisa"><i class="fa-solid fa-check-double"></i>Tandai ' + sisa + " sisanya Hadir</button>" : "") + "</div>";
  if (el("absSisa")) el("absSisa").onclick = tandaiSisaHadir;
  let h = "";
  if (!L.jadwal.length && !ABS.cari) {
    h = L.libur.length ? '<div class="card kosong-isi">Semua WBP yang terjadwal hari ' + esc(namaHari(tgl)) + " sedang libur.</div>"
      : '<div class="card kosong-isi">Tidak ada WBP yang jadwalnya hari ' + esc(namaHari(tgl)) + '.<div class="mini mt-2">Ketik nama di kotak pencarian untuk mengabsen WBP lain, atau atur jadwal di menu Data WBP.</div></div>';
    h += htmlKelompokLibur(L, tgl, w => barisAbsensi(w, tgl, d));
  } else {
    h = L.tampil.map(w => barisAbsensi(w, tgl, d)).join("");
    if (ABS.cari && !L.tampil.length && !L.lain.length && !L.libur.length) h = '<div class="card kosong-isi">Tidak ada nama yang cocok.</div>';
    h += htmlKelompokLibur(L, tgl, w => barisAbsensi(w, tgl, d));
    if (L.lain.length) h += '<div class="pemisah">Tidak terjadwal hari ' + esc(namaHari(tgl)) + "</div>" + L.lain.map(w => barisAbsensi(w, tgl, d)).join("");
  }
  el("absDaftar").innerHTML = h;
}

function setAbsen(id, st, ket) {
  const tgl = S.tgl || S.hariIni;
  const d = S.hariData[tgl];
  if (!d) return;
  if (st) d.abs[id] = [st, ket || "", penggunaKini()]; else delete d.abs[id];
  kirimTambah("simpanAbsensi", tgl, id, { s: st, k: ket || "" });
}

function klikAbsensi(ev) {
  const baris = ev.target.closest(".baris");
  if (baris && ev.target.closest("[data-keluar]")) { dialogKeluar(baris.dataset.id); return; }
  if (!baris || !bisa("act_absensi")) return;
  const id = baris.dataset.id;
  const tgl = S.tgl || S.hariIni;
  const d = S.hariData[tgl];
  const b = ev.target.closest("[data-ab]");
  if (b) {
    const kini = d.abs[id] ? d.abs[id][0] : "";
    const st = kini === b.dataset.ab ? "" : b.dataset.ab;          // ketuk lagi = batalkan
    setAbsen(id, st, st && st !== "Hadir" && d.abs[id] ? d.abs[id][1] : "");
    gambarAbsensi();
    return;
  }
  if (ev.target.closest("[data-ket]")) {
    const x = d.abs[id];
    dialog({
      judul: "Keterangan " + esc(x[0].toLowerCase()), lebar: 420,
      isi: '<p class="kecil muted mb-2">' + esc(S.wbpMap[id].nm) + "</p><input class='inp' id='ketAbs' maxlength='150' placeholder='Misalnya: sidang, berobat' value='" + esc(x[1]) + "'>",
      tombol: [{ teks: "Batal", nilai: null }, { teks: "Simpan", nilai: true, kelas: "btn-primary", utama: true }],
      ambil: async (root) => root.querySelector("#ketAbs").value.trim() || " "
    }).then(v => {
      if (v === null || v === undefined) return;
      setAbsen(id, x[0], v.trim());
      gambarAbsensi();
    });
  }
}
async function tandaiSisaHadir() {
  const tgl = S.tgl || S.hariIni, d = S.hariData[tgl];
  const sisa = daftarHariIni(tgl, "").jadwal.filter(w => !d.abs[w.id]);
  if (!sisa.length) return;
  const ok = await konfirmasi("Tandai hadir?", "<b>" + sisa.length + "</b> WBP terjadwal yang belum diabsen akan ditandai <b>Hadir</b>. Yang izin/sakit/alpa bisa diubah sesudahnya.", { ok: "Tandai hadir" });
  if (!ok) return;
  sisa.forEach(w => setAbsen(w.id, "Hadir", ""));
  gambarAbsensi();
}

async function dialogKeluar(id) {
  const w = S.wbpMap[id];
  if (!w || !bisa("act_bebas")) return;
  const pilihan = ["Bebas", "Pindah rutan/lapas", "Lainnya"];

  const v = await dialog({
    judul: '<i class="fa-solid fa-door-open t-warn mr-2"></i>WBP keluar', lebar: 460,
    isi: '<div class="flex items-center gap-3 mb-3">' + avatar(w, 40) + '<div class="min-w-0"><div class="font-semibold">' + esc(w.nm) + '</div><div class="mini muted">' + esc([w.bl ? "Blok " + w.bl : "", (w.hr || []).join(", ")].filter(Boolean).join(" · ")) + "</div></div></div>" +
      '<div class="lbl">Alasan</div><div class="seg mb-3" id="klAlasan">' + pilihan.map(x => '<button type="button" data-v="' + x + '" class="' + (x === alasan ? "on" : "") + '" aria-pressed="' + (x === alasan) + '">' + x + "</button>").join("") + "</div>" +
      '<div class="grid sm:grid-cols-[150px_1fr] gap-3"><div><label class="lbl" for="klTgl">Tanggal keluar</label><input type="date" class="inp" id="klTgl" max="' + S.hariIni + '" value="' + (S.tgl || S.hariIni) + '"></div>' +
      '<div><label class="lbl" for="klKet">Keterangan (opsional)</label><input class="inp" id="klKet" maxlength="100" placeholder="mis. nomor surat bebas"></div></div>' +
      '<p class="bantu mt-3">WBP dipindahkan ke arsip: tidak muncul lagi di absensi, penilaian, dan papan juara. Riwayatnya tetap tersimpan, dan bisa dipulihkan dari menu Data WBP bila keliru.</p>',
    tombol: [{ teks: "Batal", nilai: null }, { teks: '<i class="fa-solid fa-door-open"></i>Catat keluar', nilai: true, kelas: "btn-danger", utama: true }],
    saatBuka: (root) => root.querySelectorAll("#klAlasan button").forEach(b => b.onclick = () => {
      alasan = b.dataset.v;
      root.querySelectorAll("#klAlasan button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
    }),
    ambil: (root) => {
      const tgl = root.querySelector("#klTgl").value;
      if (!tgl || tgl > S.hariIni) throw new Error("Isi tanggal keluar (tidak boleh di masa depan).");
      return { tgl: tgl, alasan: alasan, ket: root.querySelector("#klKet").value.trim() };
    }
  });
  if (!v) return;
  await aksi("tandaiKeluar", [S.token, id, v.tgl, v.alasan, v.ket], {
    teks: "Mencatat…",
    sesudah: () => {
      // isian absensi/nilai yang belum terkirim untuk WBP ini (sejak tanggal keluar) tidak dikirim lagi
      KIRIM.antre.forEach(x => { if (x.tgl >= v.tgl && x.items[id] && !x.jalan) delete x.items[id]; });
      KIRIM.antre = KIRIM.antre.filter(x => x.jalan || Object.keys(x.items).length);
      kirimSimpan();
      Object.keys(S.hariData).forEach(t => { if (t >= v.tgl) delete S.hariData[t].abs[id]; });
      w.ar = 1; w.kl = [v.tgl, v.alasan + (v.ket ? " - " + v.ket : "")];
      tampilStatusKirim();
      if (el("absDaftar")) gambarAbsensi();
      renderMenu();
      muatData({ latar: true });
    }
  });
}

// Dipanggil dari halaman lain (dashboard): buka pop-up nilai untuk satu WBP
function bukaPenilaianWbp(id, tgl) {
  if (!bisa("act_input_monitoring")) { if (window.dialogKartuWbp) dialogKartuWbp(id); return; }

}

function renderIsiNilai() {
  el("v-monitoring").querySelector("#bag-isi").innerHTML = '<div id="monInfo" class="mb-3"></div>' +
    '<div class="relative cari-besar mb-3"><i class="fa-solid fa-magnifying-glass"></i><input class="inp" id="monCari" placeholder="Cari nama atau blok…" autocomplete="off" enterkeyhint="search" aria-label="Cari nama WBP" value="' + esc(MON.cari) + '"></div>' +
    '<div id="monDaftar" class="daftar"></div>';

async function gantiTanggalNilai() {
  const t = S.tgl || S.hariIni;
  el("monTgl").innerHTML = kontrolTanggal();
  pasangTanggal(el("monTgl"), gantiTanggalNilai);
  if (!S.hariData[t]) {
    el("monInfo").innerHTML = "";
    el("monDaftar").innerHTML = '<div class="kosong-isi"><i class="fa-solid fa-circle-notch fa-spin mr-2"></i>Memuat penilaian ' + esc(tglPanjang(t)) + "…</div>";
    try { await muatHari(t); } catch (e) { tanganiGalat(e); return; }
